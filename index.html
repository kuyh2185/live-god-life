  function btn(label, variant, onclick){
    return '<button class="btn btn-'+variant+'" onclick="'+onclick+'">'+esc(label)+'</button>';
  }
  function stepperHtml(label, value, onDec, onInc){
    return '<div class="stepper"><span class="lbl">'+label+'</span><div class="stepper-ctrl">' +
      '<button class="stepper-btn" onclick="'+onDec+'">−</button><span class="stepper-val">'+value+'</span>' +
      '<button class="stepper-btn" onclick="'+onInc+'">+</button></div></div>';
  }
  var DURATION_QUICK_PRESETS = [15,30,60];
  function durationPicker(duration, ns){
    var baseNs = ns.replace(/Duration$/,'');
    var html = '<div class="preset-row">';
    DURATION_QUICK_PRESETS.forEach(function(m){
      html += chip(formatDurationHM(m), duration===m, "appAction('"+ns+"Preset',"+m+")", true);
    });
    html += '</div>';
    html += renderDurationStepper(duration, baseNs);
    return html;
  }

  // ── 시작 전 알림 (몇 분 전에 알려줄지) — 위/아래 화살표 스테퍼로 5분 단위로 조정해요.
  // 반복 일정은 이 값을 한 번 정해두면 매 회차마다 계속 쓰이고(일정 자체에 저장),
  // 일회성 일정은 추가할 때(빠른 추가·새 일정 폼) 그때그때 골라요.
  var REMINDER_MAX_HOUR = 3;
  function reminderLabel(m){
    if(!m) return '알림 없음';
    return formatDurationHM(m)+' 전';
  }
  function reminderRefFor(ns){
    if(ns==='form') return { get:function(){ return ui.form.draft.reminderMinutes; }, set:function(v){ ui.form.draft.reminderMinutes = v; } };
    if(ns==='quickAdd') return { get:function(){ return ui.quickAdd.reminderMinutes; }, set:function(v){ ui.quickAdd.reminderMinutes = v; } };

  }
  function reminderPicker(value, ns, label){
    return '<div class="stepper-row">'+stepperHtml(label||'시작 전 알림', reminderLabel(value),
      "appAction('reminderStep','"+ns+"',-5)", "appAction('reminderStep','"+ns+"',5)")+'</div>';
  }

  // ── 겹친 일정 해결 시트 (v40: 컨디션 조정과 완전히 분리) ──
  // 겹침 해결과 "오늘 피곤해요" 조정은 발생 원인도, 해야 할 행동도 달라서 하나의 화면에
  // 묶여 있으면 뭘 고치는 화면인지 헷갈린다는 피드백으로 화면을 둘로 나눴어요.
  function renderOverlapModal(){
    var dateKey = curDateKey();
    var overlaps = computeOverlapPairs(dateKey);
    var body = '';
    if(overlaps.length===0){
      body += '<div class="sheet-sub">겹치는 일정이 모두 해결됐어요.</div>';
    } else {
      var anyMissingSlot = false;
      overlaps.forEach(function(p){
        var isRecurring = p.b.kind==='session';
        var deleteLabel = isRecurring ? '오늘만 빼기' : '삭제하기';
        body += '<div class="fatigue-item" style="flex-direction:column; align-items:stretch; gap:8px;">';
        body += '<div><div class="lbl">'+esc(p.a.label)+' · '+esc(p.b.label)+'</div>' +
          '<div class="sub">시간이 겹쳐요. "'+esc(p.b.label)+'"을(를) 어떻게 할까요?</div></div>';
        body += '<div class="preset-row" style="justify-content:flex-start; margin-top:0;">';
        body += chip(deleteLabel, false, "appAction('overlapDelete','"+p.b.kind+"','"+p.b.refId+"')", true);
        if(p.emptySlot){
          var slotHm = parseHM(p.emptySlot);
          body += chip(meridiemTimeLabel(slotHm.hour,slotHm.minute)+'로 옮기기', false,
            "appAction('overlapMoveToSlot','"+p.b.kind+"','"+p.b.refId+"','"+p.emptySlot+"')", true);
        } else {
          anyMissingSlot = true;
        }
        body += chip('직접 수정하기', false, "appAction('overlapEditManually','"+p.b.kind+"','"+p.b.refId+"')", true);
        body += '</div></div>';
      });
      if(anyMissingSlot) body += '<div class="compare-note">오늘 안에 딱 맞는 빈 시간이 없는 항목은 "직접 수정하기"로 다른 날짜나 소요시간을 조정해보세요.</div>';
    }
    body += '<button class="btn btn-ghost" style="margin-top:14px;" onclick="appAction(\'overlapClose\')">'+(overlaps.length===0?'닫기':'그대로 두고 닫기')+'</button>';
    return '<div class="overlay" onclick="appAction(\'overlapClose\')"><div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-title">겹치는 일정을 조정해요</div>'+body+'</div></div>';
  }

  // ── 컨디션(피곤함) 조정 시트 ──
  // v40: 변경 요약을 맨 위에 먼저 보여주고(몇 개가 바뀌는지, 얼마나 줄어드는지), 전체
  // 좌우 타임라인은 "전체 시간표로 비교하기"를 펼쳐야 나오게 순서를 바꿨어요. 긴 타임라인을
  // 먼저 끝까지 읽어야 뭐가 바뀌는지 알 수 있던 문제를 해결하기 위해서예요.
  // v46: "직접 수정"과 "오늘은 내가 정할게요"가 둘 다 "내가 알아서 할게요"로 읽혀서 헷갈린다는
  // 피드백으로 하나로 합쳤어요("다르게 조정하기"). 그 안에서 AI 서버가 연결돼 있으면 자유
  // 문장으로("집 정리 때문에 바빠요" 같은, 미리 정해둔 minVersion이 없는 이유도) 요청할 수
  // 있고, 없으면 예전처럼 일정별 수동 선택으로 안내해요. 전/후 비교도 좁은 2단 타임라인 대신
  // 한 줄씩 넓게 보여주는 목록(.compare-row)으로 바꿔서 좀 더 여유 있게 읽히게 했어요.
  function renderEnergyModal(){
    var f = ui.energy;
    var dateKey = curDateKey();
    var s = computeFatigueSuggestion(dateKey, new Date());
    var hasFatigueContent = s.withMinVersion.length>0 || s.withoutMinVersion.length>0;
    var body = '';
    if(f.view==='summary'){
      if(!hasFatigueContent){
        body += '<div class="sheet-sub">지금은 줄이거나 건너뛸 만한 일정이 없어요.</div>';
      } else {
        var changeList = buildRuleBasedChangeList(s);
        var totalReduced = 0;
        s.withMinVersion.forEach(function(item){ totalReduced += Math.max(0, item.duration - item.miniDuration); });
        s.withoutMinVersion.forEach(function(item){ totalReduced += item.duration; });

        var reasonCheckin = state.checkins[dateKey];
        body += '<div class="sheet-sub" style="margin-top:0;">'+buildAdjustReason(dateKey, reasonCheckin, changeList.length, totalReduced)+'</div>';
        body += '<div class="compare-total">예상 부담 '+formatDurationHM(totalReduced)+' 감소 · 나머지 일정은 그대로 유지돼요</div>';
        body += '<div class="compare-block">'+renderChangeRows(changeList)+'</div>';
        body += '<div class="compare-note">건너뛰는 일정은 오늘 하루만 적용돼요. 반복 일정 자체는 그대로 남아있고, 내일부터는 원래 시간으로 다시 나와요.</div>';
        body += '<div style="margin-top:14px;">';
        body += btn('제안대로 적용', 'primary', "appAction('energyApplyAll')");
        body += btn('다르게 조정하기', 'secondary', "appAction('energySetView','adjust')");
        body += '</div>';
      }
    } else if(f.view==='adjust'){
      body += renderEnergyAdjustView(f);
    } else {
      // 자동 제안(s)과 달리, 수동 선택은 컨디션 체크와 무관하게 오늘 손댈 수 있는 일정
      // 전체를 보여주고 항목별로 가볍게 줄이기(있으면)·건너뛰기 중 직접 고르게 해요.
      var manualOptions = computeManualAdjustOptions(dateKey, new Date());
      body += '<div class="sheet-sub">일정별로 하나씩 골라볼게요.</div>';
      body += '<div style="max-height:340px; overflow-y:auto; margin-top:8px;">';
      manualOptions.withMinVersion.forEach(function(item){
        var done = f.doneIds.indexOf(item.refId)!==-1;
        body += '<div class="fatigue-item"><div style="flex:1;"><div class="lbl">'+esc(item.label)+'</div>' +
          '<div class="sub">가볍게: '+esc(item.minVersion)+' · '+formatDurationHM(item.miniDuration)+'</div></div>';
        body += done ? badge('오늘은 짧게 변경됨','success') : '<button class="fatigue-item-btn" onclick="appAction(\'energyApplyOne\',\''+item.refId+'\')">가볍게 바꾸기</button>';
        body += '</div>';
      });
      manualOptions.withoutMinVersion.forEach(function(item){
        var done2 = f.doneIds.indexOf(item.refId)!==-1;
        body += '<div class="fatigue-item"><div style="flex:1;"><div class="lbl">'+esc(item.label)+'</div><div class="sub">가볍게 할 수 있는 버전이 없어요</div></div>';
        body += done2 ? badge('오늘만 건너뜀','default') : '<button class="fatigue-item-btn" onclick="appAction(\'energySkipOne\',\''+item.refId+'\')">오늘은 건너뛰기</button>';
        body += '</div>';
      });
      if(manualOptions.withMinVersion.length===0 && manualOptions.withoutMinVersion.length===0){
        body += '<div class="section-sub" style="margin-top:0;">오늘은 손댈 만한 일정이 없어요.</div>';
      }
      body += '</div>'+btn('뒤로', 'ghost', "appAction('energySetView','summary')");
    }
    body += '<button class="btn btn-ghost" style="margin-top:14px;" onclick="appAction(\'energyClose\')">닫기</button>';
    return '<div class="overlay" onclick="appAction(\'energyClose\')"><div class="sheet sheet-wide" onclick="event.stopPropagation()">' +
      '<div class="sheet-title">오늘 좀 피곤하시군요</div>'+body+'</div></div>';
  }

  // "다르게 조정하기" — AI 서버가 연결돼 있으면 자유 문장으로 요청받아 서버(Claude)가 오늘
  // 남은 일정 중 뭘 줄이고 뭘 건너뛸지 직접 판단하게 해요(미리 정해둔 minVersion이 없는
  // 일이라도, 예를 들어 "집 정리 때문에 바빠요"도 그 자리에서 적당한 축소안을 만들어줘요).
  // 서버가 없으면 예전처럼 일정별 수동 선택(manual)으로 안내해요.
  function renderEnergyAdjustView(f){
    var serverUrl = (state.settings.aiServer.url||'').trim();
    var body = '';
    if(!serverUrl){
      body += '<div class="sheet-sub" style="margin-top:0;">AI 서버를 연결하면 "집 정리 때문에 바빠요"처럼 자유롭게 설명해서 요청할 수 있어요(설정 → 비서). 지금은 서버가 연결돼 있지 않아서, 일정별로 직접 골라볼게요.</div>';
      body += btn('일정별로 직접 고르기', 'primary', "appAction('energySetView','manual')");
    } else if(f.aiPlan){
      body += '<div class="sheet-sub" style="margin-top:0;">'+esc(f.aiPlan.summary||'이렇게 조정하면 어떨까요?')+'</div>';
      var aiChangeList = buildChangeListFromAiPlan(f.aiPlan, f.aiItems||[]);
      if(aiChangeList.length===0){
        body += '<div class="sheet-sub">지금 상황으로는 딱히 줄이거나 뺄 만한 일정을 찾지 못했어요.</div>';
      } else {
        body += '<div class="compare-block">'+renderChangeRows(aiChangeList)+'</div>';
      }
      body += '<div style="margin-top:14px;">';
      if(aiChangeList.length>0) body += btn('이대로 적용', 'primary', "appAction('energyApplyAiPlan')");
      body += btn('다시 요청하기', 'secondary', "appAction('energyRetryAi')");
      body += '</div>';
    } else {
      body += '<div class="sheet-sub" style="margin-top:0;">오늘 상황을 자유롭게 설명해주세요. 미리 정해둔 목록에 없는 이유라도 괜찮아요.</div>';
      body += '<textarea class="textfield" style="min-height:84px; resize:vertical; font-family:inherit;" placeholder="예: 오늘 집 정리 때문에 시간이 많이 필요해요" oninput="appAction(\'setEnergyAiText\',this.value)">'+esc(f.aiText||'')+'</textarea>';
      if(f.aiError) body += '<div class="sheet-sub" style="color:var(--danger); margin-top:-6px;">'+esc(f.aiError)+'</div>';
      body += btn(f.aiLoading ? '요청하는 중…' : 'AI에게 요청하기', 'primary', f.aiLoading ? "void(0)" : "appAction('energyRequestAi')");
      body += btn('일정별로 직접 고를게요', 'ghost', "appAction('energySetView','manual')");
    }
    body += btn('뒤로', 'ghost', "appAction('energySetView','summary')");
    return body;
  }

  // 규칙 기반 제안(computeFatigueSuggestion 결과)을 renderChangeRows가 그릴 수 있는
  // 공통 모양({time, fromLabel, fromDuration, toLabel, toDuration, skip})으로 바꿔요.
  function buildRuleBasedChangeList(s){
    var list = [];
    s.withMinVersion.forEach(function(item){
      list.push({ time:item.time, fromLabel:item.label, fromDuration:item.duration,
        toLabel:item.minVersion, toDuration:item.miniDuration, skip:false });
    });
    s.withoutMinVersion.forEach(function(item){
      list.push({ time:item.time, fromLabel:item.label, fromDuration:item.duration,
        toLabel:null, toDuration:null, skip:true });
    });
    list.sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    return list;
  }
  // AI 서버가 돌려준 조정안(refId·kind별 decision)을, 요청할 때 같이 보낸 items 목록과
  // 매칭해서 같은 공통 모양으로 바꿔요. 서버가 모르는 refId를 보내거나 decision이 'keep'인
  // 항목은 조용히 걸러요.
  function buildChangeListFromAiPlan(plan, items){
    var byId = {};
    items.forEach(function(it){ byId[it.kind+':'+it.refId] = it; });
    var list = [];
    (plan.adjustments||[]).forEach(function(adj){
      var it = byId[adj.kind+':'+adj.refId];
      if(!it || adj.decision==='keep') return;
      if(adj.decision==='skip'){
        list.push({ time:it.time, fromLabel:it.label, fromDuration:it.durationMinutes, toLabel:null, toDuration:null, skip:true, refId:adj.refId, kind:adj.kind });
      } else if(adj.decision==='shrink'){
        list.push({ time:it.time, fromLabel:it.label, fromDuration:it.durationMinutes,
          toLabel: adj.newLabel || it.label, toDuration: adj.newDurationMinutes || it.durationMinutes,
          skip:false, refId:adj.refId, kind:adj.kind });
      }
    });
    list.sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    return list;
  }
  // 전/후 비교 목록 — 좁은 2단 타임라인 대신, 한 항목씩 [원래] → [바뀐 뒤]를 넓게 보여줘요
  // (.compare-row/.compare-col은 이 화면 전용으로 미리 만들어져 있었지만 안 쓰이고 있었어요).
  function renderChangeRows(changeList){
    var h = '';
    changeList.forEach(function(c){
      var hm = parseHM(c.time), timeLabel = meridiemTimeShort(hm.hour, hm.minute);
      h += '<div class="compare-row">';
      h += '<div class="compare-col old"><div class="lbl">'+esc(c.fromLabel)+'</div><div class="meta">'+timeLabel+' · '+formatDurationHM(c.fromDuration)+'</div></div>';
      h += '<div class="compare-arrow">→</div>';
      if(c.skip) h += '<div class="compare-col new skip"><div class="lbl">오늘은 건너뛰기</div><div class="meta">'+timeLabel+'</div></div>';
      else h += '<div class="compare-col new reduced"><div class="lbl">'+esc(c.toLabel)+'</div><div class="meta">'+timeLabel+' · '+formatDurationHM(c.toDuration)+'</div></div>';
      h += '</div>';
    });
    return h;
  }

  // 자동조정이 왜 이렇게 제안됐는지 한 줄로 설명해요 — 근거 없이 "줄일게요"만 보여주면
  // 신뢰하기 어렵다는 피드백을 반영했어요. 오늘 체크인(컨디션)·브리핑(개수·시간)·최근 실패
  // 패턴 중 있는 근거를 골라 조합해요.
  function buildAdjustReason(dateKey, checkin, changeCount, totalReducedMinutes){
    var parts = [];
    if(checkin && checkin.condition==='low') parts.push('오늘 컨디션이 안 좋다고 하셨고');
    else if(hasAutoFatigueTrigger(dateKey)) parts.push('오늘 일정이 깨어있는 시간보다 많아서');
    else parts.push('직접 오늘 일정을 조정하고 싶다고 하셨어서');
    var insight = computeRecurringInsight();
    if(insight) parts.push('"'+esc(insight.event.label)+'"을 최근 자주 못 지켰던 것도 고려해서');
    var mustDoLabels = (checkin && checkin.mustDoLabels) || [];
    var mustDoPart = mustDoLabels.length ? ('"'+mustDoLabels.map(esc).join('", "')+'"만 남기고 ') : '';
    return parts.join(', ') +
      ' '+mustDoPart+changeCount+'개 일정을 오늘 하루 빼고, 부담을 '+formatDurationHM(totalReducedMinutes)+' 덜어드리려고 해요.';
  }

  // ── 오늘 컨디션 체크인 시트 ──
  // v47: "오늘 쓸 수 있는 시간"을 직접 고르게 하는 대신, 기상~취침 시간에서 오늘 일정을 뺀
  // 여유 시간을 계산해서 보여줘요(선택이 아니라 정보). "부담"은 컨디션과 사실상 같은 걸
  // 묻는 항목이라 빼고 컨디션 하나로 합쳤고, 컨디션도 안 좋음/좋음 둘 중 하나만 고르게 했어요.
  function renderCheckinModal(){
    var c = ui.checkin;
    var dateKey = todayKey();
    var candidateRows = buildTimetableForDate(dateKey).filter(function(r){ return !r.isFixed; });
    var availableMin = computeAvailableMinutesToday(dateKey);
    var body = '<div class="sheet-sub" style="margin-bottom:6px;">답한 내용은 오늘 제안에만 참고하고, 다 채우지 않아도 괜찮아요.</div>';
    body += '<div class="settings-row" style="padding:12px 0;"><div><div class="t">오늘 쓸 수 있는 시간</div>' +
      '<div class="d">기상~취침 시간에서 오늘 일정을 뺀 여유 시간이에요.</div></div>' +
      '<div style="font-size:15px; font-weight:800; flex-shrink:0; color:'+(availableMin<0?'var(--danger)':'var(--text)')+';">' +
      (availableMin<0 ? '−'+formatDurationHM(-availableMin) : formatDurationHM(availableMin)) + '</div></div>';
    body += '<div class="field-label">지금 컨디션은요?</div><div class="preset-row">';
    CONDITION_OPTIONS.forEach(function(o){ body += chip(o[1], c.condition===o[0], "appAction('checkinSetCondition','"+o[0]+"')"); });
    body += '</div>';
    // 컨디션이 "좋음"이면 오늘 일정을 그대로 다 할 수 있다는 뜻이라, "꼭 해야 하는 일"을 따로
    // 고를 이유가 없어요("안 좋음"일 때만 무엇을 남길지가 의미 있는 질문이에요).
    if(c.condition==='low'){
      body += '<div class="field-label">오늘 꼭 해야 하는 일은요? (여러 개 골라도 돼요)</div>';
      if(candidateRows.length===0){
        body += '<div class="section-sub" style="margin-top:0;">오늘 등록된 일정이 없어요.</div>';
      } else {
        body += '<div class="preset-row">';
        candidateRows.forEach(function(r){ body += chip(r.label, c.mustDoIds.indexOf(r.entryId)!==-1, "appAction('checkinSetMustDo','"+r.entryId+"')", true); });
        body += '</div>';
      }
      body += '<div class="section-sub" style="margin-top:6px;">저장하면 바로, 위에서 고른 것만 남기고 나머지를 오늘 제외할지 물어볼게요.</div>';
    }
    body += '<div style="margin-top:16px;">'+btn('저장', 'primary', "appAction('checkinSave')")+btn('취소', 'ghost', "appAction('checkinClose')")+'</div>';
    return '<div class="overlay" onclick="appAction(\'checkinClose\')"><div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-title">오늘 컨디션 체크</div>'+body+'</div></div>';
  }

  // ── 오늘 기록 SNS 공유 — 이미지 카드를 만들어서 인스타그램 스토리/카카오톡/X 등에 공유해요.
  // 웹 프로토타입에서는 브라우저의 Web Share API(navigator.share)를 쓰는데, 이게 지원되지 않는
  // 환경(대부분의 데스크톱 브라우저)에서는 이미지 저장으로 대신해요. 실제 앱에서는
  // react-native-share/expo-sharing으로 카카오톡·인스타그램 등 타겟을 직접 골라 공유할 수 있어요.
  // 오늘 시간표를 공유 카드용으로 계산해요(모달 상세 목록·캔버스 둘 다 이 함수를 같이 써요).
  function getShareRows(){
    var dateKey = todayKey();
    var rows = buildTimetableForDate(dateKey);
    var now = new Date(); var nowMinutes = now.getHours()*60+now.getMinutes();
    return rows.map(function(r){ return Object.assign({}, r, {live: deriveLiveStatus(r, nowMinutes)}); });
  }
  function renderShareModal(){
    var sh = ui.share;
    var body = '<div class="sheet-sub" style="margin-bottom:10px;">이미지 카드를 만들어서 인스타그램 스토리, 카카오톡, X 등에 공유할 수 있어요. 기본은 통계만 보여주고, 일정 이름은 직접 켜야만 나와요.</div>';
    body += '<div style="border-radius:14px; overflow:hidden; border:1px solid var(--border); background:#fff;">' +
      '<canvas id="share-canvas" style="width:100%; display:block;"></canvas></div>';
    body += '<div class="settings-row" style="border-bottom:none;">' +
      '<div><div class="t">일정 상세 포함</div><div class="d">오늘 일정 이름을 카드에 같이 보여줘요</div></div>' +
      toggleTrack(sh.includeDetails, "appAction('shareToggleDetails')") + '</div>';
    if(sh.includeDetails){
      var rowsForToggle = getShareRows();
      body += '<div class="share-detail-list">';
      rowsForToggle.forEach(function(r){
        var hidden = sh.hiddenIds.indexOf(r.refId)!==-1;
        body += '<div class="share-detail-row'+(hidden?' hidden':'')+'">' +
          '<span class="dot" style="background:'+itemColor(r.refId)+';"></span>' +
          '<span class="lbl">'+esc(r.label)+'</span>' +
          '<button class="share-eye-btn" onclick="appAction(\'shareToggleItem\',\''+r.refId+'\')">'+(hidden?'숨김 · 다시 보이기':'보임 · 이 항목 숨기기')+'</button>' +
          '</div>';
      });
      body += '</div>';
    }
    body += '<div style="margin-top:14px;">' +
      btn('공유하기', 'primary', "appAction('shareSend')") +
      btn('이미지 저장', 'secondary', "appAction('shareDownload')") +
      btn('닫기', 'ghost', "appAction('shareClose')") +
      '</div>';
    return '<div class="overlay" onclick="appAction(\'shareClose\')"><div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-title">오늘 기록 공유하기</div>'+body+'</div></div>';
  }
  // 러닝 공유 앱(나이키런클럽 등) 화면처럼, 큰 숫자 하나(오늘 갓생 달성률)를 히어로로 두고
  // 그 아래 페이스/시간/칼로리 같은 통계 3칸을 기본으로 보여줘요. 일정 이름이 쭉 나열되면
  // 사생활 노출 우려가 있어서, 상세 목록은 "일정 상세 포함"을 켰을 때만(그리고 숨긴 항목은
  // 빼고) 그려요.
  function drawShareCard(){
    var canvas = document.getElementById('share-canvas');
    if(!canvas) return;
    var sh = ui.share;
    var W = 720, H = 980;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#F1ECFB'); grad.addColorStop(0.35,'#F7F5EE'); grad.addColorStop(1,'#F7F5EE');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    var dateKey = todayKey();
    var rowsLive = getShareRows();
    var doneCount = rowsLive.filter(function(r){ return r.live==='done_full'||r.live==='done_partial'; }).length;
    var totalCount = rowsLive.length;
    var pct = totalCount>0 ? Math.round(doneCount/totalCount*100) : 100;
    var streak = computeStreakDays();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#182420'; ctx.font = '800 26px sans-serif';
    ctx.fillText('🌱 갓생살자', 44, 58);
    ctx.fillStyle = '#5B665F'; ctx.font = '600 15px sans-serif';
    ctx.fillText(formatKoreanDate(dateKey)+' · '+streak+'일차', 44, 84);

    // 히어로 숫자 — 오늘 갓생 달성률
    ctx.fillStyle = '#182420'; ctx.font = '800 118px sans-serif';
    ctx.fillText(pct+'%', 40, 218);
    ctx.fillStyle = '#5B665F'; ctx.font = '700 17px sans-serif';
    ctx.fillText('오늘 갓생 달성률', 46, 250);

    // 통계 2칸 (완료 개수 · 연속 일수) — 총 소요시간은 "하루를 얼마나 아득바득 채웠는지"를
    // 자랑하는 느낌이라 빼고, 목표를 얼마나 꾸준히 이어가는지에 집중해요.
    var stats = [ ['완료', doneCount+'/'+totalCount], ['연속', streak+'일'] ];
    var colW = W/2;
    ctx.textAlign = 'center';
    stats.forEach(function(s,i){
      var cx = colW*i + colW/2;
      ctx.fillStyle = '#182420'; ctx.font = '800 25px sans-serif';
      ctx.fillText(s[1], cx, 308);
      ctx.fillStyle = '#8C968E'; ctx.font = '600 12.5px sans-serif';
      ctx.fillText(s[0], cx, 331);
    });
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#E2E7E0'; ctx.beginPath(); ctx.moveTo(40,360); ctx.lineTo(W-40,360); ctx.stroke();

    if(sh.includeDetails){
      var visibleRows = rowsLive.filter(function(r){ return sh.hiddenIds.indexOf(r.refId)===-1; });
      var y = 398, rowH = 42;

        if(y > H-70) return;
        var hm = parseHM(r.time);

        ctx.beginPath(); ctx.arc(52, y-6, 7, 0, Math.PI*2); ctx.fill();

        ctx.fillText(timeRangeShort(hm, r.duration), 72, y);
        ctx.fillStyle = '#182420'; ctx.font = '700 16px sans-serif';
        var label = r.label.length>11 ? r.label.slice(0,11)+'…' : r.label;

    ctx.font = '400 13px sans-serif'; ctx.fillStyle = '#8C968E';

  // claude.ai 아티팩트로 열렸을 때는 일반 <a download> 링크가 동작하지 않아서(뷰어가 다운로드
  // 권한을 안 줌), 아티팩트의 downloads 기능(window.claude.use('downloads'))으로 저장을 대신 맡겨요.
  // 아티팩트가 아닌 곳(예: 파일로 직접 연 경우)에서는 window.claude가 아예 없으니 기존 방식을 써요.
  function downloadShareCard(){
    var canvas = document.getElementById('share-canvas');
    if(!canvas) return;
    function legacyDownload(){
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'godsaeng-today.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(downloads){
        if(!downloads){ legacyDownload(); return; }
        canvas.toBlob(function(blob){
          if(!blob){ legacyDownload(); return; }
          downloads.save({filename:'godsaeng-today.png', data:blob}).catch(function(){});
        }, 'image/png');
      }).catch(legacyDownload);
    } else {
      legacyDownload();
    }
  }

  // 날짜를 직접 달력에서 골라요(예전엔 -/+ 스테퍼로 하루씩만 넘길 수 있었는데, 몇 주 뒤
  // 날짜를 잡으려면 여러 번 눌러야 해서 답답했어요). anchorKey는 폼을 열었을 때의 날짜(고정,
  // 달력이 계속 그 달 기준으로 안정적으로 움직이게 해요), monthOffset은 anchorKey 기준 이동한
  // 달 수, selectedKey는 지금 골라둔 날짜예요.
  function renderDateCalendar(anchorKey, monthOffset, selectedKey){

    for(var i=0;i<firstWd;i++) html += '<div class="cal-cell cal-cell-blank"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var dk = year+'-'+pad2(month+1)+'-'+pad2(d);

    [['오늘',0],['내일',1],['모레',2]].forEach(function(o){
      var key = addDaysKey(todayKey(), o[1]);

  // ── 히스토리 ──
  function labelForEntry(refId, kind){
    if(kind==='session'){ var e = state.events.find(function(x){return x.id===refId;}); return e ? e.label : '(삭제된 일정)'; }
    var a = state.adhocEntries.find(function(x){return x.id===refId;}); return a ? a.label : '(삭제된 일정)';
  }
  // 완료율 계산 기준: 완료=100%, 조금 함=50%, 못함=0%, 시간이 지난 뒤 건너뜀=0%.
  // "미리 건너뜀"(비서 제안으로 시작 전에 뺀 것)은 사용자가 다시 합의한 계획이 아예 없던
  // 일이 되는 것과 같아서 비율 계산 자체에서 빼요(분모에서 제외) — 가볍게 버전을 완료했다면
  // 그 자체로 100%예요(따로 감점하지 않아요).
  function computeDayStats(dateKey){
    var all = state.scheduleEntries.filter(function(e){ return e.dateKey===dateKey; });
    if(!all.length) return null;
    var counted = all.filter(function(e){ return e.status!=='excused'; });
    var score = 0;
    counted.forEach(function(e){
      if(e.status==='done_full') score += 1; else if(e.status==='done_partial') score += 0.5;
    });
    var ratio = counted.length ? score/counted.length : null;
    return { count: all.length, ratio: ratio, entries: all, counted: counted };
  }
  // 최근 7일치 이행률(제외 대상은 계산에서 빼고) — 주간 요약 카드에서 써요.
  // 공유 카드에 넣을 "며칠째 갓생 중"인지 계산 — 오늘부터 거슬러 올라가며, 그날 일정이 있었는데
  // 완료 기록(완료/조금 함)이 하나도 없으면 스트릭이 끊긴 걸로 봐요. 일정이 아예 없던 날은
  // 스트릭에 영향을 주지 않고 건너뛰어요. 오늘은 아직 하루가 끝나지 않았을 수 있으니, 기록이
  // 없다고 바로 스트릭을 끊지는 않아요.
  function computeStreakDays(){
    var streak = 0, day = todayKey();
    for(var i=0;i<365;i++){
      var wd = weekdayOfKey(day);
      var scheduled = state.events.some(function(ev){ return !ev.paused && ev.days.indexOf(wd)!==-1; }) ||
        state.adhocEntries.some(function(en){ return en.dateKey===day; });
      if(scheduled){
        var hasAnyDone = state.scheduleEntries.some(function(e){
          return e.dateKey===day && (e.status==='done_full' || e.status==='done_partial');
        });
        if(hasAnyDone) streak++;
        else if(day !== todayKey()) break;
      }
      day = addDaysKey(day,-1);
    }
    return Math.max(streak,1);
  }
  function computeWeekRatio(endDateKey){
    var days = []; var cursor = endDateKey;
    for(var i=0;i<7;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var score = 0, counted = 0;
    state.scheduleEntries.forEach(function(e){
      if(days.indexOf(e.dateKey)===-1 || e.status==='excused') return;
      counted++;
      if(e.status==='done_full') score += 1; else if(e.status==='done_partial') score += 0.5;
    });
    return counted ? score/counted : null;
  }
  // 최근 7일 동안 "못함/건너뜀"으로 2번 이상 기록된 일정 중 가장 잦은 것 — 없으면 안 보여줘요.
  function mostPostponedLabel(){
    var days = []; var cursor = todayKey();
    for(var i=0;i<7;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var counts = {};
    state.scheduleEntries.forEach(function(e){
      if(days.indexOf(e.dateKey)===-1) return;
      if(e.status!=='skipped' && e.status!=='done_none') return;
      var label = labelForEntry(e.refId, e.kind);
      counts[label] = (counts[label]||0)+1;
    });
    var best = null, bestCount = 0;
    Object.keys(counts).forEach(function(k){ if(counts[k]>bestCount){ best = k; bestCount = counts[k]; } });
    return bestCount>=2 ? best : null;
  }
  // 최근 14일 동안 특정 반복 일정을 절반 이상 "못함/건너뜀"으로 기록했으면, 그 패턴을
  // 다음 계획에 반영할 수 있게 알려줘요(시간대를 옮기거나, 가볍게 버전을 아예 기본으로).
  // "미리 건너뜀"(비서가 먼저 뺀 것)은 사용자 실패가 아니라 분모에서도 빼요.
  function computeRecurringInsight(){
    var days = []; var cursor = todayKey();
    for(var i=0;i<14;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var best = null;
    state.events.forEach(function(ev){
      if(ev.paused) return;
      var total = 0, fail = 0;
      days.forEach(function(dk){
        if(ev.days.indexOf(weekdayOfKey(dk))===-1) return;
        var entry = findScheduleEntry(ev.id+'-'+dk);
        if(!entry || entry.status==='excused') return;
        total++;
        if(entry.status==='skipped' || entry.status==='done_none') fail++;
      });
      if(total>=3 && fail/total>=0.5 && (!best || fail>best.fail)) best = {event:ev, fail:fail, total:total};
    });
    return best;
  }
  function formatKoreanDate(dk){
    var p = dk.split('-').map(Number);
    var wd = WEEKDAY_LABELS[new Date(p[0],p[1]-1,p[2]).getDay()];
    return p[1]+'월 '+p[2]+'일 ('+wd+')';
  }
  // 매일매일의 성취를 한눈에 볼 수 있도록, 하루 단위 리스트 대신 월간 그리드로 보여주고
  // 이행률에 따라 한 색(보라)의 농도만 달라지게 해요 — 이 앱은 사용자를 다그치지 않는 게
  // 정체성이라, 성공/실패 느낌의 초록·빨강 대신 중립적인 단계로 표현해요.
  function renderHistoryCalendar(){

      '<div class="t">'+year+'년 '+(month+1)+'월</div>' +

    for(var i=0;i<firstWd;i++) html += '<div class="cal-cell cal-cell-blank"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var dk = year+'-'+pad2(month+1)+'-'+pad2(d);

      var stats = isFuture ? null : computeDayStats(dk);
      var cls = 'cal-cell', styleAttr = '', pctLabel = '';
      if(weekdayOfKey(dk)===0 || koreanHolidayName(dk)) cls += ' holiday';
      if(isFuture) cls += ' future';
      else if(stats && stats.ratio!==null){

        pctLabel = pct+'%';
        if(pct>=100){ styleAttr = 'background:var(--cal-5-bg);color:var(--cal-5-text);'; cls += ' full'; }
        else if(pct>=75) styleAttr = 'background:var(--cal-4-bg);color:var(--cal-4-text);';
        else if(pct>=50) styleAttr = 'background:var(--cal-3-bg);color:var(--cal-3-text);';
        else if(pct>=25) styleAttr = 'background:var(--cal-2-bg);color:var(--cal-2-text);';
        else styleAttr = 'background:var(--cal-1-bg);color:var(--cal-1-text);';

      html += '<div class="'+cls+'"'+clickAttr+(styleAttr?' style="'+styleAttr+'"':'')+'>'+d+
        (pctLabel?'<span class="pct">'+pctLabel+'</span>':'')+'</div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span class="sw" style="background:var(--chip-bg);"></span>기록 없음&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-1-bg);"></span>0~24%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-2-bg);"></span>25~49%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-3-bg);"></span>50~74%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-4-bg);"></span>75~99%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-5-bg);"></span>100%</div>';
    return html;
  }
  function renderDayDetail(dateKey){
    var stats = computeDayStats(dateKey);
    var holidayName = koreanHolidayName(dateKey);
    var html = '<div class="day-detail"><div class="section-title" style="margin-top:0;">'+esc(formatKoreanDate(dateKey))+

  function formatSelectedDaysLabel(days){
    var sorted = days.slice().sort(function(a,b){ return a-b; });
    if(sorted.length===7) return '매일';
    if(sorted.length===1) return WEEKDAY_LABELS[sorted[0]]+'요일';
    var contiguous = true;
    for(var i=1;i<sorted.length;i++){ if(sorted[i] !== sorted[i-1]+1){ contiguous = false; break; } }
    if(contiguous) return WEEKDAY_LABELS[sorted[0]]+'~'+WEEKDAY_LABELS[sorted[sorted.length-1]];
    return sorted.map(function(d){ return WEEKDAY_LABELS[d]; }).join('·');

    var repDay = days[0];
    var daysLabel = formatSelectedDaysLabel(days);
    var body = '<div class="section-sub" style="margin-top:0;">매일 꼭 오는 필수 알림이에요 — 시간만 조절할 수 있어요. 요일을 여러 개 골라(예: 월~금) 그 요일들만 같은 시간으로 맞출 수 있어요.</div>';

    // 칩 대신 새 일정 폼의 "반복 요일"과 같은 고정 크기 원형 버튼(.day-dot)을 써요 — 칩은
    // 폭이 글자 길이에 따라 달라져서 7개가 한 줄에 다 안 들어가고 줄바꿈됐었어요.
    body += '<div class="day-row">';
    WEEKDAY_LABELS.forEach(function(lbl,d){
      body += '<button class="day-dot'+(days.indexOf(d)!==-1?' active':'')+'" onclick="appAction(\'toggleRoutineEditDay\','+d+')">'+lbl+'</button>';
    });
    body += '</div>';

    var wt = parseHM(r.wakeTimes[repDay]);
    body += '<div class="settings-row"><div><div class="t">기상 알림 + 컨디션 체크 · '+daysLabel+'</div>' +
      '<div class="d" style="max-width:none;">기상 시간에 알림으로 오늘 컨디션을 확인하고, 가벼운 스트레칭과 함께 오늘 일정을 바로 브리핑해줘요.</div></div></div>';
    body += '<div class="routine-expand"><div class="stepper-row">'+stepperHtml('기상 시간', meridiemTimeLabel(wt.hour,wt.minute), "appAction('routineTimeStep','wake',-30)", "appAction('routineTimeStep','wake',30)")+'</div>';
    body += '<button class="btn btn-secondary" onclick="appAction(\'previewWakeRoutine\')">지금 미리보기</button></div>';

    var st = parseHM(r.sleepTimes[repDay]);
    body += '<div class="settings-row"><div><div class="t">취침 알림 + 내일 일정 미리보기 · '+daysLabel+'</div>' +
      '<div class="d" style="max-width:none;">취침 시간에 알림으로 내일 일정을 미리 알려줘요.</div></div></div>';
    body += '<div class="routine-expand"><div class="stepper-row">'+stepperHtml('취침 시간', meridiemTimeLabel(st.hour,st.minute), "appAction('routineTimeStep','sleep',-30)", "appAction('routineTimeStep','sleep',30)")+'</div>';
    body += '<button class="btn btn-secondary" onclick="appAction(\'previewSleepRoutine\')">지금 미리보기</button></div>';

    body += '<div class="section-sub" style="margin-top:8px;">알림을 무음/진동/소리 중 어떻게 줄지는 설정 → 알림에서 바꿀 수 있어요.</div>';
    body += '<button class="btn btn-ghost" style="margin-top:14px;" onclick="appAction(\'closeRoutineModal\')">닫기</button>';
    return '<div class="overlay" onclick="appAction(\'closeRoutineModal\')"><div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-title">기상 · 취침 일정 설정</div>'+body+'</div></div>';
  }
  function toggleTrack(on, onclick){
    return '<button class="toggle-track'+(on?' on':'')+'" onclick="'+onclick+'"><div class="toggle-thumb"></div></button>';
  }

  // ───────────────────────── 액션 디스패치 ─────────────────────────
  window.appAction = function(name){
    var args = Array.prototype.slice.call(arguments, 1);
    var now = new Date();
    switch(name){
      case 'closeBanner': ui.bannerOpen = false; break;
      case 'setTab': ui.tab = args[0]; if(args[0]!=='settings') ui.settingsSection = null; break;
      case 'setDay': ui.dayOffset = args[0]; ui.briefingDismissed = false; ui.overlapDismissed = false; break;
      case 'dismissBriefingAction': ui.briefingDismissed = true; break;
      case 'setScheduleTab': ui.scheduleTab = args[0]; break;
      case 'toggleEventPaused': toggleEventPaused(args[0]); return;

      case 'openSheet': {
        var dateKey = curDateKey();
        ui.sheet = { entryId: args[0], dateKey: dateKey, view:'main', draftTime:'09:00', draftDuration:30, pendingStatus:null };
        var row = findRow(args[0], dateKey);
        if(row){ ui.sheet.draftTime = row.time; ui.sheet.draftDuration = row.duration; }
        break;
      }
      case 'sheetClose': ui.sheet = null; break;
      case 'sheetSetView': ui.sheet.view = args[0]; break;
      case 'sheetStartNow': {
        var r = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        var t = pad2(now.getHours())+':'+pad2(now.getMinutes());
        if(r.kind==='session') setEventOccurrenceOverride(r.refId, ui.sheet.dateKey, {time:t});
        else updateAdhocEntry(r.refId, {time:t});
        ui.sheet = null; break;
      }
      case 'sheetApplyAdjustTime': {
        var r2 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        if(r2.kind==='session') setEventOccurrenceOverride(r2.refId, ui.sheet.dateKey, {time:ui.sheet.draftTime});
        else updateAdhocEntry(r2.refId, {time:ui.sheet.draftTime});
        ui.sheet = null; break;
      }
      case 'sheetDurationPreset': ui.sheet.draftDuration = args[0]; break;
      case 'sheetApplyAdjustDuration': {
        var r3 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        var patch = {time: ui.sheet.draftTime, duration: ui.sheet.draftDuration};
        if(r3.kind==='session') setEventOccurrenceOverride(r3.refId, ui.sheet.dateKey, patch);
        else updateAdhocEntry(r3.refId, patch);
        ui.sheet = null; break;
      }
      case 'sheetKeepInProgress': {
        var r4 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        snoozeEntry(r4.label+' 확인', 20);
        ui.sheet = null; break;
      }
      case 'sheetSnooze': {
        var r5 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        snoozeEntry(r5.label, args[0]);
        ui.sheet = null; break;
      }
      case 'sheetRecord': {
        var r6 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        setEntryStatus(r6.kind, r6.refId, ui.sheet.dateKey, args[0]);
        ui.sheet = null; break;
      }
      case 'sheetChooseResult': {
        if(args[0]==='done_partial' || args[0]==='done_none'){
          ui.sheet.pendingStatus = args[0]; ui.sheet.view = 'reason';
        } else {
          var r7 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
          setEntryStatus(r7.kind, r7.refId, ui.sheet.dateKey, args[0]);
          ui.sheet = null;
        }
        break;
      }
      case 'sheetChooseReason': {
        var r8 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        setEntryStatus(r8.kind, r8.refId, ui.sheet.dateKey, ui.sheet.pendingStatus, {reason: args[0]});
        // "조금 함"일 때만 얼마나 했는지 한 번 더 물어봐요(선택 사항).
        ui.sheet.view = ui.sheet.pendingStatus==='done_partial' ? 'partialDegree' : 'replan';
        break;
      }
      case 'sheetChooseDegree': {
        var entry8 = findScheduleEntry(ui.sheet.entryId);
        if(entry8) entry8.partialDegree = args[0];
        ui.sheet.view = 'replan'; break;
      }
      case 'sheetMoveTomorrow': {
        var r9 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        if(r9.kind==='adhoc') updateAdhocEntry(r9.refId, {dateKey: addDaysKey(ui.sheet.dateKey,1)});
        ui.sheet = null; break;
      }
      case 'sheetViewDetail': {
        var r10 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        ui.sheet = null;
        openForm(r10.kind, r10.refId);
        break;
      }

      // v40: 겹침 해결(openOverlapResolver)과 컨디션 조정(openEnergyAdjustment)을 별개 흐름으로 분리했어요.
      case 'openOverlapResolver': ui.overlap = {}; break;
      case 'overlapClose': ui.overlap = null; break;
      case 'dismissOverlapToday': ui.overlapDismissed = true; break;

      case 'openEnergyAdjustment': ui.energy = {view:'summary', doneIds:[], aiText:'', aiLoading:false, aiError:null, aiPlan:null, aiItems:null}; break;
      case 'energyClose': ui.energy = null; break;
      case 'energySetView': ui.energy.view = args[0]; break;
      case 'energyApplyOne': {
        var item = findFatigueItem(args[0]);
        if(item) applyMiniVersion(item);
        ui.energy.doneIds.push(args[0]); break;
      }
      case 'energySkipOne': {
        var item2 = findFatigueItem(args[0]);
        if(item2) setEntryStatus(item2.kind, item2.refId, curDateKey(), 'excused', {reason:'too_tired'});
        ui.energy.doneIds.push(args[0]); break;
      }
      case 'energyApplyAll': {
        var s = computeFatigueSuggestion(curDateKey(), now);
        s.withMinVersion.forEach(applyMiniVersion);
        s.withoutMinVersion.forEach(function(item){ setEntryStatus(item.kind, item.refId, curDateKey(), 'excused', {reason:'too_tired'}); });
        ui.energy = null; break;
      }
      case 'setEnergyAiText': ui.energy.aiText = args[0]; return;
      case 'energyRequestAi': requestEnergyAiAdjustment(); break;
      case 'energyRetryAi': ui.energy.aiPlan = null; ui.energy.aiItems = null; ui.energy.aiError = null; break;
      case 'energyApplyAiPlan': {
        applyAiPlan(ui.energy.aiPlan, ui.energy.aiItems||[]);
        ui.energy = null; break;
      }

      // ── 나의 목표 (인사 카드 자리에서 바로 입력) ──
      case 'openGoalEdit': ui.goalDraft = state.settings.myGoal || ''; ui.goalEditOpen = true; break;
      case 'goalDraftInput': ui.goalDraft = args[0]; return;
      case 'goalSave': {
        state.settings.myGoal = (ui.goalDraft||'').trim() || null;
        ui.goalEditOpen = false; break;
      }

      // 기상·취침 일정 설정 모달의 "지금 컨디션 체크해보기"/"지금 미리보기" — 예전엔 알림
      // 배너(ui.notif)를 띄우려 했는데, 그 배너가 모달 오버레이보다 z-index가 낮아서 모달에
      // 가려 보이지 않았어요(그래서 "눌러도 아무것도 안 됨"으로 보였어요). 기상 쪽은 배너
      // 없이 바로 컨디션 체크로 이어지게(실제 기상 알림을 탭했을 때와 같은 결과) 고쳤고,
      // 취침 쪽은 토스트(모달보다 z-index가 높아서 항상 보여요)로 바꿨어요.
      case 'previewWakeRoutine': {
        ui.routineModalOpen = false;
        var dkPW = todayKey();
        var prevPW = state.checkins[dkPW] || {};
        ui.checkin = { condition: prevPW.condition || null, mustDoIds: (prevPW.mustDoIds||[]).slice() };
        break;
      }
      case 'previewSleepRoutine': {
        var tmrKey = addDaysKey(todayKey(),1);
        var tmrRows = buildTimetableForDate(tmrKey);
        var sleepBody;
        if(tmrRows.length===0) sleepBody = '내일은 등록된 일정이 없어요. 편하게 쉬셔도 좋아요.';
        else { var firstHm = parseHM(tmrRows[0].time); sleepBody = '내일은 '+tmrRows.length+'개의 일정이 있어요. 첫 일정은 "'+tmrRows[0].label+'" · '+meridiemTimeLabel(firstHm.hour,firstHm.minute)+'이에요.'; }
        showInfoToast(sleepBody);
        return;
      }

      // ── 오늘 컨디션 체크인 (기상 알림을 통해서만 들어와요) ──
      case 'openCheckin': {
        var dkO = todayKey();
        var prevC = state.checkins[dkO] || {};
        ui.checkin = { condition: prevC.condition || null, mustDoIds: (prevC.mustDoIds||[]).slice() };
        break;
      }
      case 'checkinClose': ui.checkin = null; break;
      case 'checkinSetCondition': ui.checkin.condition = args[0]; break;
      case 'checkinSetMustDo': {
        var mdIdx = ui.checkin.mustDoIds.indexOf(args[0]);
        if(mdIdx===-1) ui.checkin.mustDoIds.push(args[0]); else ui.checkin.mustDoIds.splice(mdIdx,1);
        break;
      }
      case 'checkinSave': {
        var dkS = todayKey();
        var savedCondition = ui.checkin.condition;
        var mustDoLabels = ui.checkin.mustDoIds.map(function(id){
          var mrow = buildTimetableForDate(dkS).find(function(r){ return r.entryId===id; });
          return mrow ? mrow.label : null;
        }).filter(function(l){ return !!l; });
        state.checkins[dkS] = { condition: savedCondition, mustDoIds: ui.checkin.mustDoIds.slice(),
          mustDoLabels: mustDoLabels, at: new Date().toISOString() };
        ui.checkin = null;
        // 컨디션이 안 좋다고 하면, 오늘 탭으로 돌아가 버튼을 따로 찾을 필요 없이 바로 "체크한
        // 것 외엔 제외할까요?" 화면(에너지 조정 모달의 summary)으로 이어져요 — "일정
        // 조정하기"를 직접 눌렀을 때와 완전히 같은 화면이라 어느 쪽으로 들어와도 일관돼요.
        if(savedCondition==='low') ui.energy = {view:'summary', doneIds:[], aiText:'', aiLoading:false, aiError:null, aiPlan:null, aiItems:null};
        break;
      }

      // ── 실패 패턴 인사이트 ──
      case 'insightDismiss': ui.insightDismissedIds[args[0]] = true; break;
      case 'insightEditTime': {
        ui.tab = 'schedule'; ui.scheduleTab = 'recurring';
        openForm('session', args[0]); break;
      }
      case 'insightApplyMinDefault': {
        var evI = state.events.find(function(e){ return e.id===args[0]; });
        if(evI && evI.minVersion) updateRecurringEvent(evI.id, {label: evI.minVersion, duration: computeMiniDuration(evI.duration), minVersion: null});
        ui.insightDismissedIds[args[0]] = true; break;
      }

      case 'openQuickAdd': ui.quickAdd = {label:'', time:'09:00', duration:30, dateKey:todayKey(), reminderMinutes:10}; break;
      case 'quickAddClose': ui.quickAdd = null; break;
      case 'quickAddLabel': ui.quickAdd.label = args[0]; return;
      case 'quickAddDurationPreset': ui.quickAdd.duration = args[0]; break;
      case 'quickAddSave': {
        if(!ui.quickAdd.label.trim()) return;
        addAdhocEntry({label:ui.quickAdd.label.trim(), dateKey:ui.quickAdd.dateKey, time:ui.quickAdd.time,
          duration:ui.quickAdd.duration, isFixed:false, minVersion:null, memo:null,
          reminderMinutes: ui.quickAdd.reminderMinutes||null});
        ui.quickAdd = null; break;
      }

      case 'openForm': openForm(args[0], args[1]); break;
      case 'formClose': {
        var f = ui.form;
        if(JSON.stringify(f.draft)!==JSON.stringify(f.initial)){
          ui.confirm = {title:'저장하지 않은 변경사항이 있어요', message:'지금 나가면 수정한 내용이 사라져요.',
            noLabel:'계속 수정', yesLabel:'나가기', yesAction:'formCloseConfirmed', danger:true};
          break;
        }
        ui.form = null; break;
      }
      case 'formCloseConfirmed': ui.form = null; ui.confirm = null; break;
      case 'confirmCancel': ui.confirm = null; break;
      case 'formField': ui.form.draft[args[0]] = args[1]; return;
      case 'formToggle': ui.form.draft[args[0]] = !ui.form.draft[args[0]]; break;
      case 'formToggleDay': {
        var days = ui.form.draft.days.slice(); var i = days.indexOf(args[0]);
        if(i===-1) days.push(args[0]); else days.splice(i,1);
        days.sort(function(a,b){return a-b;});
        ui.form.draft.days = days; break;
      }
      case 'formDurationPreset': ui.form.draft.duration = args[0]; break;
      case 'formDateQuick': ui.form.draft.dateKey = addDaysKey(todayKey(), args[0]); ui.form.dateCalOffset = 0; break;
      case 'formDateCalMonth': ui.form.dateCalOffset = (ui.form.dateCalOffset||0) + args[0]; break;
      case 'formDateCalPick': ui.form.draft.dateKey = args[0]; break;

      // ── 시간·소요시간·알림 스테퍼(위/아래 화살표) — 어느 필드든 namespace만 다르게
      // 넘기면 같은 로직으로 처리돼요(new 일정 폼/빠른 추가/일정 상세 시트 셋 다 공용).
      case 'timeStep': {
        var refT = timeRefFor(args[0]); if(!refT) break;
        var hmT = parseHM(refT.get());
        var totalT = ((hmT.hour*60+hmT.minute + args[1]) % 1440 + 1440) % 1440;
        refT.set(formatHM(Math.floor(totalT/60), totalT%60));
        break;
      }
      case 'durationStep': {
        var refD = durationRefFor(args[0]); if(!refD) break;
        refD.set(Math.max(5, Math.min(720, refD.get()+args[1])));
        break;
      }
      case 'reminderStep': {
        var refR = reminderRefFor(args[0]); if(!refR) break;
        refR.set(Math.max(0, Math.min(REMINDER_MAX_HOUR*60, (refR.get()||0)+args[1])));
        break;
      }
      case 'formSave': {
        var fm = ui.form, d = fm.draft;
        if(!d.label.trim()){ alert('이름을 입력해주세요'); return; }
        if(fm.kind==='session' && d.days.length===0){ alert('요일을 하나 이상 선택해주세요'); return; }
        if(fm.kind==='session'){
          var payload = {label:d.label.trim(), time:d.time, days:d.days, duration:d.duration, isFixed:d.isFixed,
            minVersion:d.minVersion.trim()||null, memo:d.memo.trim()||null,
            reminderMinutes:d.reminderMinutes||null};
          if(fm.editingId) updateRecurringEvent(fm.editingId, payload); else addRecurringEvent(payload);
        } else {
          var payload2 = {label:d.label.trim(), dateKey:d.dateKey, time:d.time, duration:d.duration, isFixed:d.isFixed,
            minVersion:d.minVersion.trim()||null, memo:d.memo.trim()||null,
            reminderMinutes:d.reminderMinutes||null};
          if(fm.editingId) updateAdhocEntry(fm.editingId, payload2); else addAdhocEntry(payload2);
        }
        ui.form = null; break;
      }
      case 'formDelete': {
        ui.confirm = {title:'삭제할까요?', message:'이 일정을 삭제하면 예정된 알림과 캘린더 항목도 함께 지워져요.',
          noLabel:'취소', yesLabel:'삭제', yesAction:'formDeleteConfirmed', danger:true};
        break;
      }
      case 'formDeleteConfirmed': {
        var fm2 = ui.form;
        if(fm2.kind==='session') deleteRecurringEvent(fm2.editingId); else deleteAdhocEntry(fm2.editingId);
        ui.form = null; ui.confirm = null; break;
      }

      case 'speakNotif': if(ui.notif && state.settings.voice.ttsEnabled) speakText(ui.notif.body); return;
      case 'openNotif': ui.tab = 'today'; ui.notif = null; break;

      case 'setIntervention': state.settings.interventionLevel = args[0]; break;
      case 'externalCalendarStub': showInfoToast('실제 앱에서 연동할 예정이에요. 지금은 프로토타입이라 미리보기만 가능해요.'); return;
      case 'toggleCalendarSync': {
        state.settings.calendarSync.enabled = !state.settings.calendarSync.enabled;
        if(state.settings.calendarSync.enabled && !state.settings.calendarSync.provider) state.settings.calendarSync.provider = 'google';
        break;
      }
      case 'openSettingsSection': ui.settingsSection = args[0]; break;
      case 'closeSettingsSection': ui.settingsSection = null; break;
      case 'openInterventionExample': ui.interventionExampleOpen = true; break;
      case 'closeInterventionExample': ui.interventionExampleOpen = false; break;
      case 'openRoutineModal': ui.routineModalOpen = true; ui.routineEditDays = [weekdayOfKey(todayKey())]; break;
      case 'closeRoutineModal': ui.routineModalOpen = false; break;
      case 'setAiServerUrl': state.settings.aiServer.url = args[0]; ui.aiServerStatus = null; return;
      case 'setAiServerSecret': state.settings.aiServer.secret = args[0]; ui.aiServerStatus = null; return;
      case 'testAiServer': testAiServerConnection(); return;
      case 'setAlertStyle': state.settings.notify.alertStyle = args[0]; break;
      case 'setNotifyVolume': state.settings.notify.volume = args[0]; break;
      case 'setVibrateIntensity': state.settings.notify.vibrateIntensity = args[0]; break;
      case 'previewAlert': fireAlert(); break;
      case 'routineTimeStep': {
        var rkey = args[0]==='wake' ? 'wakeTimes' : 'sleepTimes';
        var rRepDay = ui.routineEditDays.slice().sort(function(a,b){return a-b;})[0];
        var rhm = parseHM(state.settings.routine[rkey][rRepDay]);
        var rtotal = ((rhm.hour*60+rhm.minute+args[1]) % 1440 + 1440) % 1440;
        var rnewVal = formatHM(Math.floor(rtotal/60), rtotal%60);
        // 선택된(여러 개일 수 있는) 요일 전부를 같은 값으로 맞춰요.
        ui.routineEditDays.forEach(function(rwd){ state.settings.routine[rkey][rwd] = rnewVal; });
        break;
      }
      case 'toggleRoutineEditDay': {
        var dIdx = ui.routineEditDays.indexOf(args[0]);
        if(dIdx!==-1){
          // 최소 하나는 선택된 상태를 유지해요 — 마지막 하나를 또 누르면 무시해요.
          if(ui.routineEditDays.length>1) ui.routineEditDays.splice(dIdx,1);
        } else {
          ui.routineEditDays.push(args[0]);
        }
        break;
      }
      case 'toggleVoice': state.settings.voice[args[0]] = !state.settings.voice[args[0]]; break;

      case 'onboardingNext': ui.onboardingStep = Math.min(2, ui.onboardingStep+1); break;
      case 'onboardingSkipGoal': ui.onboardingStep = Math.min(2, ui.onboardingStep+1); break;
      case 'onboardingSaveGoalNext': {
        state.settings.myGoal = (ui.goalDraft||'').trim() || null;
        ui.onboardingStep = Math.min(2, ui.onboardingStep+1);
        break;
      }
      case 'onboardingFinishWithDemo': {
        seedDemoData();
        ui.onboardingDone = true; ui.onboardingStep = 0;
        // 설정 화면에서 다시 눌렀을 때는(이미 onboardingDone=true) 화면이 그대로라 아무 일도
        // 안 일어난 것처럼 보였어요 — 오늘 탭으로 보내서 초기화된 예시 일정이 바로 보이게 해요.
        ui.tab = 'today'; ui.settingsSection = null;
        ui.briefingDismissed = false; ui.overlapDismissed = false;
        showInfoToast('예시 일정으로 초기화했어요.');
        break;
      }
      case 'onboardingConnectCalendar': {
        // 실제 기기라면 여기서 Google 계정 연동(OAuth) 화면이 열려요. 프로토타입이라 실제
        // 연동은 안 되니, 연동됐다고 가정하고 자동 동기화를 켠 채로 빈 상태에서 시작해요
        // (미리 채워둔 예시 데이터는 비워요 — 진짜 내 캘린더 일정이 그 자리를 채울 거니까요).
        state.events = [];
        state.adhocEntries = [];
        state.scheduleEntries = [];
        state.eventOccurrenceOverrides = {};
        state.changeLog = [];
        state.settings.calendarSync = { enabled:true, provider:'google' };
        ui.onboardingDone = true; ui.onboardingStep = 0;
        showInfoToast('실제 기기에서는 여기서 Google 캘린더 연동 화면이 열려요. 지금은 프로토타입이라 연동된 것으로 가정하고 시작할게요.');
        break;
      }
      case 'overlapDelete': {
        var odKind = args[0], odRefId = args[1];
        // 일회성 일정은 그 날 하루만을 위해 만들어진 거라 실제로 삭제해요(되돌리기 가능).
        // 반복 일정은 오늘만 빼는 것으로 처리해요 — 전체 삭제는 너무 파괴적이에요.
        if(odKind==='adhoc') deleteAdhocEntry(odRefId);
        else setEntryStatus(odKind, odRefId, curDateKey(), 'excused', {reason:'no_time'});
        break;
      }
      case 'overlapMoveToSlot': {
        var omKind = args[0], omRefId = args[1], omTime = args[2];
        if(omKind==='session') setEventOccurrenceOverride(omRefId, curDateKey(), {time:omTime});
        else updateAdhocEntry(omRefId, {time:omTime});
        break;
      }
      case 'overlapEditManually': {
        var oeKind = args[0], oeRefId = args[1];
        ui.overlap = null;
        openForm(oeKind, oeRefId);
        break;
      }
      case 'toggleHistoryChanges': ui.historyChangesOpen = !ui.historyChangesOpen; break;
      // v40: 공유 카드에 오늘 한 일이 항목별로 쭉 나열되면 사생활 노출 우려가 있다는 피드백으로,
      // 기본은 통계만(러닝 앱처럼 %, 며칠째, 총 시간) 보여주고 일정 상세는 직접 켜야만 나오게,
      // 켜더라도 항목별로 숨길 수 있게 했어요.
      case 'openShare': ui.share = {includeDetails:false, hiddenIds:[]}; break;
      case 'shareClose': ui.share = null; break;
      case 'shareToggleDetails': ui.share.includeDetails = !ui.share.includeDetails; break;
      case 'shareToggleItem': {
        var hid = args[0];
        var hIdx = ui.share.hiddenIds.indexOf(hid);
        if(hIdx===-1) ui.share.hiddenIds.push(hid); else ui.share.hiddenIds.splice(hIdx,1);
        break;
      }
      case 'shareSend': shareCardNow(); return;
      case 'shareDownload': downloadShareCard(); return;

      case 'openChat': {
        ui.chatOpen = true;
        if(!ui.chat) ui.chat = { messages:[{id:uid('m'), role:'bot',
          text:'안녕하세요! "내일 오후 3시에 병원 예약 1시간"처럼 편하게 말해보세요.'}], draftText:'' };
        break;
      }
      case 'chatClose': ui.chatOpen = false; break;
      case 'chatInput': ui.chat.draftText = args[0]; return;
      case 'chatQuickPrompt': ui.chat.draftText = args[0]; sendChatText(args[0]); break;
      case 'chatSend': {
        var text = ui.chat.draftText.trim();
        if(!text) return;
        sendChatText(text);
        break;
      }
      case 'chatToggleAmPm': {
        var tmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(tmsg && tmsg.proposal){
          var thm = parseHM(tmsg.proposal.time);
          thm.hour = (thm.hour+12)%24;
          tmsg.proposal.time = formatHM(thm.hour, thm.minute);
        }
        break;
      }
      case 'chatOpenFatigue': {
        // 컨디션 체크의 "제외할까요?" 확인과 완전히 같은 화면(summary)으로 보내요 — 어느
        // 경로로 들어오든 "체크한 항목 외엔 오늘 제외할까요?"부터 먼저 물어봐요.
        ui.chatOpen = false;
        ui.energy = {view:'summary', doneIds:[], aiText:'', aiLoading:false, aiError:null, aiPlan:null, aiItems:null};
        break;
      }
      case 'chatConfirm': {
        var cmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(cmsg && cmsg.proposal){
          var cp = cmsg.proposal;
          if(cp.recurring) addRecurringEvent({label:cp.label, time:cp.time, days:cp.days, duration:cp.duration,
            isFixed:false, minVersion:null, memo:null});
          else addAdhocEntry({label:cp.label, dateKey:cp.dateKey, time:cp.time, duration:cp.duration,
            isFixed:false, minVersion:null, memo:null});
          cmsg.proposal = null;
          ui.chat.messages.push({id:uid('m'), role:'bot', text:'추가했어요! 다른 것도 말해줘요.'});
        }
        break;
      }
      case 'chatDismiss': {
        var dmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(dmsg) dmsg.proposal = null;
        ui.chat.messages.push({id:uid('m'), role:'bot', text:'네, 취소할게요.'});
        break;
      }
      case 'serverActionConfirm': {
        var smsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(smsg && smsg.serverAction){
          if(smsg.serverAction.action==='adjust_burden'){
            // 채팅에서 "적용하기"를 누르면, 여기서 바로 반영하는 대신 "오늘 일정 다시
            // 짜기" 화면으로 넘어가서 AI가 만든 조정안을 먼저 보여주고 확인받아요.
            ui.chatOpen = false;
            ui.energy = {view:'adjust', doneIds:[], aiText: smsg.serverAction.reason || '',
              aiLoading:false, aiError:null, aiPlan:null, aiItems:null};
            smsg.serverAction = null;
            requestEnergyAiAdjustment();
          } else {
            applyServerAction(smsg.serverAction);
            smsg.serverAction = null;
            ui.chat.messages.push({id:uid('m'), role:'bot', text:'반영했어요! 다른 것도 말해줘요.'});
          }
        }
        break;
      }
      case 'serverActionDismiss': {
        var smsg2 = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(smsg2) smsg2.serverAction = null;
        ui.chat.messages.push({id:uid('m'), role:'bot', text:'네, 반영하지 않을게요.'});
        break;
      }

      case 'setHistoryMonth': ui.historyMonthOffset += args[0]; ui.historySelectedDate = null; break;
      case 'selectHistoryDate': ui.historySelectedDate = (ui.historySelectedDate===args[0] ? null : args[0]); break;
    }
    render();
  };

  function openForm(kind, id){
    var draft;
    if(kind==='session'){
      var ev = id ? state.events.find(function(e){return e.id===id;}) : null;
      draft = ev ? {label:ev.label, time:ev.time, days:ev.days.slice(), dateKey:todayKey(), duration:ev.duration,
        isFixed:ev.isFixed, minVersion:ev.minVersion||'', memo:ev.memo||'',
        reminderMinutes:ev.reminderMinutes||0} :
        {label:'', time:'09:00', days:[], dateKey:todayKey(), duration:30, isFixed:false, minVersion:'', memo:'', reminderMinutes:10};
    } else {
      var en = id ? state.adhocEntries.find(function(e){return e.id===id;}) : null;
      draft = en ? {label:en.label, time:en.time, days:[], dateKey:en.dateKey, duration:en.duration,
        isFixed:en.isFixed, minVersion:en.minVersion||'', memo:en.memo||'',
        reminderMinutes:en.reminderMinutes||0} :
        {label:'', time:'09:00', days:[], dateKey:curDateKey(), duration:30, isFixed:false, minVersion:'', memo:'', reminderMinutes:10};
    }
    ui.form = { kind:kind, editingId:id||null, draft: draft, initial: Object.assign({}, draft), dateCalOffset:0 };
  }

  function findFatigueItem(refId){
    var s = computeManualAdjustOptions(curDateKey(), new Date());
    return s.withMinVersion.concat(s.withoutMinVersion).find(function(i){ return i.refId===refId; });
  }
  function applyMiniVersion(item){
    var miniLabel = item.minVersion || item.label;
    var miniDuration = item.miniDuration || computeMiniDuration(item.duration);
    if(item.kind==='session') setEventOccurrenceOverride(item.refId, curDateKey(), {label:miniLabel, duration:miniDuration, isMiniVersion:true});
    else {
      // 버그 수정: adhoc(하루짜리) 일정은 minVersion을 그대로 남겨두면, 이미 가볍게 바꾼 뒤에도
      // "가볍게 바꿀 수 있어요"라고 계속 재제안했어요(그래서 문구가 안 바뀌는 것처럼 보였어요).
      // 적용한 뒤에는 minVersion을 비우고 isMiniVersion을 표시해서 다시 제안되지 않게 해요.
      updateAdhocEntry(item.refId, {label:miniLabel, duration:miniDuration, isMiniVersion:true, minVersion:null});
    }
  }

  // "다르게 조정하기"에서 자유 문장을 AI 서버(server/index.js의 /api/adjust-burden)로
  // 보내요. 미리 정해둔 minVersion이 있는 일정뿐 아니라, 오늘 남은 일정 전부(고정 제외)를
  // 후보로 보내서 서버(Claude)가 사용자의 이유에 맞게 뭘 줄이고 뺄지 직접 판단하게 해요.
  function buildEnergyAiItems(dateKey){
    var nowMinutes = new Date().getHours()*60+new Date().getMinutes();
    return buildTimetableForDate(dateKey).filter(function(r){
      if(r.isFixed) return false;
      var live = deriveLiveStatus(r, nowMinutes);
      if(FINISHED.indexOf(live)!==-1 || live==='in_progress' || live==='awaiting_result') return false;
      if(r.isMiniVersion) return false;
      return true;
    }).map(function(r){
      return { refId:r.refId, kind:r.kind, label:r.label, time:r.time, durationMinutes:r.duration, existingMinVersion:r.minVersion||null };
    });
  }
  function requestEnergyAiAdjustment(){
    var text = (ui.energy.aiText||'').trim();
    if(!text){ ui.energy.aiError = '어떤 상황인지 먼저 적어주세요.'; return; }
    var serverUrl = (state.settings.aiServer.url||'').trim();
    if(!serverUrl){ ui.energy.aiError = 'AI 서버가 설정되지 않았어요.'; return; }
    var dateKey = curDateKey();
    var items = buildEnergyAiItems(dateKey);
    ui.energy.aiLoading = true; ui.energy.aiError = null;
    var base = serverUrl.replace(/\/+$/,'');
    var headers = {'Content-Type':'application/json'};
    if(state.settings.aiServer.secret) headers['x-app-secret'] = state.settings.aiServer.secret;
    fetch(base+'/api/adjust-burden', {
      method:'POST', headers:headers,
      body: JSON.stringify({ message:text, context:{ items:items } })
    }).then(function(res){ return res.json(); }).then(function(data){
      if(!ui.energy) return; // 응답 오는 사이 모달이 닫혔으면 조용히 무시해요
      ui.energy.aiLoading = false;
      if(data && data.adjustments){ ui.energy.aiPlan = data; ui.energy.aiItems = items; }
      else ui.energy.aiError = (data && data.error) ? String(data.error) : '요청을 이해하지 못했어요. 다시 시도해주세요.';
      render();
    }).catch(function(){
      if(!ui.energy) return;
      ui.energy.aiLoading = false;
      ui.energy.aiError = '서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.';
      render();
    });
  }
  function applyAiPlan(plan, items){
    if(!plan) return;
    var byId = {};
    items.forEach(function(it){ byId[it.kind+':'+it.refId] = it; });
    (plan.adjustments||[]).forEach(function(adj){
      var it = byId[adj.kind+':'+adj.refId];
      if(!it) return;
      if(adj.decision==='shrink'){
        applyMiniVersion({ kind:adj.kind, refId:adj.refId,
          minVersion: adj.newLabel || it.label,
          miniDuration: adj.newDurationMinutes || computeMiniDuration(it.durationMinutes) });
      } else if(adj.decision==='skip'){
        setEntryStatus(adj.kind, adj.refId, curDateKey(), 'excused', {reason:'too_tired'});
      }
    });
  }

  function speakText(text){
    try{
      if(!('speechSynthesis' in window)) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakBriefingDemo(){
    speakText(computeBriefing(curDateKey(), new Date()).headline);
  }

  // 짧은 "띠링" 알림음 — 외부 오디오 파일 없이 Web Audio API로 두 음을 순서대로 울려요.
  // volume(0~1)은 설정의 "소리 크기"를 그대로 반영해요(피크 게인에 곱함).
  function playChime(volume){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var peak = 0.22 * (typeof volume==='number' ? volume : 0.6);
      [880, 1320].forEach(function(freq, i){
        var t0 = ctx.currentTime + i*0.14;
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t0+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0+0.32);
      });
    }catch(e){}
  }
  // 진동 세기별 패턴(밀리초, [진동,멈춤,진동,...]) — 진동 모터의 진폭 자체는 Vibration API로
  // 조절할 수 없어서, 길이·반복 횟수로 "약하다/강하다"를 표현해요.
  var VIBRATE_PATTERNS = { weak:[60], medium:[120,80,120], strong:[200,90,200,90,200] };
  // 기상·취침·일정 알림이 뜰 때마다 이걸 같이 불러요 — 설정의 "알림 스타일"에 따라
  // 소리(띠링)를 낼지, 진동만 줄지, 아무 것도 안 낼지(무음, 배너만) 정해요. 이어폰 연결
  // 시 음성으로 자동으로 읽어주는 것과는 별개예요(그건 fireReminder에서 따로 처리해요).
  function fireAlert(){
    var style = state.settings.notify.alertStyle;
    if(style==='sound') playChime(state.settings.notify.volume);
    else if(style==='vibrate'){
      try{
        if(navigator.vibrate) navigator.vibrate(VIBRATE_PATTERNS[state.settings.notify.vibrateIntensity] || VIBRATE_PATTERNS.medium);
      }catch(e){}
    }
  }

  // ── 일정 시작 전 알림 ──
  // entryId별로 이번 세션에서 이미 울렸는지 기억해요(같은 일정이 매 60초 체크마다
  // 다시 울리지 않도록). 새로고침하면 초기화되는데, 데모 프로토타입이라 괜찮아요 —
  // 실제 앱이라면 이 부분이 기기의 로컬/푸시 알림 스케줄러가 될 자리예요.
  var firedReminderIds = {};
  function checkReminders(){
    // 네이티브 앱(Capacitor)에서는 OS가 예약된 알림을 직접 울려주니까, 여기서 화면 안
    // 타이머로 또 울리면 앱이 켜져 있는 동안 두 번 알림이 뜨는 꼴이라 건너뛰어요.
    if(isNativeApp()) return;
    var dateKey = todayKey(), now = new Date();
    var nowMinutes = now.getHours()*60+now.getMinutes();
    buildTimetableForDate(dateKey).forEach(function(row){
      if(!row.reminderMinutes || FINISHED.indexOf(row.status)!==-1) return;
      var hm = parseHM(row.time), start = hm.hour*60+hm.minute;
      var fireAt = start - row.reminderMinutes;
      // 정확히 그 분에 타이머가 맞지 않을 수 있어서(60초 간격 드리프트), fireAt과 시작 시간
      // 사이 구간이면 아직 안 울린 것만 골라 한 번 울려요.
      if(nowMinutes >= fireAt && nowMinutes < start && !firedReminderIds[row.entryId]){
        firedReminderIds[row.entryId] = true;
        fireReminder(row);
      }
    });
  }
  function fireReminder(row){
    var body = row.reminderMinutes+'분 후 "'+row.label+'"이(가) 시작해요.';
    ui.notif = { title:'⏰ 일정 알림', body: body, kind:'reminder', entryId: row.entryId, dateKey: todayKey() };
    fireAlert();
    // 갑자기 밖에서 일정 내용이 소리로 흘러나오는 걸 막기 위해, 이어폰이 연결돼 있을 때만
    // 내용을 음성으로 읽어줘요. 아니면 방금 울린 띠링 소리뿐이고, 내용은 알림 배너를 보거나
    // "듣기" 버튼을 직접 눌러야 들을 수 있어요.
    if(state.settings.voice.ttsEnabled && state.settings.voice.headphonesConnected) speakText(body);
    render();
  }

  // 네이티브 앱에서 처음 켜질 때 한 번: 알림 권한을 요청하고(iOS/Android 13+ 둘 다 이
  // 호출 하나로 처리돼요), 안드로이드 알림 채널을 만들고, 오늘 알림을 전부 예약해요.
  // 브라우저 프로토타입에서는 nativeNotifPlugin()이 null이라 그냥 아무 일도 안 해요.
  function setupNativeNotifications(){
    var plugin = nativeNotifPlugin();
    if(!plugin) return;
    plugin.requestPermissions().catch(function(){});
    if(plugin.createChannel){
      plugin.createChannel({ id:'godsaeng-reminders', name:'일정 알림', importance:4 }).catch(function(){});
    }
    syncAllNativeRemindersForToday();
  }

  // ── "다음 일정까지 N분" 상태창 고정 알림 (음악 앱처럼 계속 떠 있는 알림) ──
  // @capacitor/local-notifications는 정해진 시각에 한 번 울리는 알람이라 이런 용도엔 안 맞아요
  // (내용을 몇 분마다 계속 갱신하면서 앱을 꺼도 안 사라지는 "진행 중" 알림은 안드로이드에서
  // Foreground Service로, iOS에서는 Live Activity(ActivityKit)로 직접 만들어야 해요 — 둘 다
  // 기성 플러그인이 없어서 작은 커스텀 네이티브 플러그인이 필요해요). 그 플러그인이
  // window.Capacitor.Plugins.OngoingScheduleNotification로 start/update/stop을 제공한다고
  // 가정하고 미리 연결해뒀어요 — 자세한 구현 가이드는 NOTIFICATIONS.md 참고.
  function ongoingNotifPlugin(){
    try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.OngoingScheduleNotification) || null; }
    catch(e){ return null; }
  }
  function syncOngoingNextUpNotification(){
    var plugin = ongoingNotifPlugin();
    if(!plugin) return;
    var nextUp = computeNextUp(todayKey(), new Date());
    if(!nextUp){ plugin.stop().catch(function(){}); return; }
    var text = nextUp.mode==='in_progress'
      ? ('지금 "'+nextUp.label+'" 진행 중 · '+nextUp.minutesLeft+'분 후 종료')
      : ('다음 일정까지 '+nextUp.minutesLeft+'분 · '+nextUp.time+' '+nextUp.label);
    plugin.update({ title:'갓생살자', body:text }).catch(function(){});
  }

  // 1분마다 시계 갱신 + 알림 체크 — 열려있는 시트가 없을 때만 화면을 다시 그려서, 조작 중인
  // 모달이 리셋되지 않게 해요. 알림 체크와 상태창 알림 갱신은 모달이 열려 있어도 계속 돌아가요.
  setInterval(function(){
    checkReminders();
    syncOngoingNextUpNotification();
    if(!ui.sheet && !ui.overlap && !ui.energy && !ui.checkin && !ui.quickAdd && !ui.form && !ui.interventionExampleOpen && !ui.routineModalOpen) render();
  }, 60000);
  checkReminders();
  setupNativeNotifications();
  var ongoingPluginAtBoot = ongoingNotifPlugin();
  if(ongoingPluginAtBoot){ ongoingPluginAtBoot.start().catch(function(){}); syncOngoingNextUpNotification(); }

  render();
})();
</script>

</body></html>
