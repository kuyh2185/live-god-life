  function labelForEntry(refId, kind){
    if(kind==='session'){ var e = state.events.find(function(x){return x.id===refId;}); return e ? e.label : '(삭제된 일정)'; }
    var a = state.adhocEntries.find(function(x){return x.id===refId;}); return a ? a.label : '(삭제된 일정)';
  }
  // 완료율 계산 기준: 완료=100%, 조금 함=50%, 못함=0%, 시간이 지난 뒤 건너뜀=0%.
  // "미리 건너뜀"(비서 제안으로 시작 전에 뺀 것)은 사용자가 다시 합의한 계획이 아예 없던
  // 일이 되는 것과 같아서 비율 계산 자체에서 빼요(분모에서 제외) — 가볍게 버전을 완료했다면
  // 그 자체로 100%예요(따로 감점하지 않아요).
  function computeDayStats(dateKey){
    var all = state.scheduleEntries.filter(function(e){ return e.dateKey===dateKey; });
    if(!all.length) return null;
    var counted = all.filter(function(e){ return e.status!=='excused'; });
    var score = 0;
    counted.forEach(function(e){
      if(e.status==='done_full') score += 1; else if(e.status==='done_partial') score += 0.5;
    });
    var ratio = counted.length ? score/counted.length : null;
    return { count: all.length, ratio: ratio, entries: all, counted: counted };
  }
  // 최근 7일치 이행률(제외 대상은 계산에서 빼고) — 주간 요약 카드에서 써요.
  // 공유 카드에 넣을 "며칠째 갓생 중"인지 계산 — 오늘부터 거슬러 올라가며, 그날 일정이 있었는데
  // 완료 기록(완료/조금 함)이 하나도 없으면 스트릭이 끊긴 걸로 봐요. 일정이 아예 없던 날은
  // 스트릭에 영향을 주지 않고 건너뛰어요. 오늘은 아직 하루가 끝나지 않았을 수 있으니, 기록이
  // 없다고 바로 스트릭을 끊지는 않아요.
  function computeStreakDays(){
    var streak = 0, day = todayKey();
    for(var i=0;i<365;i++){
      var wd = weekdayOfKey(day);
      var scheduled = state.events.some(function(ev){ return !ev.paused && ev.days.indexOf(wd)!==-1; }) ||
        state.adhocEntries.some(function(en){ return en.dateKey===day; });
      if(scheduled){
        var hasAnyDone = state.scheduleEntries.some(function(e){
          return e.dateKey===day && (e.status==='done_full' || e.status==='done_partial');
        });
        if(hasAnyDone) streak++;
        else if(day !== todayKey()) break;
      }
      day = addDaysKey(day,-1);
    }
    return Math.max(streak,1);
  }
  function computeWeekRatio(endDateKey){
    var days = []; var cursor = endDateKey;
    for(var i=0;i<7;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var score = 0, counted = 0;
    state.scheduleEntries.forEach(function(e){
      if(days.indexOf(e.dateKey)===-1 || e.status==='excused') return;
      counted++;
      if(e.status==='done_full') score += 1; else if(e.status==='done_partial') score += 0.5;
    });
    return counted ? score/counted : null;
  }
  // 최근 7일 동안 "못함/건너뜀"으로 2번 이상 기록된 일정 중 가장 잦은 것 — 없으면 안 보여줘요.
  function mostPostponedLabel(){
    var days = []; var cursor = todayKey();
    for(var i=0;i<7;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var counts = {};
    state.scheduleEntries.forEach(function(e){
      if(days.indexOf(e.dateKey)===-1) return;
      if(e.status!=='skipped' && e.status!=='done_none') return;
      var label = labelForEntry(e.refId, e.kind);
      counts[label] = (counts[label]||0)+1;
    });
    var best = null, bestCount = 0;
    Object.keys(counts).forEach(function(k){ if(counts[k]>bestCount){ best = k; bestCount = counts[k]; } });
    return bestCount>=2 ? best : null;
  }
  // 최근 14일 동안 특정 반복 일정을 절반 이상 "못함/건너뜀"으로 기록했으면, 그 패턴을
  // 다음 계획에 반영할 수 있게 알려줘요(시간대를 옮기거나, 가볍게 버전을 아예 기본으로).
  // "미리 건너뜀"(비서가 먼저 뺀 것)은 사용자 실패가 아니라 분모에서도 빼요.
  function computeRecurringInsight(){
    var days = []; var cursor = todayKey();
    for(var i=0;i<14;i++){ days.push(cursor); cursor = addDaysKey(cursor,-1); }
    var best = null;
    state.events.forEach(function(ev){
      if(ev.paused) return;
      var total = 0, fail = 0;
      days.forEach(function(dk){
        if(ev.days.indexOf(weekdayOfKey(dk))===-1) return;
        var entry = findScheduleEntry(ev.id+'-'+dk);
        if(!entry || entry.status==='excused') return;
        total++;
        if(entry.status==='skipped' || entry.status==='done_none') fail++;
      });
      if(total>=3 && fail/total>=0.5 && (!best || fail>best.fail)) best = {event:ev, fail:fail, total:total};
    });
    return best;
  }
  function formatKoreanDate(dk){
    var p = dk.split('-').map(Number);
    var wd = WEEKDAY_LABELS[new Date(p[0],p[1]-1,p[2]).getDay()];
    return p[1]+'월 '+p[2]+'일 ('+wd+')';
  }
  // 매일매일의 성취를 한눈에 볼 수 있도록, 하루 단위 리스트 대신 월간 그리드로 보여주고
  // 이행률에 따라 한 색(보라)의 농도만 달라지게 해요 — 이 앱은 사용자를 다그치지 않는 게
  // 정체성이라, 성공/실패 느낌의 초록·빨강 대신 중립적인 단계로 표현해요.
  function renderHistoryCalendar(){
    var p = TK.split('-').map(Number);
    var base = new Date(p[0], p[1]-1 + ui.historyMonthOffset, 1);
    var year = base.getFullYear(), month = base.getMonth();
    var firstWd = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();

    var html = '<div class="cal-head"><button class="cal-nav-btn" onclick="appAction(\'setHistoryMonth\',-1)">‹</button>' +
      '<div class="t">'+year+'년 '+(month+1)+'월</div>' +
      '<button class="cal-nav-btn" onclick="appAction(\'setHistoryMonth\',1)"'+(ui.historyMonthOffset>=0?' disabled style="opacity:.3;"':'')+'>›</button></div>';
    html += '<div class="cal-grid">';
    WEEKDAY_LABELS.forEach(function(w){ html += '<div class="cal-wd">'+w+'</div>'; });
    for(var i=0;i<firstWd;i++) html += '<div class="cal-cell empty"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var dk = year+'-'+pad2(month+1)+'-'+pad2(d);
      var isFuture = dk > TK, isToday = dk === TK;
      var stats = isFuture ? null : computeDayStats(dk);
      var cls = 'cal-cell', styleAttr = '', pctLabel = '';
      if(isFuture) cls += ' future';
      else if(stats && stats.ratio!==null){
        var pct = Math.round(stats.ratio*100);
        pctLabel = pct+'%';
        if(pct>=100){ styleAttr = 'background:var(--cal-5-bg);color:var(--cal-5-text);'; cls += ' full'; }
        else if(pct>=75) styleAttr = 'background:var(--cal-4-bg);color:var(--cal-4-text);';
        else if(pct>=50) styleAttr = 'background:var(--cal-3-bg);color:var(--cal-3-text);';
        else if(pct>=25) styleAttr = 'background:var(--cal-2-bg);color:var(--cal-2-text);';
        else styleAttr = 'background:var(--cal-1-bg);color:var(--cal-1-text);';
      }
      if(isToday) cls += ' today';
      if(ui.historySelectedDate===dk) cls += ' selected';
      var clickAttr = isFuture ? '' : ' onclick="appAction(\'selectHistoryDate\',\''+dk+'\')"';
      html += '<div class="'+cls+'"'+clickAttr+(styleAttr?' style="'+styleAttr+'"':'')+'>'+d+
        (pctLabel?'<span class="pct">'+pctLabel+'</span>':'')+'</div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span class="sw" style="background:var(--chip-bg);"></span>기록 없음&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-1-bg);"></span>0~24%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-2-bg);"></span>25~49%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-3-bg);"></span>50~74%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-4-bg);"></span>75~99%&nbsp;&nbsp;' +
      '<span class="sw" style="background:var(--cal-5-bg);"></span>100%</div>';
    return html;
  }
  function renderDayDetail(dateKey){
    var stats = computeDayStats(dateKey);
    var html = '<div class="day-detail"><div class="section-title" style="margin-top:0;">'+esc(formatKoreanDate(dateKey))+'</div>';
    if(!stats){ html += '<div class="empty" style="padding:16px 4px;">이 날은 기록이 없어요.</div></div>'; return html; }
    if(stats.ratio!==null) html += '<div class="section-sub" style="margin-top:-6px;">그날 계획 이행률 '+Math.round(stats.ratio*100)+'%</div>';
    var groups = [['done_full','완료한 일정'],['done_partial','조금 한 일정'],['done_none','못한 일정'],['excused','비서가 조정한 일정']];
    groups.forEach(function(g){
      var items = stats.entries.filter(function(e){ return e.status===g[0]; });
      if(!items.length) return;
      html += '<div class="field-label" style="margin:10px 0 4px;">'+g[1]+'</div>';
      items.forEach(function(e){
        html += '<div class="change-row"><div style="flex:1;"><div class="lbl" style="font-size:14px; font-weight:700;">'+esc(labelForEntry(e.refId,e.kind))+'</div>';
        var sub = [];
        if(e.reason) sub.push(REASON_LABEL[e.reason]||e.reason);
        if(e.partialDegree) sub.push(PARTIAL_DEGREE_LABEL[e.partialDegree]||e.partialDegree);
        if(sub.length) html += '<div style="font-size:11px; color:var(--text-faint); margin-top:2px;">'+esc(sub.join(' · '))+'</div>';
        html += '</div>'+badge(statusLabel(e.status), statusTone(e.status))+'</div>';
      });
    });
    html += '</div>';
    return html;
  }
  function renderHistory(){
    // 공유하기 버튼을 오늘 탭에서 못 찾겠다는 피드백이 있어서, 히스토리 탭에도 같은 기능의
    // 진입점을 하나 더 뒀어요.
    var html = '<button class="btn btn-secondary" style="margin-top:14px;" onclick="appAction(\'openShare\')">🔗 오늘 기록 공유하기</button>';
    html += '<div class="section-title">달력으로 보기</div>';
    html += '<div class="section-sub">날짜를 누르면 그날 기록을 볼 수 있어요.</div>';
    html += renderHistoryCalendar();
    if(ui.historySelectedDate) html += renderDayDetail(ui.historySelectedDate);

    // 월간 달력이 들어간 뒤로는 상단의 긴 숫자 요약보다, 이행률과 변화만 짧게 보여주는 편이
    // 부담이 적어요 — 점수로 압박하는 느낌의 문구는 넣지 않아요.
    var thisWeekRatio = computeWeekRatio(todayKey());
    var lastWeekRatio = computeWeekRatio(addDaysKey(todayKey(),-7));
    var postponedLabel = mostPostponedLabel();
    html += '<div class="section-title">이번 주 요약</div><div class="card">';
    if(thisWeekRatio===null){
      html += '<div class="briefing-text">아직 기록된 결과가 없어요.</div>';
    } else {
      var weekPct = Math.round(thisWeekRatio*100);
      html += '<div class="briefing-text">이번 주 이행률 '+weekPct+'%</div>';
      if(lastWeekRatio!==null){
        var diffPct = Math.round((thisWeekRatio-lastWeekRatio)*100);
        var diffText = diffPct>0 ? ('지난주보다 '+diffPct+'% 높아요') : diffPct<0 ? ('지난주보다 '+Math.abs(diffPct)+'% 낮아요') : '지난주와 비슷해요';
        html += '<div class="briefing-text" style="margin-top:4px;">'+diffText+'</div>';
      }
      if(postponedLabel) html += '<div class="briefing-text" style="margin-top:4px;">가장 자주 미룬 일정: '+esc(postponedLabel)+'</div>';
    }
    html += '</div>';

    // 실패 기록을 다음 계획에 반영 — 최근 절반 이상 못 지킨 반복 일정이 있으면, 그냥 보여주기만
    // 하지 않고 "시간 옮기기" · "가볍게를 기본으로" 두 가지 실제 행동으로 바로 연결해요.
    var insight = computeRecurringInsight();
    if(insight && !ui.insightDismissedIds[insight.event.id]){
      html += '<div class="section-title">비서가 발견한 패턴</div>';
      html += '<div class="overlap-card" style="background:var(--warn-bg);">' +
        '<div class="oc-title" style="color:var(--warn);">"'+esc(insight.event.label)+'"을 최근 '+insight.total+'번 중 '+insight.fail+'번 못 지켰어요</div>' +
        '<div class="oc-detail" style="color:var(--warn);">시간을 옮기거나, 가볍게 버전을 기본으로 바꿔볼까요?</div>' +
        '<div class="oc-actions">' +
        '<button class="btn-oc-primary" style="background:var(--warn);" onclick="appAction(\'insightEditTime\',\''+insight.event.id+'\')">시간 옮기기</button>' +
        (insight.event.minVersion ? '<button class="btn-oc-primary" style="background:var(--warn);" onclick="appAction(\'insightApplyMinDefault\',\''+insight.event.id+'\')">가볍게를 기본으로</button>' : '') +
        '<button class="btn-oc-ghost" style="color:var(--warn);" onclick="appAction(\'insightDismiss\',\''+insight.event.id+'\')">넘어갈게요</button>' +
        '</div></div>';
    }

    // 기본은 접어둬요 — 눌러야 열리는 아코디언. 평소엔 눈에 안 띄다가, 궁금할 때만 펼쳐볼 수 있게.
    html += '<button class="section-title" style="display:flex; align-items:center; justify-content:space-between; width:100%; ' +
      'background:none; border:none; padding:0; cursor:pointer; color:var(--text); font-family:inherit;" ' +
      'onclick="appAction(\'toggleHistoryChanges\')"><span>비서가 바꾼 것'+(state.changeLog.length?' ('+state.changeLog.length+')':'')+'</span>' +
      '<span style="font-size:12px; color:var(--text-faint); font-weight:700;">'+(ui.historyChangesOpen?'접기 ▲':'펼치기 ▼')+'</span></button>';
    if(ui.historyChangesOpen){
      html += '<div class="section-sub">비서가 대신 바꾼 것들이에요. 마음에 안 들면 되돌릴 수 있어요.</div>';
      if(state.changeLog.length===0) html += '<div class="briefing-text" style="color:var(--text-muted); font-size:13px;">아직 비서가 바꾼 게 없어요.</div>';
      else state.changeLog.slice(0,30).forEach(function(log){
        html += '<div class="change-row"><div style="flex:1;"><div class="lbl" style="font-size:14px; font-weight:700;">'+esc(log.label)+'</div>' +
          '<div style="font-size:11px; color:var(--text-faint); margin-top:2px;">'+formatChangeAt(log.at)+(log.undone?' · 되돌림':'')+'</div></div>';
        if(!log.undone) html += '<button class="undo-btn" onclick="appRunUndo(\''+log.id+'\')">되돌리기</button>';
        html += '</div>';
      });
    }
    return html;
  }

      html += '<div class="routine-expand"><div class="stepper-row">'+stepperHtml('기상 시간', meridiemTimeLabel(wt.hour,wt.minute), "appAction('routineTimeStep','wake',-30)", "appAction('routineTimeStep','wake',30)")+'</div>';
      html += '<button class="btn btn-secondary" onclick="appAction(\'previewWakeRoutine\')">지금 미리보기</button></div>';
    }
    var st = parseHM(state.settings.routine.sleepTime);
    html += '<div class="settings-row"><div><div class="t">취침 알림 + 내일 일정 미리보기</div>' +
      '<div class="d">취침 시간에 알림으로 내일 일정을 미리 알려줘요.</div></div>' +
      toggleTrack(state.settings.routine.sleepEnabled, "appAction('toggleRoutine','sleepEnabled')")+'</div>';
    if(state.settings.routine.sleepEnabled){
      html += '<div class="routine-expand"><div class="stepper-row">'+stepperHtml('취침 시간', meridiemTimeLabel(st.hour,st.minute), "appAction('routineTimeStep','sleep',-30)", "appAction('routineTimeStep','sleep',30)")+'</div>';
      html += '<button class="btn btn-secondary" onclick="appAction(\'previewSleepRoutine\')">지금 미리보기</button></div>';
    }
    html += '<div class="section-sub" style="margin-top:8px;">이 화면은 프로토타입이라 실제 알림 대신, 화면 위 알림 배너로 미리보기만 보여드려요.</div>';

    html += '<div class="section-title">기타</div>';
    html += '<button class="btn btn-secondary" onclick="appAction(\'onboardingRestart\')">온보딩 다시 보기</button>';

    return html;
  }
  function toggleTrack(on, onclick){
    return '<button class="toggle-track'+(on?' on':'')+'" onclick="'+onclick+'"><div class="toggle-thumb"></div></button>';
  }

  // ───────────────────────── 액션 디스패치 ─────────────────────────
  window.appAction = function(name){
    var args = Array.prototype.slice.call(arguments, 1);
    var now = new Date();
    switch(name){
      case 'closeBanner': ui.bannerOpen = false; break;
      case 'setTab': ui.tab = args[0]; break;
      case 'setDay': ui.dayOffset = args[0]; ui.briefingDismissed = false; ui.overlapDismissed = false; break;
      case 'dismissBriefingAction': ui.briefingDismissed = true; break;
      case 'setScheduleTab': ui.scheduleTab = args[0]; break;
      case 'toggleEventPaused': toggleEventPaused(args[0]); return;

      case 'openSheet': {
        var dateKey = curDateKey();
        ui.sheet = { entryId: args[0], dateKey: dateKey, view:'main', draftTime:'09:00', draftDuration:30, pendingStatus:null };
        var row = findRow(args[0], dateKey);
        if(row){ ui.sheet.draftTime = row.time; ui.sheet.draftDuration = row.duration; }
        break;
      }
      case 'sheetClose': ui.sheet = null; break;
      case 'sheetSetView': ui.sheet.view = args[0]; break;
      case 'sheetStartNow': {
        var r = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        var t = pad2(now.getHours())+':'+pad2(now.getMinutes());
        if(r.kind==='session') setEventOccurrenceOverride(r.refId, ui.sheet.dateKey, {time:t});
        else updateAdhocEntry(r.refId, {time:t});
        ui.sheet = null; break;
      }
      case 'sheetApplyAdjustTime': {
        var r2 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        if(r2.kind==='session') setEventOccurrenceOverride(r2.refId, ui.sheet.dateKey, {time:ui.sheet.draftTime});
        else updateAdhocEntry(r2.refId, {time:ui.sheet.draftTime});
        ui.sheet = null; break;
      }
      case 'sheetDurationPreset': ui.sheet.draftDuration = args[0]; break;
      case 'sheetDurationCustom': break;
      case 'sheetDurationStep': ui.sheet.draftDuration = Math.max(5, ui.sheet.draftDuration + args[0]); break;
      case 'sheetApplyAdjustDuration': {
        var r3 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        var patch = {time: ui.sheet.draftTime, duration: ui.sheet.draftDuration};
        if(r3.kind==='session') setEventOccurrenceOverride(r3.refId, ui.sheet.dateKey, patch);
        else updateAdhocEntry(r3.refId, patch);
        ui.sheet = null; break;
      }
      case 'sheetKeepInProgress': {
        var r4 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        snoozeEntry(r4.label+' 확인', 20);
        ui.sheet = null; break;
      }
      case 'sheetSnooze': {
        var r5 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        snoozeEntry(r5.label, args[0]);
        ui.sheet = null; break;
      }
      case 'sheetRecord': {
        var r6 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        setEntryStatus(r6.kind, r6.refId, ui.sheet.dateKey, args[0]);
        ui.sheet = null; break;
      }
      case 'sheetChooseResult': {
        if(args[0]==='done_partial' || args[0]==='done_none'){
          ui.sheet.pendingStatus = args[0]; ui.sheet.view = 'reason';
        } else {
          var r7 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
          setEntryStatus(r7.kind, r7.refId, ui.sheet.dateKey, args[0]);
          ui.sheet = null;
        }
        break;
      }
      case 'sheetChooseReason': {
        var r8 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        setEntryStatus(r8.kind, r8.refId, ui.sheet.dateKey, ui.sheet.pendingStatus, {reason: args[0]});
        // "조금 함"일 때만 얼마나 했는지 한 번 더 물어봐요(선택 사항).
        ui.sheet.view = ui.sheet.pendingStatus==='done_partial' ? 'partialDegree' : 'replan';
        break;
      }
      case 'sheetChooseDegree': {
        var entry8 = findScheduleEntry(ui.sheet.entryId);
        if(entry8) entry8.partialDegree = args[0];
        ui.sheet.view = 'replan'; break;
      }
      case 'sheetMoveTomorrow': {
        var r9 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        if(r9.kind==='adhoc') updateAdhocEntry(r9.refId, {dateKey: addDaysKey(ui.sheet.dateKey,1)});
        ui.sheet = null; break;
      }
      case 'sheetViewDetail': {
        var r10 = findRow(ui.sheet.entryId, ui.sheet.dateKey);
        ui.sheet = null;
        openForm(r10.kind, r10.refId);
        break;
      }

      // v40: 겹침 해결(openOverlapResolver)과 컨디션 조정(openEnergyAdjustment)을 별개 흐름으로 분리했어요.
      case 'openOverlapResolver': ui.overlap = {}; break;
      case 'overlapClose': ui.overlap = null; break;
      case 'dismissOverlapToday': ui.overlapDismissed = true; break;

      case 'openEnergyAdjustment': ui.energy = {view:'summary', doneIds:[]}; break;
      case 'energyClose': ui.energy = null; break;
      case 'energySetView': ui.energy.view = args[0]; break;
      case 'energyApplyOne': {
        var item = findFatigueItem(args[0]);
        if(item) applyMiniVersion(item);
        ui.energy.doneIds.push(args[0]); break;
      }
      case 'energySkipOne': {
        var item2 = findFatigueItem(args[0]);
        if(item2) setEntryStatus(item2.kind, item2.refId, curDateKey(), 'excused', {reason:'too_tired'});
        ui.energy.doneIds.push(args[0]); break;
      }
      case 'energyApplyAll': {
        var s = computeFatigueSuggestion(curDateKey(), now);
        s.withMinVersion.forEach(applyMiniVersion);
        s.withoutMinVersion.forEach(function(item){ setEntryStatus(item.kind, item.refId, curDateKey(), 'excused', {reason:'too_tired'}); });
        ui.energy = null; break;
      }

      // ── 나의 목표 (인사 카드 자리에서 바로 입력) ──
      case 'openGoalEdit': ui.goalDraft = state.settings.myGoal || ''; ui.goalEditOpen = true; break;
      case 'goalDraftInput': ui.goalDraft = args[0]; return;
      case 'goalSave': {
        state.settings.myGoal = (ui.goalDraft||'').trim() || null;
        ui.goalEditOpen = false; break;
      }

      // ── 오늘 컨디션 체크인 (기상 알림을 통해서만 들어와요) ──
      case 'openCheckin': {
        var dkO = todayKey();
        var prevC = state.checkins[dkO] || {};
        ui.checkin = { condition: prevC.condition || 'mid', availableMinutes: prevC.availableMinutes || null,
          mustDoId: prevC.mustDoId || null, burden: prevC.burden || null };
        break;
      }
      case 'checkinClose': ui.checkin = null; break;
      case 'checkinSetCondition': ui.checkin.condition = args[0]; break;
      case 'checkinSetAvailable': ui.checkin.availableMinutes = args[0]; break;
      case 'checkinSetMustDo': ui.checkin.mustDoId = args[0]; break;
      case 'checkinSetBurden': ui.checkin.burden = args[0]; break;
      case 'checkinSave': {
        var dkS = todayKey();
        var mustDoLabel = null;
        if(ui.checkin.mustDoId){
          var mrow = buildTimetableForDate(dkS).find(function(r){ return r.entryId===ui.checkin.mustDoId; });
          if(mrow) mustDoLabel = mrow.label;
        }
        state.checkins[dkS] = Object.assign({}, ui.checkin, {mustDoLabel: mustDoLabel, at: new Date().toISOString()});
        ui.checkin = null; break;
      }

      // ── 실패 패턴 인사이트 ──
      case 'insightDismiss': ui.insightDismissedIds[args[0]] = true; break;
      case 'insightEditTime': {
        ui.tab = 'schedule'; ui.scheduleTab = 'recurring';
        openForm('session', args[0]); break;
      }
      case 'insightApplyMinDefault': {
        var evI = state.events.find(function(e){ return e.id===args[0]; });
        if(evI && evI.minVersion) updateRecurringEvent(evI.id, {label: evI.minVersion, duration: computeMiniDuration(evI.duration), minVersion: null});
        ui.insightDismissedIds[args[0]] = true; break;
      }

      case 'openQuickAdd': ui.quickAdd = {label:'', time:'09:00', duration:30, dateKey:curDateKey(), reminderMinutes:10}; break;
      case 'quickAddClose': ui.quickAdd = null; break;
      case 'quickAddLabel': ui.quickAdd.label = args[0]; return;
      case 'quickAddDateQuick': ui.quickAdd.dateKey = addDaysKey(todayKey(), args[0]); break;
      case 'quickAddDurationPreset': ui.quickAdd.duration = args[0]; break;
      case 'quickAddDurationCustom': break;
      case 'quickAddDurationStep': ui.quickAdd.duration = Math.max(5, ui.quickAdd.duration+args[0]); break;
      case 'quickAddReminderPreset': ui.quickAdd.reminderMinutes = args[0]; break;
      case 'quickAddSave': {
        if(!ui.quickAdd.label.trim()) return;
        addAdhocEntry({label:ui.quickAdd.label.trim(), dateKey:ui.quickAdd.dateKey, time:ui.quickAdd.time,
          duration:ui.quickAdd.duration, isFixed:false, isTimeFixed:false, minVersion:null, memo:null,
          reminderMinutes: ui.quickAdd.reminderMinutes||null});
        ui.quickAdd = null; break;
      }

      case 'openForm': openForm(args[0], args[1]); break;
      case 'formClose': {
        var f = ui.form;
        if(JSON.stringify(f.draft)!==JSON.stringify(f.initial)){
          ui.confirm = {title:'저장하지 않은 변경사항이 있어요', message:'지금 나가면 수정한 내용이 사라져요.',
            noLabel:'계속 수정', yesLabel:'나가기', yesAction:'formCloseConfirmed', danger:true};
          break;
        }
        ui.form = null; break;
      }
      case 'formCloseConfirmed': ui.form = null; ui.confirm = null; break;
      case 'confirmCancel': ui.confirm = null; break;
      case 'formField': ui.form.draft[args[0]] = args[1]; return;
      case 'formToggle': ui.form.draft[args[0]] = !ui.form.draft[args[0]]; break;
      case 'formToggleDay': {
        var days = ui.form.draft.days.slice(); var i = days.indexOf(args[0]);
        if(i===-1) days.push(args[0]); else days.splice(i,1);
        days.sort(function(a,b){return a-b;});
        ui.form.draft.days = days; break;
      }
      case 'formToggleAdvanced': ui.form.advancedOpen = !ui.form.advancedOpen; break;
      case 'formDurationPreset': ui.form.draft.duration = args[0]; break;
      case 'formDurationCustom': break;
      case 'formDurationStep': ui.form.draft.duration = Math.max(5, ui.form.draft.duration+args[0]); break;
      case 'formReminderPreset': ui.form.draft.reminderMinutes = args[0]; break;
      case 'formDateStep': ui.form.draft.dateKey = addDaysKey(ui.form.draft.dateKey, args[0]); break;
      case 'formDateQuick': ui.form.draft.dateKey = addDaysKey(todayKey(), args[0]); break;
      case 'formSave': {
        var fm = ui.form, d = fm.draft;
        if(!d.label.trim()){ alert('이름을 입력해주세요'); return; }
        if(fm.kind==='session' && d.days.length===0){ alert('요일을 하나 이상 선택해주세요'); return; }
        if(fm.kind==='session'){
          var payload = {label:d.label.trim(), time:d.time, days:d.days, duration:d.duration, isFixed:d.isFixed,
            isTimeFixed:d.isTimeFixed, isWorkout:d.isWorkout, minVersion:d.minVersion.trim()||null, memo:d.memo.trim()||null,
            reminderMinutes:d.reminderMinutes||null};
          if(fm.editingId) updateRecurringEvent(fm.editingId, payload); else addRecurringEvent(payload);
        } else {
          var payload2 = {label:d.label.trim(), dateKey:d.dateKey, time:d.time, duration:d.duration, isFixed:d.isFixed,
            isTimeFixed:d.isTimeFixed, minVersion:d.minVersion.trim()||null, memo:d.memo.trim()||null,
            reminderMinutes:d.reminderMinutes||null};
          if(fm.editingId) updateAdhocEntry(fm.editingId, payload2); else addAdhocEntry(payload2);
        }
        ui.form = null; break;
      }
      case 'formDelete': {
        ui.confirm = {title:'삭제할까요?', message:'이 일정을 삭제하면 예정된 알림과 캘린더 항목도 함께 지워져요.',
          noLabel:'취소', yesLabel:'삭제', yesAction:'formDeleteConfirmed', danger:true};
        break;
      }
      case 'formDeleteConfirmed': {
        var fm2 = ui.form;
        if(fm2.kind==='session') deleteRecurringEvent(fm2.editingId); else deleteAdhocEntry(fm2.editingId);
        ui.form = null; ui.confirm = null; break;
      }

      case 'speakNotif': if(ui.notif) speakText(ui.notif.body); return;
      case 'openNotif': {
        var wasWakeNotif = ui.notif && ui.notif.kind==='wake';
        ui.tab = 'today';
        ui.notif = null;
        if(wasWakeNotif){
          // 기상 알림을 누르면 그 흐름 그대로 컨디션 체크로 이어져요 — 컨디션 체크가 오늘 탭에
          // 따로 자리를 차지하지 않고, 기상 시점 한 번에 자연스럽게 물어보도록 합친 거예요.
          var dkW = todayKey();
          var prevW = state.checkins[dkW] || {};
          ui.checkin = { condition: prevW.condition || 'mid', availableMinutes: prevW.availableMinutes || null,
            mustDoId: prevW.mustDoId || null, burden: prevW.burden || null };
        }
        break;
      }

      case 'setIntervention': state.settings.interventionLevel = args[0]; break;
      case 'setPrimaryGoal': state.settings.primaryGoal = args[0]; break;
      case 'setMyGoal': state.settings.myGoal = args[0].trim() || null; return;
      case 'externalCalendarStub': showInfoToast('실제 앱에서 연동할 예정이에요. 지금은 프로토타입이라 미리보기만 가능해요.'); return;
      case 'setAiServerUrl': state.settings.aiServer.url = args[0]; ui.aiServerStatus = null; return;
      case 'setAiServerSecret': state.settings.aiServer.secret = args[0]; ui.aiServerStatus = null; return;
      case 'testAiServer': testAiServerConnection(); return;
      case 'toggleRoutine': state.settings.routine[args[0]] = !state.settings.routine[args[0]]; break;
      case 'routineTimeStep': {
        var rkey = args[0]==='wake' ? 'wakeTime' : 'sleepTime';
        var rhm = parseHM(state.settings.routine[rkey]);
        var rtotal = ((rhm.hour*60+rhm.minute+args[1]) % 1440 + 1440) % 1440;
        state.settings.routine[rkey] = formatHM(Math.floor(rtotal/60), rtotal%60);
        break;
      }
      case 'previewWakeRoutine': {
        // 알림 문구에 오늘 브리핑 헤드라인을 그대로 이어붙이면, 알림을 눌러 들어간 오늘 탭의
        // 인사 카드 말풍선에 같은 문장이 또 나와서 겹쳐 보였어요. 알림은 짧은 기상 멘트만,
        // 자세한 오늘 일정 요약은 오늘 탭의 인사 카드에서 한 번만 보여주도록 분리했어요.
        // v43: 컨디션 체크를 여기로 합쳤어요 — 눌러서 들어가면 바로 컨디션 체크 시트가 떠요.
        ui.notif = { title:'⏰ 기상 알림', body:'좋은 아침이에요! 눌러서 오늘 컨디션을 확인하고, 가볍게 스트레칭부터 해볼까요?', kind:'wake', entryId:null, dateKey:null };
        break;
      }
      case 'previewSleepRoutine': {
        var tmrKey = addDaysKey(todayKey(),1);
        var tmrRows = buildTimetableForDate(tmrKey);
        var sleepBody;
        if(tmrRows.length===0) sleepBody = '내일은 등록된 일정이 없어요. 편하게 쉬셔도 좋아요.';
        else { var firstHm = parseHM(tmrRows[0].time); sleepBody = '내일은 '+tmrRows.length+'개의 일정이 있어요. 첫 일정은 "'+tmrRows[0].label+'" · '+meridiemTimeLabel(firstHm.hour,firstHm.minute)+'이에요.'; }
        ui.notif = { title:'🌙 취침 알림', body: sleepBody, entryId:null, dateKey:null };
        break;
      }
      case 'toggleVoice': {
        state.settings.voice[args[0]] = !state.settings.voice[args[0]];
        if(args[0]==='autoSpeak' && state.settings.voice.autoSpeak) speakBriefingDemo();
        break;
      }

      case 'onboardingNext': ui.onboardingStep = Math.min(2, ui.onboardingStep+1); break;
      case 'onboardingChooseGoal': {
        state.settings.primaryGoal = args[0];
        ui.onboardingStep = Math.min(2, ui.onboardingStep+1);
        break;
      }
      case 'onboardingFinish': ui.onboardingDone = true; ui.onboardingStep = 0; break;
      case 'onboardingRestart': ui.onboardingDone = false; ui.onboardingStep = 0; break;

      case 'resolveOverlap': {
        var ovKind = args[0], ovRefId = args[1], ovNewTime = args[2];
        if(ovKind==='session') setEventOccurrenceOverride(ovRefId, curDateKey(), {time:ovNewTime});
        else updateAdhocEntry(ovRefId, {time:ovNewTime});
        break;
      }
      case 'toggleHistoryChanges': ui.historyChangesOpen = !ui.historyChangesOpen; break;
      // v40: 공유 카드에 오늘 한 일이 항목별로 쭉 나열되면 사생활 노출 우려가 있다는 피드백으로,
      // 기본은 통계만(러닝 앱처럼 %, 며칠째, 총 시간) 보여주고 일정 상세는 직접 켜야만 나오게,
      // 켜더라도 항목별로 숨길 수 있게 했어요.
      case 'openShare': ui.share = {includeDetails:false, hiddenIds:[]}; break;
      case 'shareClose': ui.share = null; break;
      case 'shareToggleDetails': ui.share.includeDetails = !ui.share.includeDetails; break;
      case 'shareToggleItem': {
        var hid = args[0];
        var hIdx = ui.share.hiddenIds.indexOf(hid);
        if(hIdx===-1) ui.share.hiddenIds.push(hid); else ui.share.hiddenIds.splice(hIdx,1);
        break;
      }
      case 'shareSend': shareCardNow(); return;
      case 'shareDownload': downloadShareCard(); return;

      case 'openChat': {
        ui.chatOpen = true;
        if(!ui.chat) ui.chat = { messages:[{id:uid('m'), role:'bot',
          text:'안녕하세요! "내일 오후 3시에 병원 예약 1시간"처럼 편하게 말해보세요.'}], draftText:'' };
        break;
      }
      case 'chatClose': ui.chatOpen = false; break;
      case 'chatInput': ui.chat.draftText = args[0]; return;
      case 'chatQuickPrompt': ui.chat.draftText = args[0]; sendChatText(args[0]); break;
      case 'chatSend': {
        var text = ui.chat.draftText.trim();
        if(!text) return;
        sendChatText(text);
        break;
      }
      case 'chatToggleAmPm': {
        var tmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(tmsg && tmsg.proposal){
          var thm = parseHM(tmsg.proposal.time);
          thm.hour = (thm.hour+12)%24;
          tmsg.proposal.time = formatHM(thm.hour, thm.minute);
        }
        break;
      }
      case 'chatOpenFatigue': {
        ui.chatOpen = false;
        ui.energy = {view:'summary', doneIds:[]};
        break;
      }
      case 'chatConfirm': {
        var cmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(cmsg && cmsg.proposal){
          var cp = cmsg.proposal;
          if(cp.recurring) addRecurringEvent({label:cp.label, time:cp.time, days:cp.days, duration:cp.duration,
            isFixed:false, isWorkout:false, minVersion:null, memo:null});
          else addAdhocEntry({label:cp.label, dateKey:cp.dateKey, time:cp.time, duration:cp.duration,
            isFixed:false, minVersion:null, memo:null});
          cmsg.proposal = null;
          ui.chat.messages.push({id:uid('m'), role:'bot', text:'추가했어요! 다른 것도 말해줘요.'});

        break;
      }
      case 'chatDismiss': {
        var dmsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(dmsg) dmsg.proposal = null;
        ui.chat.messages.push({id:uid('m'), role:'bot', text:'네, 취소할게요.'});
        break;
      }
      case 'serverActionConfirm': {
        var smsg = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(smsg && smsg.serverAction){
          applyServerAction(smsg.serverAction);
          smsg.serverAction = null;
          ui.chat.messages.push({id:uid('m'), role:'bot', text:'반영했어요! 다른 것도 말해줘요.'});
        }
        break;
      }
      case 'serverActionDismiss': {
        var smsg2 = ui.chat.messages.find(function(m){ return m.id===args[0]; });
        if(smsg2) smsg2.serverAction = null;
        ui.chat.messages.push({id:uid('m'), role:'bot', text:'네, 반영하지 않을게요.'});
        break;
      }

      case 'setHistoryMonth': ui.historyMonthOffset += args[0]; ui.historySelectedDate = null; break;
      case 'selectHistoryDate': ui.historySelectedDate = (ui.historySelectedDate===args[0] ? null : args[0]); break;
    }
    render();
  };

  function openForm(kind, id){
    var draft;
    if(kind==='session'){
      var ev = id ? state.events.find(function(e){return e.id===id;}) : null;
      draft = ev ? {label:ev.label, time:ev.time, days:ev.days.slice(), dateKey:todayKey(), duration:ev.duration,
        isFixed:ev.isFixed, isTimeFixed:!!ev.isTimeFixed, isWorkout:ev.isWorkout, minVersion:ev.minVersion||'', memo:ev.memo||'',
        reminderMinutes:ev.reminderMinutes||0} :
        {label:'', time:'09:00', days:[], dateKey:todayKey(), duration:30, isFixed:false, isTimeFixed:false, isWorkout:false, minVersion:'', memo:'', reminderMinutes:10};
    } else {
      var en = id ? state.adhocEntries.find(function(e){return e.id===id;}) : null;
      draft = en ? {label:en.label, time:en.time, days:[], dateKey:en.dateKey, duration:en.duration,
        isFixed:en.isFixed, isTimeFixed:!!en.isTimeFixed, isWorkout:false, minVersion:en.minVersion||'', memo:en.memo||'',
        reminderMinutes:en.reminderMinutes||0} :
        {label:'', time:'09:00', days:[], dateKey:curDateKey(), duration:30, isFixed:false, isTimeFixed:false, isWorkout:false, minVersion:'', memo:'', reminderMinutes:10};
    }
    ui.form = { kind:kind, editingId:id||null, draft: draft, initial: Object.assign({}, draft), advancedOpen:false };
  }

  function findFatigueItem(refId){
    var s = computeFatigueSuggestion(curDateKey(), new Date());
    return s.withMinVersion.concat(s.withoutMinVersion).find(function(i){ return i.refId===refId; });
  }
  function applyMiniVersion(item){
    var miniLabel = item.minVersion || item.label;
    var miniDuration = item.miniDuration || computeMiniDuration(item.duration);
    if(item.kind==='session') setEventOccurrenceOverride(item.refId, curDateKey(), {label:miniLabel, duration:miniDuration, isMiniVersion:true});
    else {
      // 버그 수정: adhoc(하루짜리) 일정은 minVersion을 그대로 남겨두면, 이미 가볍게 바꾼 뒤에도
      // "가볍게 바꿀 수 있어요"라고 계속 재제안했어요(그래서 문구가 안 바뀌는 것처럼 보였어요).
      // 적용한 뒤에는 minVersion을 비우고 isMiniVersion을 표시해서 다시 제안되지 않게 해요.
      updateAdhocEntry(item.refId, {label:miniLabel, duration:miniDuration, isMiniVersion:true, minVersion:null});
    }
  }

  function speakText(text){
    try{
      if(!('speechSynthesis' in window)) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakBriefingDemo(){
    speakText(computeBriefing(curDateKey(), new Date()).headline);
  }

  // 짧은 "띠링" 알림음 — 외부 오디오 파일 없이 Web Audio API로 두 음을 순서대로 울려요.
  function playChime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      [880, 1320].forEach(function(freq, i){
        var t0 = ctx.currentTime + i*0.14;
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(0.16, t0+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0+0.32);
      });
    }catch(e){}
  }

  // ── 일정 시작 전 알림 ──
  // entryId별로 이번 세션에서 이미 울렸는지 기억해요(같은 일정이 매 60초 체크마다
  // 다시 울리지 않도록). 새로고침하면 초기화되는데, 데모 프로토타입이라 괜찮아요 —
  // 실제 앱이라면 이 부분이 기기의 로컬/푸시 알림 스케줄러가 될 자리예요.
  var firedReminderIds = {};
  function checkReminders(){
    // 네이티브 앱(Capacitor)에서는 OS가 예약된 알림을 직접 울려주니까, 여기서 화면 안
    // 타이머로 또 울리면 앱이 켜져 있는 동안 두 번 알림이 뜨는 꼴이라 건너뛰어요.
    if(isNativeApp()) return;
    var dateKey = todayKey(), now = new Date();
    var nowMinutes = now.getHours()*60+now.getMinutes();
    buildTimetableForDate(dateKey).forEach(function(row){
      if(!row.reminderMinutes || FINISHED.indexOf(row.status)!==-1) return;
      var hm = parseHM(row.time), start = hm.hour*60+hm.minute;
      var fireAt = start - row.reminderMinutes;
      // 정확히 그 분에 타이머가 맞지 않을 수 있어서(60초 간격 드리프트), fireAt과 시작 시간
      // 사이 구간이면 아직 안 울린 것만 골라 한 번 울려요.
      if(nowMinutes >= fireAt && nowMinutes < start && !firedReminderIds[row.entryId]){
        firedReminderIds[row.entryId] = true;
        fireReminder(row);
      }
    });
  }
  function fireReminder(row){
    var body = row.reminderMinutes+'분 후 "'+row.label+'"이(가) 시작해요.';
    ui.notif = { title:'⏰ 일정 알림', body: body, kind:'reminder', entryId: row.entryId, dateKey: todayKey() };
    playChime();
    // 갑자기 밖에서 일정 내용이 소리로 흘러나오는 걸 막기 위해, 이어폰이 연결돼 있을 때만
    // 내용을 음성으로 읽어줘요. 아니면 방금 울린 띠링 소리뿐이고, 내용은 알림 배너를 보거나
    // "듣기" 버튼을 직접 눌러야 들을 수 있어요.
    if(state.settings.voice.ttsEnabled && state.settings.voice.headphonesConnected) speakText(body);
    render();
  }

  // 네이티브 앱에서 처음 켜질 때 한 번: 알림 권한을 요청하고(iOS/Android 13+ 둘 다 이
  // 호출 하나로 처리돼요), 안드로이드 알림 채널을 만들고, 오늘 알림을 전부 예약해요.
  // 브라우저 프로토타입에서는 nativeNotifPlugin()이 null이라 그냥 아무 일도 안 해요.
  function setupNativeNotifications(){
    var plugin = nativeNotifPlugin();
    if(!plugin) return;
    plugin.requestPermissions().catch(function(){});
    if(plugin.createChannel){
      plugin.createChannel({ id:'godsaeng-reminders', name:'일정 알림', importance:4 }).catch(function(){});
    }
    syncAllNativeRemindersForToday();
  }

  // 1분마다 시계 갱신 + 알림 체크 — 열려있는 시트가 없을 때만 화면을 다시 그려서, 조작 중인
  // 모달이 리셋되지 않게 해요. 알림 체크는 모달이 열려 있어도 계속 돌아가요.
  setInterval(function(){
    checkReminders();
    if(!ui.sheet && !ui.overlap && !ui.energy && !ui.checkin && !ui.quickAdd && !ui.form) render();
  }, 60000);
  checkReminders();
  setupNativeNotifications();

  render();
})();
</script>

</body></html>
