<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>갓생살자 v32 프리뷰</title>
<style>
  :root{
    --bg:#F3F5F1;
    --surface:#FFFFFF;
    --surface-2:#F7F8F5;
    --border:#E2E7E0;
    --text:#182420;
    --text-muted:#5B665F;
    --text-faint:#8C968E;
    --accent:#2F6F5E;
    --accent-text:#FFFFFF;
    --accent-soft:#E3EFE9;
    --success:#3B8464;
    --success-bg:#E7F2EB;
    --warn:#A97417;
    --warn-bg:#FBEEDA;
    --danger:#B5482F;
    --danger-bg:#F7E5DF;
    --chip-bg:#EDF0EA;
    --overlay:rgba(18,24,21,0.5);
    --shadow: 0 20px 50px -24px rgba(15,30,24,0.35);
    /* 히스토리 캘린더 — 성공/실패(초록/빨강) 대신 한 색(보라)의 농도로 표현해요 */
    --cal-1-bg:#F3E9DC; --cal-1-text:#9C7A4A;
    --cal-2-bg:#EDE1F7; --cal-2-text:#8452C4;
    --cal-3-bg:#D0AEEF; --cal-3-text:#5B21B6;
    --cal-4-bg:#A970E8; --cal-4-text:#FFFFFF;
    --cal-5-bg:#7C3AED; --cal-5-text:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1714;
      --surface:#17211D;
      --surface-2:#1C2721;
      --border:#2B3730;
      --text:#EAF1EC;
      --text-muted:#A6B3AC;
      --text-faint:#77857D;
      --accent:#5BC0A0;
      --accent-text:#08211A;
      --accent-soft:#1F3A31;
      --success:#5BC0A0;
      --success-bg:#1C3629;
      --warn:#E3B255;
      --warn-bg:#3A2E15;
      --danger:#E28468;
      --danger-bg:#3B2019;
      --chip-bg:#20302A;
      --overlay:rgba(0,0,0,0.6);
      --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
      --cal-1-bg:#3A2E1F; --cal-1-text:#D9B98A;
      --cal-2-bg:#2E2440; --cal-2-text:#C9A6F0;
      --cal-3-bg:#4A2F73; --cal-3-text:#E4CFFA;
      --cal-4-bg:#6B3FBF; --cal-4-text:#FFFFFF;
      --cal-5-bg:#9256F0; --cal-5-text:#FFFFFF;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1714; --surface:#17211D; --surface-2:#1C2721; --border:#2B3730;
    --text:#EAF1EC; --text-muted:#A6B3AC; --text-faint:#77857D;
    --accent:#5BC0A0; --accent-text:#08211A; --accent-soft:#1F3A31;
    --success:#5BC0A0; --success-bg:#1C3629; --warn:#E3B255; --warn-bg:#3A2E15;
    --danger:#E28468; --danger-bg:#3B2019; --chip-bg:#20302A; --overlay:rgba(0,0,0,0.6);
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --cal-1-bg:#3A2E1F; --cal-1-text:#D9B98A;
    --cal-2-bg:#2E2440; --cal-2-text:#C9A6F0;
    --cal-3-bg:#4A2F73; --cal-3-text:#E4CFFA;
    --cal-4-bg:#6B3FBF; --cal-4-text:#FFFFFF;
    --cal-5-bg:#9256F0; --cal-5-text:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); zoom:1.18;
    font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',system-ui,sans-serif;}
  button{font-family:inherit;}
  .page{min-height:100%; display:flex; justify-content:center;
    padding: 20px 14px 40px;}
  .phone{width:100%; max-width:400px; background:var(--surface);
    border-radius:26px; border:1px solid var(--border); box-shadow:var(--shadow);
    overflow:hidden; display:flex; flex-direction:column; position:relative;}
  .banner{background:var(--accent-soft); color:var(--text); font-size:12.5px;
    line-height:1.5; padding:10px 16px; display:flex; gap:8px; align-items:flex-start;
    border-bottom:1px solid var(--border);}
  .banner button{background:none; border:none; color:var(--text-muted); font-size:12px;
    text-decoration:underline; padding:0; cursor:pointer; flex-shrink:0;}
  .topbar{padding:18px 18px 10px; display:flex; justify-content:space-between; align-items:flex-end;}
  .topbar .date{font-size:12.5px; color:var(--text-muted); margin-bottom:2px;}
  .topbar .brand{font-size:21px; font-weight:800; letter-spacing:-.2px;}
  .quickadd-btn{display:flex; align-items:center; gap:4px; background:var(--accent);
    color:var(--accent-text); border:none; border-radius:999px; padding:8px 13px;
    font-size:12.5px; font-weight:700; cursor:pointer;}
  .daytoggle{display:flex; gap:8px; padding:2px 18px 12px;}
  .content{padding: 0 18px 24px;}
  .section-title{font-size:15.5px; font-weight:800; margin: 18px 0 8px;}
  .section-sub{font-size:12px; color:var(--text-muted); margin-top:-4px; margin-bottom:10px; line-height:1.5;}
  .card{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:16px;}
  .briefing-text{font-size:14px; line-height:1.55;}
  .briefing-note{font-size:12px; color:var(--warn); margin-top:8px;}
  /* v40: 겹침 전용 인라인 경고 카드 — 눈에는 띄지만(빨강) 그라데이션 CTA처럼 화면을 압도하지
     않는 크기로. 안에서 바로 "겹침 해결하기"를 누를 수 있어서 이전의 수동적인 경고 문구보다
     실행 가능해요. */
  .overlap-card{background:var(--danger-bg); border-radius:14px; padding:12px 14px; margin-top:10px;}
  .oc-title{font-size:13px; font-weight:800; color:var(--danger);}
  .oc-detail{font-size:12px; color:var(--danger); opacity:.85; margin-top:3px;}
  .oc-actions{display:flex; gap:8px; margin-top:10px;}
  .btn-oc-primary{flex:1; background:var(--danger); color:#fff; border:none; border-radius:999px;
    padding:9px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .btn-oc-ghost{background:none; border:none; color:var(--danger); font-size:12.5px; font-weight:700;
    cursor:pointer; padding:9px 8px;}
  /* v40: 컨디션 조정 모달 상단 "변경 요약" — 전체 타임라인을 다 봐야 뭐가 바뀌는지 알 수 있던
     문제를 해결하려고, 바뀌는 항목만 짧은 줄로 먼저 보여줘요. */
  .change-summary{background:var(--surface-2); border-radius:12px; padding:4px 12px; margin-top:8px;}
  .change-line{font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--border); line-height:1.5;}
  .change-line:last-child{border-bottom:none;}
  /* v40: 공유 카드 "일정 상세 포함" — 항목별로 카드에 넣을지 뺄지 직접 고를 수 있어요. */
  .share-detail-list{margin-top:2px; max-height:220px; overflow-y:auto;}
  .share-detail-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .share-detail-row:last-child{border-bottom:none;}
  .share-detail-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .share-detail-row .lbl{flex:1; font-weight:600;}
  .share-detail-row.hidden .lbl{color:var(--text-faint); text-decoration:line-through;}
  .share-eye-btn{background:var(--chip-bg); border:none; border-radius:999px; padding:6px 10px;
    font-size:10.5px; font-weight:700; color:var(--text-muted); cursor:pointer; flex-shrink:0;}
  .next-up-bar{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text); margin-bottom:12px;}
  .next-up-bar .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .next-up-bar.live .dot{background:var(--success); animation:nextUpPulse 1.6s ease-in-out infinite;}
  @keyframes nextUpPulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .briefing-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .briefing-actions .btn{width:auto; flex:1 1 auto; margin-bottom:0; padding:10px 14px; font-size:13px;}
  .fatigue-btn{margin-top:12px; display:inline-flex; align-items:center; gap:6px;
    background:var(--chip-bg); border:none; border-radius:999px; padding:8px 14px;
    font-size:12.5px; font-weight:700; color:var(--text); cursor:pointer;}
  .row{display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .row:active{opacity:.8;}
  .row-time{flex-shrink:0; white-space:nowrap;}
  .row-time .t{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .row-main{flex:1; min-width:0;}
  .row-main .lbl{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-main .memo{font-size:11.5px; color:var(--text-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;}
  .badge-default{background:var(--chip-bg); color:var(--text-muted);}
  .badge-success{background:var(--success-bg); color:var(--success);}
  .badge-warn{background:var(--warn-bg); color:var(--warn);}
  .badge-danger{background:var(--danger-bg); color:var(--danger);}
  .chip{display:inline-flex; align-items:center; padding:8px 14px; border-radius:999px;
    background:var(--chip-bg); color:var(--text); font-size:12.5px; font-weight:600;
    border:none; cursor:pointer; margin:0 8px 8px 0;}
  .chip.active{background:var(--accent); color:var(--accent-text);}
  .chip.small{padding:5px 10px; font-size:11.5px;}
  .btn{display:flex; align-items:center; justify-content:center; width:100%;
    border:none; border-radius:999px; padding:13px 16px; font-size:14px; font-weight:700;
    cursor:pointer; margin-bottom:9px;}
  .btn:last-child{margin-bottom:0;}
  .btn-primary{background:var(--accent); color:var(--accent-text);}
  .btn-secondary{background:var(--chip-bg); color:var(--text);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .empty{padding:34px 12px; text-align:center; color:var(--text-muted); font-size:13.5px; line-height:1.6;}
  .tabbar{position:sticky; bottom:0; display:flex; background:var(--surface);
    border-top:1px solid var(--border); padding:8px 4px 10px;}
  .tabbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px;}
  .tabbtn.active{color:var(--accent);}
  .tabbtn span{font-size:10.5px; font-weight:700;}
  .fab{position:fixed; width:52px; height:52px; border-radius:999px; background:var(--accent);
    color:var(--accent-text); border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 24px -8px rgba(0,0,0,.35); cursor:pointer;}
  .overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; padding: 0 0;}
  .sheet{width:100%; max-width:400px; background:var(--surface); border-radius:20px 20px 0 0;
    padding:20px 20px 26px; max-height:82vh; overflow-y:auto;}
  .sheet-title{font-size:16.5px; font-weight:800;}
  .sheet-sub{font-size:12.5px; color:var(--text-muted); margin-top:4px; line-height:1.5;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-muted); margin: 14px 0 7px;}
  .stepper-row{display:flex; justify-content:center; gap:28px; margin-top:6px;}
  .stepper{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .stepper .lbl{font-size:11px; color:var(--text-muted);}
  .stepper-ctrl{display:flex; align-items:center; gap:10px;}
  .stepper-btn{width:32px; height:32px; border-radius:999px; background:var(--chip-bg);
    border:none; font-size:17px; font-weight:700; color:var(--text); cursor:pointer;}
  .stepper-val{min-width:56px; text-align:center; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .big-time{text-align:center; font-size:19px; font-weight:800; margin-bottom:6px;}
  .preset-row{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px;}
  .textfield{width:100%; border:1px solid var(--border); border-radius:12px; background:var(--surface);
    color:var(--text); font-size:14px; padding:10px 13px; margin-bottom:12px; font-family:inherit;}
  .textfield:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .toast-wrap{position:fixed; left:0; right:0; bottom:96px; display:flex; justify-content:center;
    padding:0 20px; z-index:80; pointer-events:none;}
  .toast{pointer-events:auto; display:flex; align-items:center; gap:14px; background:var(--text);
    color:var(--bg); border-radius:999px; padding:11px 18px; max-width:380px; box-shadow:var(--shadow);}
  .toast span:first-child{font-size:12.5px; flex:1;}
  .toast button{background:none; border:none; color:var(--accent-text, #9AE0C7); font-weight:800;
    font-size:12.5px; cursor:pointer; filter: brightness(1.4);}
  .notif{margin:0 16px 10px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
    cursor:pointer; box-shadow:var(--shadow);}
  .notif .ic{font-size:18px;}
  .notif .tt{font-size:12px; font-weight:800; color:var(--text-muted);}
  .notif .bb{font-size:13px; margin-top:2px;}
  .item-card{display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .item-card .lbl{font-size:14px; font-weight:700;}
  .item-card .meta{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
  .item-card.paused{opacity:.55;}
  .skip-btn{padding:6px 10px; border-radius:999px; background:var(--chip-bg); border:none;
    font-size:10.5px; font-weight:700; color:var(--text-muted); cursor:pointer; flex-shrink:0;}
  .form-title{font-size:17px; font-weight:800; margin: 4px 0 16px;}
  .day-row{display:flex; justify-content:space-between; gap:4px;}
  .day-dot{width:34px; height:34px; border-radius:999px; background:var(--chip-bg); border:none;
    font-size:12.5px; font-weight:700; color:var(--text); cursor:pointer;}
  .day-dot.active{background:var(--accent); color:var(--accent-text);}
  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0;
    border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .back-btn{background:none; border:none; padding:8px; margin-left:-8px; display:flex;
    align-items:center; justify-content:center; color:var(--text); cursor:pointer; border-radius:999px;}
  .back-btn:active{background:var(--chip-bg);}
  .settings-row .t{font-size:14px; font-weight:700;}
  .settings-row .d{font-size:11.5px; color:var(--text-muted); margin-top:3px; max-width:230px;}
  .toggle-track{width:44px; height:26px; border-radius:999px; background:var(--border); border:none;
    padding:3px; cursor:pointer; flex-shrink:0;}
  .toggle-track.on{background:var(--accent);}
  .toggle-thumb{width:20px; height:20px; border-radius:999px; background:var(--surface); transition:margin .15s;}
  .toggle-track.on .toggle-thumb{margin-left:18px;}
  .fatigue-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border);}
  .fatigue-item .lbl{font-size:14px; font-weight:700;}
  .fatigue-item .sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .fatigue-item-btn{background:var(--accent); color:var(--accent-text); border:none; border-radius:999px;
    padding:7px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0;}
  .undo-btn{background:var(--chip-bg); border:none; border-radius:999px; padding:7px 11px;
    font-size:11px; font-weight:700; color:var(--text); cursor:pointer; flex-shrink:0;}
  .change-row{display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:7px;}
  /* ── 피곤해요 전/후 비교(before/after) — 왼쪽(전)·오른쪽(후) 2단으로 나란히 보여줘서
     한눈에 비교되게 해요. 빨강은 삭제처럼 보여서 쓰지 않고, 시간이 줄어드는 건 초록(--success),
     건너뛰는 건 주황 톤(--warn)으로 구분해요 ── */
  .compare-block{margin-top:8px;}
  .compare-heading{font-size:11px; font-weight:800; color:var(--text-faint); letter-spacing:.02em; margin:12px 0 4px;}
  .compare-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px;
    padding:10px 0; border-bottom:1px solid var(--border);}
  .compare-row:last-child{border-bottom:none;}
  .compare-col{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .compare-col .lbl{font-size:13px; font-weight:700; white-space:normal; word-break:keep-all;}
  .compare-col .meta{font-size:11px; font-variant-numeric:tabular-nums;}
  .compare-col.old{color:var(--text-faint);}
  .compare-col.old .lbl, .compare-col.old .meta{text-decoration:line-through;}
  .compare-col.new .lbl{font-size:13.5px; font-weight:800;}
  .compare-col.new .meta{font-size:11.5px; font-weight:700;}
  .compare-col.new.reduced .lbl, .compare-col.new.reduced .meta{color:var(--success);}
  .compare-col.new.skip .lbl, .compare-col.new.skip .meta{color:var(--warn);}
  .compare-arrow{font-size:15px; color:var(--text-faint); font-weight:700;}
  .compare-total{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);
    font-size:13.5px; font-weight:800; text-align:left;}
  .compare-note{font-size:11.5px; color:var(--text-faint); margin-top:10px; line-height:1.55;}

  /* ── 오늘 탭 리디자인(v36): 인사 카드 + 마스코트 + 컬러 점 타임라인 ──
     레퍼런스 이미지의 느낌(왼쪽 컬러 점 + 시작-종료 시간 목록, 마스코트 인사 카드,
     그라데이션 CTA 버튼, 색상 블록 전/후 비교)을 오늘 탭에만 적용해요. 마스코트는 원본
     사진 캐릭터를 베끼지 않고, 이 앱의 새싹(🌱) 테마 + "머리띠 두르고 몰입하는" 컨셉으로 새로 그렸어요. */
  .greet-card{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:14px;}
  .greet-text .h1{font-size:22px; font-weight:800; line-height:1.3;}
  .greet-text .h1.placeholder{color:var(--text-faint); font-weight:700;}
  .greet-text .sub{font-size:12.5px; color:var(--text-muted); margin-top:3px;}
  .greet-mascot-col{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
  .greet-bubble{background:var(--surface-2); border:1px solid var(--border); border-radius:14px 14px 4px 14px;
    padding:8px 11px; font-size:11px; font-weight:700; color:var(--text); max-width:120px; line-height:1.4;}
  .reschedule-cta{margin-top:14px; width:100%; border:none; border-radius:999px; padding:14px 16px;
    font-size:14.5px; font-weight:800; color:#fff; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px; background:linear-gradient(90deg,#7C5CFC,#4C8DFF);
    box-shadow:0 10px 20px -10px rgba(124,92,252,.55);}
  .reschedule-cta:active{opacity:.9;}

      // 얼마나 길고 촘촘한지(패턴)로 "약하다/강하다"를 표현해요.
      notify:{ alertStyle:'sound', volume:0.6, vibrateIntensity:'medium' },
      // 장기 목표를 매번 잘게 쪼개진 않지만, 최소한 "나의 목표"를 한 줄로 적어두면
      // 오늘 무엇을 지킬지 판단 기준이 생겨요(목표 계층의 가장 가벼운 버전). 오늘 탭의
      // 인사 카드 자리에 크게 보여줘서, 열 때마다 자연스럽게 떠올리게 해요. 온보딩에서
      // 직접 문장으로 적거나, 오늘 탭에서 그 자리를 눌러 언제든 다시 쓸 수 있어요.
      myGoal:null,
      // 기상·취침 루틴은 선택이 아니라 항상 켜져 있는 필수 알림이에요 — 시간만 조절할 수 있어요
      // (예전 리뷰에서 "운동 전용처럼 보이는 강제 미션"은 빼기로 했던 것과는 별개로, 이건 특정
      // 운동을 강요하지 않는 일반적인 아침/저녁 루틴 알림이라 이 앱의 정체성과 어울려요).
      // 요일별로 다르게 설정할 수 있어요(주말엔 더 늦게 일어나고 싶은 경우 등) — 처음엔 7일
      // 모두 같은 값이라 결과적으로 "매일 같은 시간"과 똑같아요. 키는 Date.getDay()와 같은
      // 요일 인덱스(0=일 ~ 6=토)예요.
      routine:{
        wakeTimes:{0:'07:00',1:'07:00',2:'07:00',3:'07:00',4:'07:00',5:'07:00',6:'07:00'},
        sleepTimes:{0:'23:00',1:'23:00',2:'23:00',3:'23:00',4:'23:00',5:'23:00',6:'23:00'}
      },
      // 채팅이 규칙 기반 대신 실제 LLM과 대화하게 하려면 여기에 배포된 서버 주소를 넣어요
      // (repo의 server/ 폴더 + server/README.md 참고). 비워두면 지금처럼 규칙 기반으로 동작해요.
      aiServer:{ url:'', secret:'' },
      // 캘린더 양방향 자동 동기화 — 온보딩에서 "캘린더 연동하고 시작"을 고르면 켜져요.
      // 실제 OAuth 연동은 프로토타입 범위 밖이라 이 값 자체는 의도만 저장해요
      // (CALENDAR_SYNC.md에 실제 앱 구현 체크리스트를 정리해뒀어요).
      calendarSync:{ enabled:false, provider:null }
    }
  };

  // 히스토리 캘린더 데모용 — 최근 두 달치 기록을 그럴듯하게 채워요(고정 시드라 새로고침해도 같은 모양).
  function seededRandom(seedStr){
    var h = 0;
    for(var i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) >>> 0; }
    return function(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000)/1000; };
  }
  function generateDemoHistory(){
    var WEIGHTS = [['done_full',0.62],['done_partial',0.16],['done_none',0.12],['skipped',0.10]];
    for(var back=3; back<=59; back++){
      var dk = addDaysKey(TK, -back);
      var wd = weekdayOfKey(dk);
      state.events.forEach(function(ev){
        if(ev.days.indexOf(wd)===-1) return;
        var id = ev.id+'-'+dk;
        if(state.scheduleEntries.some(function(e){return e.id===id;})) return;
        var rnd = seededRandom(id)();
        var acc = 0, status = 'done_full';
        for(var i=0;i<WEIGHTS.length;i++){ acc += WEIGHTS[i][1]; if(rnd<=acc){ status = WEIGHTS[i][0]; break; } }
        var reason = null;
        if(status==='done_partial') reason = ['too_tired','no_time'][Math.floor(seededRandom(id+'r')()*2)];
        if(status==='done_none') reason = ['no_time','forgot','too_tired'][Math.floor(seededRandom(id+'r')()*3)];
        state.scheduleEntries.push({id:id, refId:ev.id, kind:'session', dateKey:dk, status:status, reason:reason});
      });
    }
  }
  generateDemoHistory();

  // 온보딩 "예시 일정으로 둘러보기"를 다시 선택했을 때(예: 캘린더 연동/새로 시작으로 비운
  // 뒤 온보딩을 다시 봤을 때) 예시 데이터를 항상 같은 모습으로 복원해요.
  function seedDemoData(){
    state.events = demoEvents();
    state.adhocEntries = demoAdhocEntries();
    state.scheduleEntries = demoScheduleEntries();
    state.eventOccurrenceOverrides = {};
    state.changeLog = demoChangeLog();
    state.settings.calendarSync = { enabled:false, provider:null };
    generateDemoHistory();
  }

  var ui = {
    tab:'today', dayOffset:0, scheduleTab:'recurring',
    sheet:null, quickAdd:null, form:null, toast:null, notif:null,
    bannerOpen:true, confirm:null, briefingDismissed:false,
    // v40: 겹침 해결과 컨디션 조정을 별개의 모달/흐름으로 분리했어요(기존엔 둘 다 ui.fatigue 하나였어요).
    overlap:null, overlapDismissed:false,
    energy:null,
    checkin:null, insightDismissedIds:{},
    goalEditOpen:false, goalDraft:'',
    aiServerStatus:null,
    settingsSection:null, interventionExampleOpen:false, routineModalOpen:false, routineEditDays:[weekdayOfKey(TK)],
    onboardingDone:false, onboardingStep:0,
    chatOpen:false, chat:null,
    historyMonthOffset:0, historySelectedDate:null,
    share:null, historyChangesOpen:false
  };
  var toastTimer = null, notifTimer = null;

  // ───────────────────────── 파생 데이터 (schedule.ts 포팅) ─────────────────────────
  var FINISHED = ['done_full','done_partial','done_none','skipped','excused'];

  function findScheduleEntry(entryId){
    for(var i=0;i<state.scheduleEntries.length;i++) if(state.scheduleEntries[i].id===entryId) return state.scheduleEntries[i];
    return null;
  }

  function buildTimetableForDate(dateKey){
    var wd = weekdayOfKey(dateKey), rows = [];
    state.events.forEach(function(ev){
      if(ev.paused) return; // 잠시 쉬기 중인 반복 일정은 켜질 때까지 시간표에서 완전히 빠져요
      if(ev.days.indexOf(wd) === -1) return;
      var entryId = ev.id+'-'+dateKey;
      var ov = state.eventOccurrenceOverrides[ev.id+'|'+dateKey];
      var time = (ov && ov.time) || ev.time;
      var duration = (ov && ov.duration) || ev.duration;
      var label = (ov && ov.label) || ev.label;
      var record = findScheduleEntry(entryId);
      rows.push({ entryId:entryId, refId:ev.id, kind:'session', label:label, time:time, duration:duration,
        isFixed:ev.isFixed, minVersion:ev.minVersion, memo:ev.memo,
        status: record ? record.status : 'upcoming',
        isMiniVersion: !!(ov && ov.isMiniVersion), reminderMinutes:ev.reminderMinutes||null });
    });
    state.adhocEntries.forEach(function(en){
      if(en.dateKey !== dateKey) return;
      var entryId = en.id+'-'+dateKey;
      var record = findScheduleEntry(entryId);
      rows.push({ entryId:entryId, refId:en.id, kind:'adhoc', label:en.label, time:en.time, duration:en.duration,
        isFixed:en.isFixed, minVersion:en.minVersion||null, memo:en.memo,
        status: record ? record.status : 'upcoming', isMiniVersion:!!en.isMiniVersion, reminderMinutes:en.reminderMinutes||null });
    });
    rows.sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    return rows;
  }

  function deriveLiveStatus(row, nowMinutes){
    if(row.status !== 'upcoming') return row.status;
    var hm = parseHM(row.time), start = hm.hour*60+hm.minute, end = start+row.duration;
    if(nowMinutes < start) return 'upcoming';
    if(nowMinutes >= start && nowMinutes < end) return 'in_progress';
    return 'awaiting_result';
  }

  // "몇 분 전 알림"보다, 화면을 열면 항상 보이는 "다음 일정까지 N분" 표시가 낫겠다는 요청으로 추가했어요.
  // 1분마다 도는 setInterval(render, 60000)에 얹혀서 자동으로 갱신돼요.
  function computeNextUp(dateKey, now){
    var rows = buildTimetableForDate(dateKey);
    var nowMinutes = now.getHours()*60+now.getMinutes();
    var withLive = rows.map(function(r){ return Object.assign({}, r, {live: deriveLiveStatus(r, nowMinutes)}); });
    var inProgress = withLive.filter(function(r){ return r.live==='in_progress'; })
      .sort(function(a,b){ return a.time<b.time?-1:a.time>b.time?1:0; })[0];
    if(inProgress){
      var hm = parseHM(inProgress.time);
      var endMinutes = hm.hour*60+hm.minute+inProgress.duration;
      return { mode:'in_progress', label:inProgress.label, minutesLeft: Math.max(0, endMinutes-nowMinutes) };
    }
    var upcoming = withLive.filter(function(r){ return r.live==='upcoming'; })
      .sort(function(a,b){ return a.time<b.time?-1:a.time>b.time?1:0; })[0];
    if(upcoming){
      var hm2 = parseHM(upcoming.time);
      var startMinutes = hm2.hour*60+hm2.minute;
      return { mode:'upcoming', label:upcoming.label, time:upcoming.time, minutesLeft: Math.max(0, startMinutes-nowMinutes) };
    }
    return null;
  }

  function computeBriefing(dateKey, now){
    var rows = buildTimetableForDate(dateKey);
    var nowMinutes = now.getHours()*60+now.getMinutes();
    var withLive = rows.map(function(r){ return Object.assign({}, r, {live: deriveLiveStatus(r, nowMinutes)}); });
    var remaining = withLive.filter(function(r){
      var hm = parseHM(r.time); return (hm.hour*60+hm.minute+r.duration) >= nowMinutes && FINISHED.indexOf(r.live) === -1;
    });
    var overlapCount = 0;
    var sorted = rows.slice().sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    for(var i=0;i<sorted.length-1;i++){
      var a=sorted[i], b=sorted[i+1];
      var aHm=parseHM(a.time), bHm=parseHM(b.time);
      var aEnd = aHm.hour*60+aHm.minute+a.duration, bStart = bHm.hour*60+bHm.minute;
      if(bStart < aEnd) overlapCount++;
    }
    var totalMinutes = rows.reduce(function(s,r){ return s+r.duration; }, 0);
    // 남은 일정 기준으로만 문구를 만들어요 (전체 개수/시간이 섞이면 앞뒤가 안 맞는 문구가 돼요).
    var remainingMinutes = remaining.reduce(function(s,r){ return s+r.duration; }, 0);
    var headline;
    if(rows.length === 0) headline = '오늘 등록된 일정이 없어요. 새 일정을 추가하거나 편하게 쉬어도 좋아요.';
    else if(remaining.length === 0) headline = '오늘 남은 일정이 없어요. 수고 많으셨어요.';
    else headline = '남은 일정은 '+remaining.length+'개, 총 '+formatDurationHM(remainingMinutes)+' 분량이에요.';
    var note = overlapCount > 0 ? ('겹치는 일정이 '+overlapCount+'건 있어요. 시간을 조정하면 좋을 것 같아요.') : null;
    return { totalCount: rows.length, remainingCount: remaining.length, overlapCount:overlapCount, totalMinutes:totalMinutes, remainingMinutes:remainingMinutes, headline:headline, note:note };
  }

  // 기상~취침 시간(요일별 설정)에서 오늘 이미 잡힌 일정 시간을 뺀 여유 시간이에요. 컨디션
  // 체크에서 "오늘 쓸 수 있는 시간"을 사용자에게 직접 고르게 하는 대신 계산해서 보여줘요.
  function computeAvailableMinutesToday(dateKey){
    var wd = weekdayOfKey(dateKey);
    var wakeHm = parseHM(state.settings.routine.wakeTimes[wd]);
    var sleepHm = parseHM(state.settings.routine.sleepTimes[wd]);
    var wakeMin = wakeHm.hour*60+wakeHm.minute;
    var sleepMin = sleepHm.hour*60+sleepHm.minute;
    if(sleepMin <= wakeMin) sleepMin += 24*60; // 자정을 넘겨 잠드는 경우(예: 새벽 1시 취침)
    var awakeMinutes = sleepMin - wakeMin;
    var scheduledMinutes = buildTimetableForDate(dateKey).reduce(function(s,r){ return s+r.duration; }, 0);
    return awakeMinutes - scheduledMinutes;
  }

  // "겹친 일정 조정하기" 버튼이 실제로 뭘 해야 할지 몰라서 눌러도 아무 효과가 없어 보였던 문제를
  // 고치기 위한 함수예요. 겹치는 두 일정을 찾아요 — 각 쌍마다 화면에서 "삭제/오늘만 빼기",
  // "빈 시간으로 옮기기"(findEmptySlot으로 실제 빈 시간을 찾아요), "직접 수정하기" 중 고르게 해요.
  // v48: 예전엔 뒤 일정을 자동으로 밀어내기만 했는데("삭제할지 빈 시간으로 옮길지 왜 안 물어봐"라는
  // 피드백으로), 이제는 매번 사용자가 직접 고르게 바꿨어요.
  function computeOverlapPairs(dateKey){
    var now = new Date();
    var nowMinutes = dateKey===todayKey() ? now.getHours()*60+now.getMinutes() : -1;
    // 이미 지난 일정끼리의 "겹침"은 지금 와서 해결할 방법이 없으니 대상에서 빼요.
    var rows = buildTimetableForDate(dateKey).filter(function(r){
      if(nowMinutes===-1) return true;
      var live = deriveLiveStatus(r, nowMinutes);
      return FINISHED.indexOf(live)===-1 && live!=='awaiting_result';
    });
    var sorted = rows.slice().sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    var pairs = [];
    for(var i=0;i<sorted.length-1;i++){
      var a=sorted[i], b=sorted[i+1];
      var aHm=parseHM(a.time), bHm=parseHM(b.time);
      var aEnd = aHm.hour*60+aHm.minute+a.duration, bStart = bHm.hour*60+bHm.minute;
      if(bStart < aEnd){
        pairs.push({ a:a, b:b, emptySlot: findEmptySlot(dateKey, b.duration, b.entryId, nowMinutes) });
      }
    }
    return pairs;
  }

  // b를 넣을 수 있는, 다른 일정과 안 겹치는 빈 시간을 오늘 안에서 찾아요. 이미 지난 시간으로는
  // 옮길 수 없으니 지금 이후로만 찾고, 하루 끝(24:00)까지도 자리가 없으면 null을 돌려줘요
  // (그러면 화면에서 "빈 시간으로 옮기기" 버튼이 아예 안 뜨고, "직접 수정하기"만 남아요).
  function findEmptySlot(dateKey, durationNeeded, excludeEntryId, nowMinutes){
    var rows = buildTimetableForDate(dateKey).filter(function(r){ return r.entryId !== excludeEntryId; });
    var sorted = rows.slice().sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    var DAY_END = 24*60;
    var cursor = nowMinutes>=0 ? nowMinutes : 0;
    for(var i=0;i<sorted.length;i++){
      var hm = parseHM(sorted[i].time);
      var start = hm.hour*60+hm.minute, end = start+sorted[i].duration;
      if(end <= cursor) continue; // 이미 지난 일정은 자리 계산에서 무시해요
      if(start - cursor >= durationNeeded) return formatHM(Math.floor(cursor/60)%24, cursor%60);
      cursor = Math.max(cursor, end);
    }
    if(DAY_END - cursor >= durationNeeded) return formatHM(Math.floor(cursor/60)%24, cursor%60);
    return null;
  }

  // 힘든 날 대신 할 수 있는 짧은 버전(가볍게 하기)의 소요시간은 원래 시간의 절반이나
  // 최대 15분 중 더 짧은 쪽으로 잡아요(데모용 간단 규칙) — 최소 5분.
  function computeMiniDuration(originalDuration){
    return Math.max(5, Math.min(15, Math.round(originalDuration/2)));
  }
  // 오늘 남은(고정 아닌) 일정 중 손댈 수 있는 후보만 추려요 — 이미 끝났거나 결과 대기 중이거나
  // (지금 와서 가볍게 할 수 없으니 제외) 이미 "가볍게 하기"가 적용된 항목(다시 제안하면 안 됨)은 빼요.
  function computeAdjustableItems(dateKey, now){
    var nowMinutes = now.getHours()*60+now.getMinutes();
    return buildTimetableForDate(dateKey).filter(function(r){
      if(r.isFixed) return false;
      var live = deriveLiveStatus(r, nowMinutes);
      if(FINISHED.indexOf(live) !== -1 || live === 'in_progress' || live === 'awaiting_result') return false;
      if(r.isMiniVersion) return false;
      return true;
    });
  }
  // "다르게 조정하기"의 수동 선택 화면(및 AI 요청 컨텍스트)이 쓰는, 손댈 수 있는 전체 후보
  // 목록이에요 — 컨디션 체크와 무관하게 항상 전체를 보여주고, 항목별로 가볍게 줄이기(있는
  // 경우)와 건너뛰기 중 직접 고를 수 있어요.
  function computeManualAdjustOptions(dateKey, now){
    var rows = computeAdjustableItems(dateKey, now);
    var withMinVersion = rows.filter(function(r){ return !!r.minVersion; })
      .map(function(r){ return {refId:r.refId, kind:r.kind, label:r.label, time:r.time, minVersion:r.minVersion,
        duration:r.duration, miniDuration:computeMiniDuration(r.duration)}; });
    var withoutMinVersion = rows.filter(function(r){ return !r.minVersion; })
      .map(function(r){ return {refId:r.refId, kind:r.kind, label:r.label, time:r.time, minVersion:null, duration:r.duration}; });
    return { withMinVersion: withMinVersion, withoutMinVersion: withoutMinVersion };
  }
  // "제안대로 적용"의 기본 제안이에요. 컨디션 체크에서 "안 좋음"이라고 직접 답했을 때만
  // 나가요(추측하지 않아요) — 다만 비서 성향이 "적극적으로"면 체크인이 없어도 오늘 일정이
  // 깨어있는 시간보다 많을 때(여유 시간 0분 이하) 먼저 알려줘요. 둘 중 하나라도 해당하면,
  // 꼭 해야 하는 일(체크인에서 고른 것)만 남기고 나머지는 전부 오늘 하루 건너뛰자고 제안해요
  // — 가볍게 줄이는 절충안 대신 "필수 외엔 모두 없애는" 사용자 요청을 그대로 반영해요.
  // 이 제안이 과하다 싶으면 "다르게 조정하기"에서 항목별로 직접 고르거나(가볍게 줄이기 포함)
  // AI에게 자유롭게 요청할 수 있어요.
  // 오늘 체크인에서 "오늘 꼭 해야 함"으로 고른 항목(여러 개 가능)만 남기고, 나머지 손댈 수
  // 있는 일정은 전부 "오늘은 건너뛰기" 후보로 제안해요. 체크인 여부와 무관하게 항상 계산해요 —
  // 자동으로 먼저 보여줄지(hasAutoFatigueTrigger) 여부와, 실제 내용(이 함수)은 서로 다른
  // 문제라서 분리했어요: 사용자가 "일정 조정하기"를 직접 눌렀을 땐 체크인 조건과 무관하게
  // 항상 이 내용을 보여줘야 하거든요.
  function computeFatigueSuggestion(dateKey, now){
    var checkin = state.checkins[dateKey];
    var mustDoIds = (checkin && checkin.mustDoIds) || [];
    var toDrop = computeAdjustableItems(dateKey, now)
      .filter(function(r){ return mustDoIds.indexOf(r.entryId)===-1; })
      .map(function(r){ return {refId:r.refId, kind:r.kind, label:r.label, time:r.time, minVersion:null, duration:r.duration}; });
    return { withMinVersion: [], withoutMinVersion: toDrop };
  }
  // 오늘 탭에 "오늘 일정 다시 짜기"를 먼저 나서서(사용자가 누르기 전에) 보여줄 근거가 있는지만
  // 판단해요 — 컨디션 체크에서 "안 좋음"이라고 직접 답했거나("추측 안 함"), 비서 성향이
  // "적극적으로"이고 객관적으로 일정이 깨어있는 시간보다 많을 때만 그래요.
  function hasAutoFatigueTrigger(dateKey){
    var checkin = state.checkins[dateKey];
    var conditionBad = !!(checkin && checkin.condition==='low');
    var objectivelyOverloaded = state.settings.interventionLevel==='active' && computeAvailableMinutesToday(dateKey) <= 0;
    return conditionBad || objectivelyOverloaded;
  }

  // ───────────────────────── 액션 (store 로직 포팅) ─────────────────────────
  function uid(p){ return p+'_'+Date.now()+'_'+Math.floor(Math.random()*10000); }

  function pushUndo(label, undoFn){
    var id = uid('undo');
    state.changeLog.unshift({ id:id, label:label, at:new Date().toISOString(), undone:false, undo:undoFn });
    showToast(id, label);
  }
  function runUndo(id){
    var entry = null;
    for(var i=0;i<state.changeLog.length;i++) if(state.changeLog[i].id===id) entry = state.changeLog[i];
    if(!entry || entry.undone) return;
    entry.undo(); entry.undone = true;
    ui.toast = null;
    render();
  }
  window.appRunUndo = runUndo;

  function showToast(id, label){
    ui.toast = {id:id, label:label};
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ ui.toast = null; render(); }, 5000);
  }
  // 되돌릴 변경이 없는 단순 안내용 토스트(예: "아직 준비 중이에요") — 되돌리기 버튼 없이 짧게 보여줘요.
  function showInfoToast(label){
    ui.toast = {id:null, label:label, info:true};
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ ui.toast = null; render(); }, 3000);
  }

  // ───────────────────────── 네이티브 알림 배선 (Capacitor 준비) ─────────────────────────
  // 지금은 브라우저 프로토타입이라 이 함수들은 전부 조용히 아무 일도 안 해요(nativeNotifPlugin()이
  // 항상 null). 나중에 이 코드를 Capacitor로 감싸고 @capacitor/local-notifications를 설치하면,
  // 코드를 더 고칠 필요 없이 이 배선 그대로 실제 OS 알림(앱이 꺼져 있어도 옴)으로 작동해요.
  // 설정·설치 체크리스트는 NOTIFICATIONS.md 참고.
  function isNativeApp(){
    try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
    catch(e){ return false; }
  }
  function nativeNotifPlugin(){
    try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null; }
    catch(e){ return null; }
  }
  // Local Notifications는 정수 id가 필요해서, entryId 문자열을 32비트 정수로 해시해요.
  function reminderNotifId(entryId){
    var s = String(entryId||''), h = 0;
    for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
    return Math.abs(h) || 1;
  }
  // 오늘 시간표의 한 항목을 실제 OS 알림으로 예약해요(이미 있던 예약은 먼저 취소하고 다시
  // 잡아서, 시간을 바꾸거나 알림을 껐을 때도 항상 최신 상태로 유지돼요).
  function syncNativeReminder(row, dateKey){
    var plugin = nativeNotifPlugin();
    if(!plugin) return;
    var id = reminderNotifId(row.entryId);
    plugin.cancel({ notifications:[{id:id}] }).catch(function(){});
    if(!row.reminderMinutes || FINISHED.indexOf(row.status)!==-1) return;
    var hm = parseHM(row.time);
    var fireDate = new Date(dateKey+'T00:00:00');
    fireDate.setMinutes(hm.hour*60 + hm.minute - row.reminderMinutes);
    if(fireDate.getTime() <= Date.now()) return; // 이미 지난 시각이면 예약하지 않아요
    plugin.schedule({ notifications:[{
      id: id,
      title: '⏰ 일정 알림',
      body: row.reminderMinutes+'분 후 "'+row.label+'"이(가) 시작해요.',
      schedule: { at: fireDate },
      channelId: 'godsaeng-reminders'
    }]}).catch(function(){});
  }
  function cancelNativeReminder(entryId){
    var plugin = nativeNotifPlugin();
    if(!plugin) return;
    plugin.cancel({ notifications:[{id: reminderNotifId(entryId)}] }).catch(function(){});
  }
  // 오늘 시간표 전체를 다시 훑어서 알림을 재동기화해요 — 일정을 추가/수정/삭제하거나 반복
  // 일정을 쉬기 켤 때마다 호출해요. TODO(실제 앱): 반복 일정은 오늘 것만이 아니라 앞으로 며칠치를
  // 미리 예약해둬야 앱을 매일 열지 않아도 알림이 와요 — 이 프로토타입은 "오늘"만 계산할 수 있으니,
  // 앱을 열 때마다(그리고 매일 자정 등 주기적으로) 다음 N일치를 다시 예약하는 로직을 추가해야 해요.
  function syncAllNativeRemindersForToday(){
    if(!isNativeApp()) return;
    var dateKey = todayKey();
    buildTimetableForDate(dateKey).forEach(function(row){ syncNativeReminder(row, dateKey); });
  }

  // ── 캘린더 양방향 동기화 배선 (실제 연동 준비) ──
  // Google Calendar 실연동은 OAuth·백엔드 토큰 교환이 필요해서 이 프로토타입 범위 밖이에요
  // (server/ 폴더의 Node 서버를 확장해서 처리하는 걸 권장해요 — CALENDAR_SYNC.md 참고).
  // 아래 두 함수는 실제 플러그인이 붙기 전까지 조용히 아무 일도 안 하지만, 일정이
  // 추가·수정·삭제되는 모든 지점에 이미 연결해뒀어요.
  function calendarSyncPlugin(){
    try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CalendarSync) || null; }
    catch(e){ return null; }
  }
  function pushEventToCalendar(kind, action, payload){
    if(!state.settings.calendarSync.enabled) return;
    var plugin = calendarSyncPlugin();
    if(!plugin) return;
    plugin.pushEvent({ kind:kind, action:action, event:payload }).catch(function(){});
  }

  function addRecurringEvent(input){
    var id = uid('ev');
    var created = Object.assign({id:id}, input);
    state.events.push(created);
    pushUndo('"'+input.label+'" 반복 일정 추가', function(){ state.events = state.events.filter(function(e){return e.id!==id;}); });
    syncAllNativeRemindersForToday();
    pushEventToCalendar('recurring', 'create', created);
  }
  function updateRecurringEvent(id, patch){
    var idx = state.events.findIndex(function(e){return e.id===id;}); if(idx===-1) return;
    var prev = state.events[idx];
    state.events[idx] = Object.assign({}, prev, patch);
    pushUndo('"'+prev.label+'" 반복 일정 수정', function(){ state.events[idx] = prev; });
    syncAllNativeRemindersForToday();
    pushEventToCalendar('recurring', 'update', state.events[idx]);
  }
  function deleteRecurringEvent(id){
    var idx = state.events.findIndex(function(e){return e.id===id;}); if(idx===-1) return;
    var removed = state.events[idx]; state.events.splice(idx,1);
    pushUndo('"'+removed.label+'" 반복 일정 삭제', function(){ state.events.push(removed); });
    cancelNativeReminder(id+'-'+todayKey());
    pushEventToCalendar('recurring', 'delete', removed);
  }
  function addAdhocEntry(input){
    var id = uid('ad');
    var created = Object.assign({id:id}, input);
    state.adhocEntries.push(created);
    pushUndo('"'+input.label+'" 일정 추가', function(){ state.adhocEntries = state.adhocEntries.filter(function(e){return e.id!==id;}); });
    syncAllNativeRemindersForToday();
    pushEventToCalendar('adhoc', 'create', created);
  }
  function updateAdhocEntry(id, patch){
    var idx = state.adhocEntries.findIndex(function(e){return e.id===id;}); if(idx===-1) return;
    var prev = state.adhocEntries[idx];
    state.adhocEntries[idx] = Object.assign({}, prev, patch);
    pushUndo('"'+prev.label+'" 일정 수정', function(){ state.adhocEntries[idx] = prev; });
    syncAllNativeRemindersForToday();
    pushEventToCalendar('adhoc', 'update', state.adhocEntries[idx]);
  }
  function deleteAdhocEntry(id){
    var idx = state.adhocEntries.findIndex(function(e){return e.id===id;}); if(idx===-1) return;
    var removed = state.adhocEntries[idx]; state.adhocEntries.splice(idx,1);
    pushUndo('"'+removed.label+'" 일정 삭제', function(){ state.adhocEntries.push(removed); });
    cancelNativeReminder(id+'-'+removed.dateKey);
    pushEventToCalendar('adhoc', 'delete', removed);
  }
  // 반복 일정을 계속 켜고 끌 수 있는 "잠시 쉬기" — 켜져 있는 동안은 오늘/내일 시간표, 브리핑,
  // 피곤 제안 어디에도 안 나타나고, 끄면 다시 원래대로 나타나요(특정 주만 쉬는 게 아니라 계속 유지돼요).
  function toggleEventPaused(eventId){
    var ev = state.events.find(function(e){ return e.id===eventId; });
    if(!ev) return;
    ev.paused = !ev.paused;
    if(ev.paused) cancelNativeReminder(eventId+'-'+todayKey()); else syncAllNativeRemindersForToday();
    render();
  }
  function setEventOccurrenceOverride(eventId, dateKey, override){
    var key = eventId+'|'+dateKey;
    var previous = state.eventOccurrenceOverrides[key];
    state.eventOccurrenceOverrides[key] = Object.assign({}, state.eventOccurrenceOverrides[key], override);
    pushUndo('오늘 일정 조정', function(){
      if(previous) state.eventOccurrenceOverrides[key] = previous; else delete state.eventOccurrenceOverrides[key];
    });
    syncAllNativeRemindersForToday();
  }
  function setEntryStatus(kind, refId, dateKey, status, opts){
    var id = refId+'-'+dateKey;
    var idx = state.scheduleEntries.findIndex(function(e){return e.id===id;});
    var entry = { id:id, refId:refId, kind:kind, dateKey:dateKey, status:status,
      reason:(opts && opts.reason) || null, updatedAt:new Date().toISOString() };
    if(idx===-1) state.scheduleEntries.push(entry); else state.scheduleEntries[idx] = entry;
    // 끝난 일정(완료·조금 함·못함·건너뜀·미리 건너뜀)은 더 이상 "곧 시작해요" 알림이 필요 없으니 취소해요.
    cancelNativeReminder(id);
  }
  function snoozeEntry(label, minutes){
    var demoSeconds = minutes === 10 ? 6 : 10; // 데모라서 실제 분 대신 압축된 시간으로 시연해요
    clearTimeout(notifTimer);
    notifTimer = setTimeout(function(){
      ui.notif = { title:'⏰ 다시 알림', body:'미뤄뒀던 "'+label+'" 시간이에요.', entryId:null, dateKey:null };
      render();
    }, demoSeconds*1000);
  }

  // ───────────────────────── 렌더 ─────────────────────────
  var root = document.getElementById('phone');
  function render(){ root.innerHTML = renderPhone(); if(ui.share) drawShareCard(); }

  function iconToday(){ return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M4 12h9M4 18h5"/><path d="M15.5 6.5l1.8 1.8L21 4.5"/></svg>'; }
  function iconSchedule(){ return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'; }
  function iconHistory(){ return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3 4.5v5h5"/><path d="M12 8v4.5l3 2"/></svg>'; }
  function iconSettings(){ return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l1.9-1.4-1.5-2.6-2.2.9a7 7 0 0 0-2-1.2L14.7 4h-3l-.4 2.5a7 7 0 0 0-2 1.2l-2.2-.9-1.5 2.6L7.5 10.8A7 7 0 0 0 7.4 12a7 7 0 0 0 .1 1.2l-1.9 1.4 1.5 2.6 2.2-.9c.6.5 1.3.9 2 1.2l.4 2.5h3l.4-2.5a7 7 0 0 0 2-1.2l2.2.9 1.5-2.6-1.9-1.4c.07-.4.1-.8.1-1.2Z"/></svg>'; }
  // 설정 세부 화면의 "뒤로" — 예전엔 달력 월 이동용 원형 버튼(.cal-nav-btn)에 "‹" 글자를 그대로
  // 재활용해서 붙어 보이고 안 예뻤어요. 화살표를 SVG로 또렷하게 그리고, 원형 배경 없이 탭
  // 영역만 넉넉하게 줘서 제목과 자연스럽게 붙게 했어요.
  function iconChevronLeft(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'; }

  function statusLabel(s){
    return {upcoming:'예정', in_progress:'진행 중', awaiting_result:'결과 대기', done_full:'완료',
      done_partial:'조금 함', done_none:'못함', delayed:'지연', skipped:'건너뜀',
      excused:'미리 건너뜀'}[s] || s;
  }
  function statusTone(s){
    if(s==='done_full') return 'success';
    if(s==='done_partial' || s==='awaiting_result' || s==='in_progress') return 'warn';
    if(s==='done_none') return 'danger';
    if(s==='excused') return 'default';
    return 'default';
  }
  // "조금 함"을 고를 때 얼마나 했는지 한 번 더 물어서 다음 계획에 참고해요(선택 사항 —
  // 건너뛰어도 그냥 "조금 함"으로 기록돼요).
  var PARTIAL_DEGREE_LABEL = { half:'절반 정도 했어요', started:'시작만 했어요', mini_done:'가볍게 버전은 했어요' };
  var REASON_LABEL = { no_time:'시간이 없었어요', too_tired:'너무 피곤했어요', forgot:'깜빡했어요',
    no_longer_needed:'더 이상 필요 없어요', custom:'직접 입력' };
  // 오늘 컨디션 체크인 옵션 — 하루 1~2번, 대부분 선택만 하면 되는 가벼운 항목들이에요.
  // "부담" 항목이 컨디션과 사실상 같은 걸 묻는다는 피드백으로 컨디션 하나로 합쳤고, 컨디션도
  // "보통"을 빼고 안 좋음/좋음 둘 중 하나만 고르게 해서 판단이 분명해지게 했어요.
  var CONDITION_OPTIONS = [['low','컨디션 안 좋음'],['high','컨디션 좋음']];

  function renderPhone(){
    if(!ui.onboardingDone) return renderOnboarding();
    var html = '';
    if(ui.bannerOpen){
      html += '<div class="banner"><span>🔍 이 화면은 v32 코드에 반영된 동작을 미리 보기 위한 프로토타입이에요. ' +
        '실제 알림·음성은 흉내만 냈고, 데이터는 예시예요.</span><button onclick="appAction(\'closeBanner\')">닫기</button></div>';
    }
    html += '<div class="topbar"><div><div class="date">'+formatTopDate()+'</div><div class="brand">갓생살자</div></div>';
    if(ui.tab==='today') html += '<button class="quickadd-btn" onclick="appAction(\'openQuickAdd\')">+ 빠른 추가</button>';
    html += '</div>';
    if(ui.tab==='today') html += '<div class="daytoggle">'+chip('오늘', ui.dayOffset===0, "appAction('setDay',0)")+chip('내일', ui.dayOffset===1, "appAction('setDay',1)")+'</div>';

    if(ui.notif){
      html += '<div class="notif" onclick="appAction(\'openNotif\')"><div class="ic">'+ui.notif.title.split(' ')[0]+'</div>' +
        '<div style="flex:1;"><div class="tt">알림</div><div class="bb">'+esc(ui.notif.body)+'</div></div>';
      // 일정 알림은 이어폰이 연결돼 있을 때만 자동으로 읽어줘요. 그 외엔 방금 띠링 소리만 났을
      // 테니, 내용을 직접 듣고 싶으면 이 버튼으로 켤 수 있게 해요(항상 눈으로 볼 수도 있고요).
      if(ui.notif.kind==='reminder'){
        html += '<button class="share-eye-btn" style="flex-shrink:0;" onclick="event.stopPropagation(); appAction(\'speakNotif\')">🔊 듣기</button>';
      }
      html += '</div>';
    }

    html += '<div class="content">';
    if(ui.tab==='today') html += renderToday();
    else if(ui.tab==='schedule') html += renderSchedule();
    else if(ui.tab==='history') html += renderHistory();
    else html += renderSettings();
    html += '</div>';

    html += '<div class="tabbar">';
    html += tabBtn('today', iconToday(), '오늘');
    html += tabBtn('schedule', iconSchedule(), '일정관리');
    html += tabBtn('history', iconHistory(), '히스토리');
    html += tabBtn('settings', iconSettings(), '설정');
    html += '</div>';

    if(ui.toast) html += '<div class="toast-wrap"><div class="toast"><span>'+esc(ui.toast.label)+'</span>' +
      (ui.toast.info ? '' : '<button onclick="appRunUndo(\''+ui.toast.id+'\')">되돌리기</button>') + '</div></div>';

    if(!ui.chatOpen) html += '<button class="chat-fab" onclick="appAction(\'openChat\')" title="일정 챗봇">💬</button>';

    if(ui.sheet) html += renderEntrySheetModal();
    if(ui.overlap) html += renderOverlapModal();
    if(ui.energy) html += renderEnergyModal();
    if(ui.checkin) html += renderCheckinModal();
    if(ui.interventionExampleOpen) html += renderInterventionExampleModal();
    if(ui.routineModalOpen) html += renderRoutineModal();
    if(ui.quickAdd) html += renderQuickAddModal();
    if(ui.form) html += renderFormModal();
    if(ui.confirm) html += renderConfirmModal();
    if(ui.chatOpen) html += renderChatModal();
    if(ui.share) html += renderShareModal();

    return html;
  }

  // 브라우저 기본 confirm()은 버튼 문구를 "확인/취소"로 고정해서, "취소"를 누르면 방금

  var CHAT_SUGGESTED_PROMPTS = ['오늘 남은 일정 알려줘', '지금 다음 일정 뭐야?', '오늘 계획 좀 줄여줘', '일정 하나 추가할래'];

  function renderChatProposal(p, msgId){
    var hm = parseHM(p.time);

      '<div class="meta">'+esc(when)+' · '+meridiemTimeLabel(hm.hour,hm.minute)+' · '+formatDurationHM(p.duration)+'</div>';
    if(p.ambiguousAmPm) html += '<div class="meta" style="margin-top:-6px;">오전/오후 표현이 없어서 우선 이렇게 추측했어요. 이대로 추가할까요?</div>';
    html += btn('이렇게 추가하기', 'primary', "appAction('chatConfirm','"+msgId+"')");
    if(p.ambiguousAmPm){
      var altH = hm.hour>=12 ? (hm.hour===12?12:hm.hour-12) : hm.hour;
      var altLabel = (hm.hour>=12?'오전 ':'오후 ')+altH+'시로 변경';
      html += btn(altLabel, 'secondary', "appAction('chatToggleAmPm','"+msgId+"')");

  // 아주 단순한 한국어 휴리스틱 파서예요 — 실제 앱의 chat.tsx도 완벽한 자연어 이해가 아니라
  // "날짜/요일 + 시간 + 소요시간 + 나머지는 이름"으로 나누는 규칙 기반이라, 여기서도 같은 방식으로
  // 데모를 만들었어요. "화목" 같은 요일 줄임말 등은 이번 데모 범위에서는 인식하지 않아요.
  var WD_NAME_TO_IDX = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
  function parseScheduleFromText(text){
    var t = text;
    var recurring = false, days = [];
    var wdRe = /([일월화수목금토])요일/g, wm;
    while((wm = wdRe.exec(t))){ if(days.indexOf(WD_NAME_TO_IDX[wm[1]])===-1) days.push(WD_NAME_TO_IDX[wm[1]]); }
    if(days.length){ recurring = true; }
    if(/매주/.test(t)) recurring = true;
    t = t.replace(/([일월화수목금토])요일/g, '').replace(/매주/g, '');

    var dateKey = todayKey();
    if(!recurring){
      if(/모레/.test(t)){ dateKey = addDaysKey(todayKey(),2); t = t.replace(/모레/g,''); }
      else if(/내일/.test(t)){ dateKey = addDaysKey(todayKey(),1); t = t.replace(/내일/g,''); }
      else t = t.replace(/오늘/g,'');
    }

    var apMatch = t.match(/(오전|오후)/);
    var ambiguousAmPm = false;
    if(!apMatch){
      if(/저녁|밤/.test(t)) apMatch = ['', '오후'];
      else if(/아침|새벽/.test(t)) apMatch = ['', '오전'];
      else ambiguousAmPm = true; // 오전/오후 표현이 아예 없으면 나중에 사용자에게 확인받아요
    }
    var hour = null, minute = 0;
    var timeMatch = t.match(/(\d{1,2})\s*시(?!간)(?:\s*(\d{1,2})\s*분)?/);
    if(timeMatch){
      hour = parseInt(timeMatch[1],10);
      minute = timeMatch[2] ? parseInt(timeMatch[2],10) : 0;
      t = t.replace(timeMatch[0],'');
    } else {
      var colonMatch = t.match(/(\d{1,2}):(\d{2})/);
      if(colonMatch){ hour = parseInt(colonMatch[1],10); minute = parseInt(colonMatch[2],10); t = t.replace(colonMatch[0],''); }
    }
    if(hour===null) return null;
    var isAmbiguous = ambiguousAmPm && hour>=1 && hour<=11;
    if(apMatch){
      if(apMatch[1]==='오후' && hour<12) hour += 12;
      if(apMatch[1]==='오전' && hour===12) hour = 0;
      t = t.replace(/(오전|오후)/,'');
    } else if(isAmbiguous){
      // 생활 패턴상 애매한 시간은 오후로 먼저 추측하고, 사용자가 확인하거나 오전으로 바꿀 수 있게 해요.
      hour += 12;
    }
    t = t.replace(/저녁|밤|아침|새벽/g,'');

    var duration = 30;
    var durMatch = t.match(/(\d+)\s*시간\s*(\d+)?\s*분?/);
    if(durMatch){
      duration = parseInt(durMatch[1],10)*60 + (durMatch[2]?parseInt(durMatch[2],10):0);
      t = t.replace(durMatch[0],'');
    } else {
      var durMatch2 = t.match(/(\d+)\s*분/);
      if(durMatch2){ duration = parseInt(durMatch2[1],10); t = t.replace(durMatch2[0],''); }
    }

    var label = t.replace(/[,·]/g,' ')
      .replace(/에는|동안|정도|쯤|약속|일정|잡아줘|잡아주세요|추가해줘|추가해주세요|넣어줘|넣어주세요|해줘|해주세요|만들어줘|만들어주세요/g,' ')
      .replace(/(^|\s)에(?=\s|$)/g,' ')
      .replace(/\s+/g,' ').trim();
    if(!label) label = recurring ? '새 반복 일정' : '새 일정';

    return { label:label, recurring:recurring, days: recurring ? (days.length?days.sort(function(a,b){return a-b;}):[weekdayOfKey(todayKey())]) : [],
      dateKey:dateKey, time:formatHM(hour,minute), duration:duration, ambiguousAmPm:isAmbiguous };
  }

  // ── 챗봇 의도 분류 — 추가 말고도 조회/수정/오늘조정/완료기록까지 이해해요 ──
  function tokensOf(label){ return String(label||'').split(/\s+/).filter(function(w){ return w.length>=2; }); }
  function findEntryByKeyword(dateKey, text){
    if(!text) return null;
    var rows = buildTimetableForDate(dateKey);
    var scored = rows.map(function(r){
      var toks = tokensOf(r.label);
      var hits = toks.filter(function(tk){ return text.indexOf(tk)!==-1; }).length;
      if(text.indexOf(r.label)!==-1) hits += 5;
      return {row:r, hits:hits};
    }).filter(function(x){ return x.hits>0; });
    scored.sort(function(a,b){ return b.hits-a.hits; });
    return scored.length ? scored[0].row : null;
  }
  function findRecurringByKeyword(text){
    if(!text) return null;
    var scored = state.events.map(function(ev){
      var toks = tokensOf(ev.label);
      var hits = toks.filter(function(tk){ return text.indexOf(tk)!==-1; }).length;
      return {ev:ev, hits:hits};
    }).filter(function(x){ return x.hits>0; });
    scored.sort(function(a,b){ return b.hits-a.hits; });
    return scored.length ? scored[0].ev : null;
  }
  function rowsWithLive(dateKey){
    var now = new Date();
    var nowMinutes = dateKey===todayKey() ? now.getHours()*60+now.getMinutes() : -1;
    return buildTimetableForDate(dateKey).map(function(r){ return Object.assign({}, r, {live: deriveLiveStatus(r, nowMinutes)}); });
  }
  function summarizeRemaining(dateKey, dayLabel){
    var rows = rowsWithLive(dateKey);
    var remaining = dateKey===todayKey() ? rows.filter(function(r){ return FINISHED.indexOf(r.live)===-1; }) : rows;
    if(rows.length===0) return dayLabel+' 등록된 일정이 없어요.';
    if(remaining.length===0) return dayLabel+' 남은 일정이 없어요. 수고 많으셨어요.';
    var lines = remaining.map(function(r){
      var hm = parseHM(r.time);
      return '· '+r.label+' · '+meridiemTimeLabel(hm.hour,hm.minute)+' · '+formatDurationHM(r.duration);
    });
    return dayLabel+' 남은 일정은 '+remaining.length+'개예요.\n'+lines.join('\n');
  }
  function handleChatText(text){
    var t = text.trim();
    var dateKey = curDateKey();

    // 1) 오늘/내일 조회
    if(/오늘.*남은\s*일정|남은\s*일정.*오늘/.test(t)){
      return { text: summarizeRemaining(todayKey(), '오늘') };
    }
    if(/다음\s*일정/.test(t)){
      var rows1 = rowsWithLive(todayKey());
      var upcoming = rows1.filter(function(r){ return r.live==='upcoming' || r.live==='in_progress'; });
      if(!upcoming.length) return { text:'오늘은 더 이상 예정된 일정이 없어요.' };
      var hmN = parseHM(upcoming[0].time);
      return { text:'다음 일정은 "'+upcoming[0].label+'" · '+meridiemTimeLabel(hmN.hour,hmN.minute)+' · '+formatDurationHM(upcoming[0].duration)+'이에요.' };
    }
    if(/내일.*일정/.test(t)){
      return { text: summarizeRemaining(addDaysKey(todayKey(),1), '내일') };
    }
    if(/바쁜|바빠/.test(t)){
      var b = computeBriefing(todayKey(), new Date());
      return { text: b.headline + (b.note ? ('\n'+b.note) : '') };
    }

    // 2) 반복 일정 잠시 쉬기 on/off ("약 챙겨 먹기 잠시 쉴래" / "영어 스터디 다시 시작할래")
    var pauseMatch = /잠시\s*쉴래|잠시\s*쉬(?:어|게)(?:\s*줘|해줘)?|쉬기\s*켜(?:줘)?/;
    var resumeMatch = /다시\s*시작(?:할래|해줘)?|쉬기\s*(?:그만|풀어|꺼)(?:줘)?/;
    if(pauseMatch.test(t)){
      var subjP = t.replace(pauseMatch,'').trim();
      var evP = findRecurringByKeyword(subjP);
      if(evP){
        evP.paused = true;
        return { text: '"'+evP.label+'"을(를) 잠시 쉬기로 해뒀어요. 다시 시작하고 싶으면 "다시 시작할래"라고 말해줘요.' };
      }
      return { text: '어떤 반복 일정을 쉴지 못 찾았어요. 일정 이름을 조금 더 정확히 말해줄래요?' };
    }
    if(resumeMatch.test(t)){
      var subjR = t.replace(resumeMatch,'').trim();
      var evR = findRecurringByKeyword(subjR);
      if(evR){
        evR.paused = false;
        return { text: '"'+evR.label+'"을(를) 다시 일정에 넣었어요.' };
      }
      return { text: '어떤 반복 일정을 다시 시작할지 못 찾았어요.' };
    }

    // 3) 오늘만 건너뛰기 ("운동 오늘은 빼줘")
    if(/(오늘은|오늘만|오늘)\s*(빼줘|빼줄래|건너뛰|건너뛸래|스킵)/.test(t) || /빼줘|건너뛰어줘/.test(t)){
      var subj0 = t.replace(/(오늘은|오늘만|오늘)/g,'').replace(/빼줘|빼줄래|건너뛰어줘|건너뛰|건너뛸래|스킵해줘|스킵/g,'').trim();
      var row0 = findEntryByKeyword(todayKey(), subj0);
      if(row0 && FINISHED.indexOf(row0.status)===-1){
        setEntryStatus(row0.kind, row0.refId, todayKey(), 'excused', {reason:'user_request'});
        return { text: '"'+row0.label+'" 오늘 일정은 건너뛸게요. 반복 일정 자체는 그대로 유지돼요.' };
      }
      return { text: '어떤 일정을 뺄지 못 찾았어요. 일정 이름을 조금 더 정확히 말해줄래요?' };
    }

    // 4) 시간 옮기기 ("병원 30분 미뤄줘")
    var moveMatch = t.match(/(\d+)\s*분\s*(미뤄|늦춰|당겨)/);
    if(moveMatch){
      var mins = parseInt(moveMatch[1],10);
      var dir = moveMatch[2]==='당겨' ? -1 : 1;
      var subj1 = t.replace(moveMatch[0],'').replace(/줘|줄래|주세요|해줘|해주세요/g,'').trim();
      var row1 = findEntryByKeyword(dateKey, subj1) || findEntryByKeyword(dateKey, t);
      if(row1){
        var hm1 = parseHM(row1.time);
        var total1 = (((hm1.hour*60+hm1.minute) + dir*mins) % 1440 + 1440) % 1440;
        var newTime1 = formatHM(Math.floor(total1/60), total1%60);
        if(row1.kind==='session') setEventOccurrenceOverride(row1.refId, dateKey, {time:newTime1});
        else updateAdhocEntry(row1.refId, {time:newTime1});
        var nhm1 = parseHM(newTime1);
        return { text: '"'+row1.label+'" 일정을 '+withRo(meridiemTimeLabel(nhm1.hour,nhm1.minute))+' 옮겼어요. 오늘만 적용돼요.' };
      }
      return { text: '어떤 일정을 옮길지 못 찾았어요. 일정 이름을 조금 더 정확히 말해줄래요?' };
    }

    // 5) 소요시간 바꾸기 ("발표 준비 1시간으로 늘려줘")
    var durChangeMatch = t.match(/(\d+)\s*(시간|분)\s*(?:으로)?\s*(늘려|줄여|바꿔|변경해)/);
    if(durChangeMatch){
      var durNum = parseInt(durChangeMatch[1],10);
      var newDur = durChangeMatch[2]==='시간' ? durNum*60 : durNum;
      var subjD = t.replace(durChangeMatch[0],'').replace(/줘|줄래|주세요/g,'').trim();
      var rowD = findEntryByKeyword(dateKey, subjD) || findEntryByKeyword(dateKey, t);
      if(rowD){
        if(rowD.kind==='session') setEventOccurrenceOverride(rowD.refId, dateKey, {duration:newDur});
        else updateAdhocEntry(rowD.refId, {duration:newDur});
        return { text: '"'+rowD.label+'" 소요시간을 '+formatDurationHM(newDur)+'으로 바꿨어요. 오늘만 적용돼요.' };
      }
      return { text: '어떤 일정의 소요시간을 바꿀지 못 찾았어요.' };
    }

    // 6) 일정 삭제 ("영어 스터디 삭제해줘")
    if(/삭제해줘|삭제할래|지워줘|없애줘/.test(t)){
      var subjX = t.replace(/삭제해줘|삭제할래|지워줘|없애줘/g,'').trim();
      var adhocHit = state.adhocEntries.slice()
        .map(function(en){ return {en:en, hits:tokensOf(en.label).filter(function(tk){return subjX.indexOf(tk)!==-1;}).length}; })
        .filter(function(x){ return x.hits>0; })
        .sort(function(a,b){ return b.hits-a.hits; })[0];
      if(adhocHit){
        deleteAdhocEntry(adhocHit.en.id);
        return { text: '"'+adhocHit.en.label+'" 일정을 삭제했어요. 실수였다면 화면 아래 되돌리기로 복구할 수 있어요.' };
      }
      var recurHit = findRecurringByKeyword(subjX);
      if(recurHit){
        deleteRecurringEvent(recurHit.id);
        return { text: '"'+recurHit.label+'" 반복 일정을 삭제했어요. 잠깐 쉬는 것뿐이라면 "잠시 쉴래"라고 말해도 돼요. 실수였다면 되돌리기로 복구할 수 있어요.' };
      }
      return { text: '어떤 일정을 삭제할지 못 찾았어요. 일정 이름을 조금 더 정확히 말해줄래요?' };
    }

    // 7) 오늘 계획 조정 (피곤함/줄이고 싶음) — AI 서버 없이도 동작해야 해서, 컨디션 체크
    // 여부와 무관하게 항상 전체 후보를 보여주는 computeManualAdjustOptions를 써요.
    if(/피곤|힘들어|지쳤어|지침|계획.*줄여|일정.*줄여|줄이고\s*싶/.test(t)){
      var fs = computeManualAdjustOptions(todayKey(), new Date());
      if(fs.withMinVersion.length===0 && fs.withoutMinVersion.length===0){
        return { text: '지금은 딱히 줄이거나 건너뛸 만한 일정이 없어요. 편하게 쉬셔도 좋아요.' };
      }
      var n = fs.withMinVersion.length + fs.withoutMinVersion.length;
      return { text: '오늘 남은 일정 중 '+n+'개를 가볍게 하거나 건너뛸 수 있어요. 자세히 볼까요?', quickAction:{label:'제안 보러 가기', action:'chatOpenFatigue'} };
    }

    // 8) 완료 기록 ("발표 준비 끝냈어")
    if(/끝냈|끝났|다\s*했어|마쳤어/.test(t)){
      var subj2 = t.replace(/끝냈어|끝났어|다\s*했어|마쳤어|요/g,'').trim();
      var row2 = findEntryByKeyword(todayKey(), subj2);
      if(row2 && FINISHED.indexOf(row2.status)===-1){
        setEntryStatus(row2.kind, row2.refId, todayKey(), 'done_full');
        return { text: '"'+row2.label+'" 완료로 기록했어요! 잘하셨어요.' };
      }
      return { text: '그 일정을 오늘 목록에서 못 찾았어요. 일정관리 탭에서 확인해볼래요?' };
    }

    // 9) 방금 한 변경 되돌리기 ("방금 취소해줘" / "되돌려줘")
    if(/되돌려줘|방금.*(취소해줘|되돌려)/.test(t)){
      var lastChange = state.changeLog.find(function(c){ return !c.undone; });
      if(lastChange){
        runUndo(lastChange.id);
        return { text: '"'+lastChange.label+'"을(를) 되돌렸어요.' };
      }
      return { text: '되돌릴 만한 최근 변경이 없어요.' };
    }

    // 10) 그 밖의 "언제야?" 조회 (예: "약 먹는 시간 언제야?")
    if(/언제/.test(t)){
      var subj3 = t.replace(/언제(야|예요|인가요|이야)?\??/,'').replace(/시간|이|가|은|는/g,' ').replace(/\s+/g,' ').trim();
      var row3 = findEntryByKeyword(dateKey, subj3);
      var ev3 = row3 ? row3 : findRecurringByKeyword(subj3);
      if(ev3){
        var hm3 = parseHM(ev3.time);
        return { text: '"'+ev3.label+'"는 '+meridiemTimeLabel(hm3.hour,hm3.minute)+'예요.' };
      }
      return { text: '그 일정을 찾지 못했어요. 일정 이름을 조금 더 정확히 말해줄래요?' };
    }

    // 11) 일정 추가 (시간이 있는 경우)
    var parsed = parseScheduleFromText(t);
    if(parsed) return { proposal: parsed, text: parsed.ambiguousAmPm ? '이렇게 이해했어요. 맞으면 추가할게요.' : '이렇게 이해했어요. 맞으면 추가할게요.' };

    // 12) 그 외 일반 질문 — 데모 범위 밖이라 정중히 안내해요
    return { text: '아직 그 질문은 잘 이해하지 못했어요. "오늘 남은 일정 알려줘"나 "병원 3시"처럼 일정 조회·추가로 물어봐줄래요?' };
  }
  // AI 서버(예: server/index.js를 배포한 주소)가 설정돼 있으면 실제 LLM에게 물어보고,
  // 아니거나 실패하면 기존 규칙 기반 해석(handleChatText)으로 조용히 되돌아가요 — 오프라인/
  // 미설정 상태에서도 기본 기능은 계속 동작해야 해서예요.
  function sendChatText(text){
    text = text.trim();
    if(!text) return;
    ui.chat.messages.push({id:uid('m'), role:'user', text:text});
    ui.chat.draftText = '';
    var serverUrl = (state.settings.aiServer.url||'').trim();
    if(!serverUrl){
      var result = handleChatText(text);
      ui.chat.messages.push({id:uid('m'), role:'bot', text:result.text, proposal:result.proposal||null, quickAction:result.quickAction||null});
      return;
    }
    var thinkingId = uid('m');
    ui.chat.messages.push({id:thinkingId, role:'bot', text:'생각하고 있어요…', thinking:true});
    callAiServer(serverUrl, text).then(function(serverResult){
      var msg = ui.chat.messages.find(function(m){ return m.id===thinkingId; });
      if(!msg) return; // 응답 오는 사이 채팅이 닫히거나 초기화됐으면 조용히 무시해요
      msg.thinking = false;
      if(serverResult && serverResult.reply){
        msg.text = serverResult.reply;
        if(serverResult.requiresConfirmation && serverResult.action && serverResult.action!=='answer' && serverResult.action!=='unknown'){
          // adjust_burden은 서버가 "무엇을 줄일지"까지 정하지 않아요 — 사용자가 방금 말한
          // 이유(원문)를 그대로 담아뒀다가, "적용하기"를 누르면 그 이유로 다시 한 번
          // /api/adjust-burden에 물어서(오늘 일정 다시 짜기 화면 안에서) 실제 조정안을 받아요.
          if(serverResult.action==='adjust_burden') serverResult.reason = text;
          msg.serverAction = serverResult;
        }
      } else {
        // 서버가 없거나 응답 형식이 다르면(배포 안 됨, 네트워크 오류 등) 규칙 기반으로 대체해요.
        var fallback = handleChatText(text);
        msg.text = fallback.text;
        msg.proposal = fallback.proposal || null;
        msg.quickAction = fallback.quickAction || null;
      }
      render();
    });
  }
  // server/index.js의 /api/parse에 오늘 시간표·반복 일정 목록을 함께 보내서, 서버(Claude)가
  // "어떤 일정을 말하는지" 맞출 수 있게 해요. 네트워크 오류·CORS·타임아웃은 전부 null로
  // 수렴시켜서 호출부가 항상 로컬 대체 경로를 탈 수 있게 해요.
  function buildAiChatContext(){
    var dateKey = todayKey(), now = new Date();
    return {
      today: dateKey,
      now: formatHM(now.getHours(), now.getMinutes()),
      todayTimetable: buildTimetableForDate(dateKey).map(function(r){
        return { entryId:r.entryId, refId:r.refId, kind:r.kind, label:r.label, time:r.time, durationMinutes:r.duration, isFixed:r.isFixed };
      }),
      recurringEvents: state.events.filter(function(ev){ return !ev.paused; }).map(function(ev){
        return { eventId:ev.id, label:ev.label, time:ev.time, days:ev.days, durationMinutes:ev.duration, isFixed:ev.isFixed };
      })
    };
  }
  function callAiServer(url, message){
    var base = url.replace(/\/+$/,'');
    var headers = {'Content-Type':'application/json'};
    if(state.settings.aiServer.secret) headers['x-app-secret'] = state.settings.aiServer.secret;
    return fetch(base+'/api/parse', {
      method:'POST', headers:headers,
      body: JSON.stringify({ message:message, context: buildAiChatContext() })
    }).then(function(res){ return res.json(); }).catch(function(){ return null; });
  }
  // 서버가 돌려준 구조화된 명령을 실제 로컬 상태 변경으로 옮겨요 — 서버는 "무엇을 할지"만
  // 판단하고, 실제 반영은 항상 여기서, 사용자가 "적용하기"를 눌러야만 일어나요.
  function applyServerAction(a){
    var dk = a.dateKey || todayKey();
    switch(a.action){
      case 'add_recurring_event':
        addRecurringEvent({label:a.label||'새 반복 일정', time:a.time||'09:00',
          days:(a.days&&a.days.length)?a.days:[weekdayOfKey(todayKey())], duration:a.durationMinutes||30,
          isFixed:false, minVersion:null, memo:null});
        break;
      case 'add_adhoc_event':
        addAdhocEntry({label:a.label||'새 일정', dateKey:dk, time:a.time||'09:00', duration:a.durationMinutes||30,
          isFixed:false, minVersion:null, memo:null});
        break;
      case 'delete_event':
        if(a.eventId) deleteRecurringEvent(a.eventId);
        else if(a.entryId){ var r1 = findRow(a.entryId, dk); if(r1 && r1.kind==='adhoc') deleteAdhocEntry(r1.refId); }
        break;
      case 'reschedule_event':
        if(a.eventId){
          if(a.scope==='from_now_on') updateRecurringEvent(a.eventId, {time:a.newTime});
          else setEventOccurrenceOverride(a.eventId, dk, {time:a.newTime});
        } else if(a.entryId){
          var r2 = findRow(a.entryId, dk); if(r2) updateAdhocEntry(r2.refId, {time:a.newTime});
        }
        break;
      case 'change_duration':
        if(a.eventId) setEventOccurrenceOverride(a.eventId, dk, {duration:a.durationMinutes});
        else if(a.entryId){ var r3 = findRow(a.entryId, dk); if(r3) updateAdhocEntry(r3.refId, {duration:a.durationMinutes}); }
        break;
      case 'mark_entry_status':
        if(a.entryId){ var r4 = findRow(a.entryId, dk); if(r4) setEntryStatus(r4.kind, r4.refId, dk, a.status); }
        break;
      default: break; // skip_next_week 등 이 프로토타입에 없는 동작은 답변만 보여주고 실행은 안 해요
    }
  }
  function testAiServerConnection(){
    var url = (state.settings.aiServer.url||'').trim().replace(/\/+$/,'');
    if(!url){ ui.aiServerStatus = '서버 주소를 먼저 입력해주세요.'; render(); return; }
    ui.aiServerStatus = '연결 확인 중…'; render();
    fetch(url+'/health').then(function(res){ return res.json(); }).then(function(data){
      ui.aiServerStatus = (data && data.ok) ? ('✅ 연결됐어요 (모델: '+(data.model||'?')+')') : '연결에 실패했어요.';
      render();
    }).catch(function(){
      ui.aiServerStatus = '연결에 실패했어요. 주소와 서버 상태를 확인해주세요.';
      render();
    });
  }

  // ── 타임 롤링 피커 (업다운 스테퍼 대신 iOS 스타일로 스크롤해서 고르는 방식) ──
  // ── 시간·소요시간·알림 값 접근자 — 롤링 휠 대신 위/아래 화살표 스테퍼로 바꿨지만(요청에
  // 따라), 어떤 필드를 고치는 중인지(namespace)에 따라 값을 읽고 쓰는 이 구조는 그대로 재사용해요.
  function timeRefFor(ns){
    if(ns==='form') return { get:function(){ return ui.form.draft.time; }, set:function(v){ ui.form.draft.time = v; } };
    if(ns==='sheet') return { get:function(){ return ui.sheet.draftTime; }, set:function(v){ ui.sheet.draftTime = v; } };
    if(ns==='quickAdd') return { get:function(){ return ui.quickAdd.time; }, set:function(v){ ui.quickAdd.time = v; } };
    return null;
  }
  // 5분 단위로 시간을 조정해요(자정을 넘나들면 자연스럽게 다음/이전 날로 wrap돼요).
  function renderTimeStepper(time, ns, label){
    var hm = parseHM(time);
    return '<div class="stepper-row">'+stepperHtml(label||'시작 시간', meridiemTimeLabel(hm.hour,hm.minute),
      "appAction('timeStep','"+ns+"',-5)", "appAction('timeStep','"+ns+"',5)")+'</div>';
  }
  function durationRefFor(ns){
    if(ns==='form') return { get:function(){ return ui.form.draft.duration; }, set:function(v){ ui.form.draft.duration = v; } };
    if(ns==='sheet') return { get:function(){ return ui.sheet.draftDuration; }, set:function(v){ ui.sheet.draftDuration = v; } };
    if(ns==='quickAdd') return { get:function(){ return ui.quickAdd.duration; }, set:function(v){ ui.quickAdd.duration = v; } };
    return null;
  }
  function renderDurationStepper(duration, ns, label){
    return '<div class="stepper-row">'+stepperHtml(label||'소요 시간', formatDurationHM(duration),
      "appAction('durationStep','"+ns+"',-5)", "appAction('durationStep','"+ns+"',5)")+'</div>';
  }

  function tabBtn(key, icon, label){
    return '<button class="tabbtn'+(ui.tab===key?' active':'')+'" onclick="appAction(\'setTab\',\''+key+'\')">'+icon+'<span>'+label+'</span></button>';
  }
  function chip(label, active, onclick, small){
    return '<button class="chip'+(active?' active':'')+(small?' small':'')+'" onclick="'+onclick+'">'+esc(label)+'</button>';
  }
  function badge(text, tone){ return '<span class="badge badge-'+tone+'">'+esc(text)+'</span>'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function formatTopDate(){
    var dk = todayKey(); var p = dk.split('-').map(Number);
    var wd = WEEKDAY_LABELS[new Date(p[0],p[1]-1,p[2]).getDay()];
    return p[1]+'월 '+p[2]+'일 '+wd+'요일';
  }
  function curDateKey(){ return addDaysKey(todayKey(), ui.dayOffset); }

  // ── 오늘 화면 ──
  // 캐릭터는 복잡해 보인다는 피드백으로 빼고, 빈 원(자리표시자)만 남겼어요.
  function mascotSvg(size){
    size = size || 48;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" fill="none" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="28" fill="var(--accent-soft)" stroke="var(--border)" stroke-width="1.5"/>' +
      '</svg>';
  }

  // v36: 오늘 탭 리디자인 — 왼쪽 컬러 점 + "09:00 - 10:00" 시작-종료 시간 형식의 목록 항목.
  // (확인이 필요한 일정 / 오늘의 시간표 둘 다 같은 컴포넌트를 써서 톤을 통일했어요. 기능은 그대로예요.)
  function dayItemRow(row, live){
    var hm = parseHM(row.time);
    var html = '<div class="day-item" onclick="appAction(\'openSheet\',\''+row.entryId+'\')">' +
      '<span class="dot" style="background:'+itemColor(row.refId)+';"></span>' +
      '<span class="range">'+timeRangeShort(hm, row.duration)+'</span>' +
      '<div class="main"><div class="lbl">'+esc(row.label)+(row.isFixed?' <span style="font-size:10px;">📌</span>':'')+(row.isMiniVersion?' <span style="font-size:10.5px; font-weight:800; color:var(--accent);">· 가볍게</span>':'')+'</div>';
    if(row.memo) html += '<div class="memo">'+esc(row.memo)+'</div>';
    html += '</div>'+badge(statusLabel(live), statusTone(live))+'</div>';
    return html;
  }

  function renderToday(){
    var dateKey = curDateKey(); var now = new Date();
    var rows = buildTimetableForDate(dateKey);
    var nowMinutes = ui.dayOffset===0 ? now.getHours()*60+now.getMinutes() : -1;
    var rowsLive = rows.map(function(r){ return Object.assign({}, r, {live: deriveLiveStatus(r, nowMinutes)}); });
    var needsResult = ui.dayOffset===0 ? rowsLive.filter(function(r){ return r.live==='awaiting_result'; }) : [];
    var html = '';
    var briefing = ui.dayOffset===0 ? computeBriefing(dateKey, now) : null;

    // 상태창처럼 항상 보이는 "다음 일정까지 N분" 표시 — 알림을 안 보고 있어도 탭만 열면 바로 보여요.
    if(ui.dayOffset===0){
      var nextUp = computeNextUp(dateKey, now);
      if(nextUp){
        var nextUpText = nextUp.mode==='in_progress'
          ? '지금 "'+esc(nextUp.label)+'" 진행 중 · '+nextUp.minutesLeft+'분 후 종료'
          : '다음 일정까지 '+nextUp.minutesLeft+'분 · '+esc(nextUp.time)+' '+esc(nextUp.label);
        html += '<div class="next-up-bar'+(nextUp.mode==='in_progress'?' live':'')+'"><span class="dot"></span>'+nextUpText+'</div>';
      }
    }

    if(briefing){
      // 인사말 자리에 "나의 목표"를 크게 보여줘요 — 매번 열 때마다 자연스럽게 눈에 들어오게.
      // 아직 안 적었으면 그 자리가 바로 입력창이 돼요(따로 설정에 들어갈 필요 없이).
      html += '<div class="greet-card">';
      if(ui.goalEditOpen){
        html += '<div class="greet-text" style="flex:1;">' +
          '<input class="textfield" id="goal-edit-input" style="font-size:19px; font-weight:800; padding:7px 10px; margin-bottom:2px;" ' +
          'value="'+esc(ui.goalDraft)+'" placeholder="나의 목표를 적어보세요" ' +
          'oninput="appAction(\'goalDraftInput\',this.value)" ' +
          'onkeydown="if(event.key===\'Enter\'){this.blur();}" ' +
          'onblur="appAction(\'goalSave\')"/>' +
          '<div class="sub">완벽한 계획보다, 다시 이어가는 하루</div></div>';
      } else {
        var goalText = state.settings.myGoal;
        html += '<div class="greet-text" style="cursor:pointer;" onclick="appAction(\'openGoalEdit\')">' +
          '<div class="h1'+(goalText?'':' placeholder')+'">'+(goalText?esc(goalText):'나의 목표를 적어보세요')+'</div>' +
          '<div class="sub">완벽한 계획보다, 다시 이어가는 하루</div></div>';
      }
      html += '<div class="greet-mascot-col"><div class="greet-bubble">'+esc(briefing.headline)+'</div>'+mascotSvg(48)+'</div>' +
        '</div>';
      // v43: 컨디션 체크는 더 이상 오늘 탭에 따로 자리를 차지하지 않아요 — 기상 알림을 누르면
      // 그 흐름 안에서 한 번에 물어봐요(설정 → 기상 알림). 여기서 매번 노출하지 않아요.
    }

    if(needsResult.length>0){
      html += '<div class="section-title">확인이 필요한 일정 ('+needsResult.length+')</div>';
      html += '<div class="section-sub">시간이 지난 일정이에요. 어떻게 됐는지 알려주시면 다음 계획에 참고할게요.</div>';
      needsResult.forEach(function(r){ html += dayItemRow(r, r.live); });
    }

    // 지난 일들(이미 기록됐거나 결과 대기 중인 것)은 목록에서 빼고, 앞으로 남은 일정만 보여줘요.
    // 결과 대기 중인 항목은 위의 "확인이 필요한 일정"에서 이미 다루니까 여기선 중복하지 않아요.
    var remainingRows = rowsLive.filter(function(r){ return FINISHED.indexOf(r.live)===-1 && r.live!=='awaiting_result'; });
    // 공유하기 버튼은 오늘 탭엔 필요 없다는 피드백으로 빼고, 히스토리 탭에만 남겨뒀어요.
    html += '<div class="section-title">'+(ui.dayOffset===0?'오늘의 시간표':'내일의 시간표')+'</div>';
    if(remainingRows.length===0){
      html += '<div class="empty">'+(rowsLive.length>0 ? '앞으로 남은 일정이 없어요. 오늘 하루도 고생 많으셨어요.' : '등록된 일정이 없어요.<br>일정관리 탭이나 빠른 추가로 넣어보세요.')+'</div>';
    } else {
      remainingRows.forEach(function(r){ html += dayItemRow(r, r.live); });
    }

    // v40: 겹침 해결과 컨디션 조정을 완전히 분리했어요. 발생 원인(객관적 시간 충돌 vs 주관적 피로)과
    // 해야 할 행동(옮기기 vs 줄이기·건너뛰기)이 다른데 같은 화면에 섞이면 뭘 고치는 건지 헷갈려서예요.
    // 겹침이 있으면 먼저 그것부터 처리하고("순서대로"), 겹침이 없거나 해결/보류한 뒤에만 컨디션
    // 조정을 제안해요. 두 문제가 동시에 있어도 한 화면에 합치지 않아요.
    if(briefing){
      var showActions = state.settings.interventionLevel !== 'quiet';
      var hasFatigueTargets = hasAutoFatigueTrigger(dateKey);
      var overlapsToday = computeOverlapPairs(dateKey);
      var hasOverlaps = overlapsToday.length>0;

      if(showActions && hasOverlaps && !ui.overlapDismissed){
        // 크고 강한 그라데이션 버튼 대신, 눈에 띄지만 화면 전체를 지배하지 않는 인라인 경고 카드로.
        var ovDetail = esc(overlapsToday[0].a.label)+' · '+esc(overlapsToday[0].b.label) +
          (overlapsToday.length>1 ? ' 외 '+(overlapsToday.length-1)+'건' : '');
        html += '<div class="overlap-card">' +
          '<div class="oc-title">⚠️ 겹치는 일정이 '+overlapsToday.length+'건 있어요</div>' +
          '<div class="oc-detail">'+ovDetail+'</div>' +
          '<div class="oc-actions">' +
            '<button class="btn-oc-primary" onclick="appAction(\'openOverlapResolver\')">겹침 해결하기</button>' +
            '<button class="btn-oc-ghost" onclick="appAction(\'dismissOverlapToday\')">그대로 둘게요</button>' +
          '</div></div>';
      }

      // 겹침이 없을 때, 또는 겹침을 해결/보류한 뒤에만 컨디션 조정을 다음 단계로 제안해요.
      // hasFatigueTargets는 컨디션 체크에서 "안 좋음"이라고 답했을 때(또는 "적극적으로" 성향이
      // 객관적으로 일정 과다를 감지했을 때)만 true라서, 제안이 뜨는 것 자체가 이미 근거가 있는
      // 상황이에요.
      var autoCtaShown = showActions && !ui.briefingDismissed && hasFatigueTargets && (!hasOverlaps || ui.overlapDismissed);
      if(autoCtaShown){
        html += '<button class="reschedule-cta" onclick="appAction(\'openEnergyAdjustment\')">✨ 오늘 일정 다시 짜기</button>';
        html += '<button class="btn btn-ghost" style="margin-top:8px;" onclick="appAction(\'dismissBriefingAction\')">그대로 진행하기</button>';
      } else {
        // 자동 제안은 컨디션 체크에서 "안 좋음"이라고 직접 답했을 때만 나가요 — 체크인을
        // 안 했다고 "일정 조정하기" 자체를 못 찾게 되면 안 되니, 언제든 직접 눌러서 수동
        // 선택·AI 요청으로 갈 수 있는 입구를 늘 남겨둬요(비서 성향과 무관하게 항상 보여요 —
        // 이건 먼저 나서는 제안이 아니라 사용자가 직접 누르는 버튼이라서요).
        var manualAdjustable = computeManualAdjustOptions(dateKey, now);
        var hasManualTargets = manualAdjustable.withMinVersion.length>0 || manualAdjustable.withoutMinVersion.length>0;
        if(hasManualTargets && (!hasOverlaps || ui.overlapDismissed)){
          html += '<button class="btn btn-ghost" style="margin-top:4px;" onclick="appAction(\'chatOpenFatigue\')">일정 조정하기</button>';
        }
      }
    }

    return html;
  }

  // ── 행동 시트 (상태별로 다른 버튼) ──
  function findRow(entryId, dateKey){
    var rows = buildTimetableForDate(dateKey);
    for(var i=0;i<rows.length;i++) if(rows[i].entryId===entryId) return rows[i];
    return null;
  }
  function computePhase(live){
    if(live==='upcoming') return 'future';
    if(live==='in_progress') return 'in_progress';
    if(live==='awaiting_result') return 'awaiting_result';
    return 'recorded';
  }

    var body = '';

      body += btn('계속 진행 중이에요 (20분 뒤 다시 확인)', 'secondary', "appAction('sheetKeepInProgress')");
      body += btn('시간·소요시간 조정', 'secondary', "appAction('sheetSetView','adjustDuration')");

    } else if(view==='main' && phase==='awaiting_result'){
      body += '<div class="sheet-sub">결과를 기록해주세요</div><div style="margin-top:14px;">';

      body += btn('조금 했어요', 'secondary', "appAction('sheetChooseResult','done_partial')");
      body += btn('못했어요', 'secondary', "appAction('sheetChooseResult','done_none')");

      body += btn('상세 설정', 'ghost', "appAction('sheetViewDetail')");
      body += '</div>';
    } else if(view==='recordedEdit'){
      body += '<div class="sheet-sub">다시 기록할 내용을 골라주세요</div><div style="margin-top:14px;">';
      body += btn('완료했어요', 'primary', "appAction('sheetChooseResult','done_full')");
      body += btn('조금 했어요', 'secondary', "appAction('sheetChooseResult','done_partial')");
      body += btn('못했어요', 'secondary', "appAction('sheetChooseResult','done_none')");
      body += btn('건너뛸게요', 'ghost', "appAction('sheetChooseResult','skipped')");
      body += btn('뒤로', 'ghost', "appAction('sheetSetView','main')");
      body += '</div>';
    } else if(view==='snooze'){

      body += btn('10분 뒤', 'primary', "appAction('sheetSnooze',10)");
      body += btn('30분 뒤', 'secondary', "appAction('sheetSnooze',30)");
      body += btn('뒤로', 'ghost', "appAction('sheetSetView','main')");
      body += '</div>';
    } else if(view==='adjustTime'){

      body += '<div style="margin-top:14px;">'+btn('이 시간으로 저장', 'primary', "appAction('sheetApplyAdjustTime')")+btn('뒤로', 'ghost', "appAction('sheetSetView','main')")+'</div>';
    } else if(view==='adjustDuration'){

      body += renderTimeStepper(s.draftTime, 'sheet');

      body += '<div style="margin-top:14px;">'+btn('저장', 'primary', "appAction('sheetApplyAdjustDuration')")+btn('뒤로', 'ghost', "appAction('sheetSetView','main')")+'</div>';

      Object.keys(REASON_LABEL).forEach(function(k){ body += chip(REASON_LABEL[k], false, "appAction('sheetChooseReason','"+k+"')"); });
      body += '</div>'+btn('건너뛰기', 'ghost', "appAction('sheetClose')");

      body += '<div class="sheet-sub">얼마나 하셨는지 알려주시면 다음 계획에 참고할게요 (선택이에요)</div><div class="preset-row" style="justify-content:flex-start;">';
      Object.keys(PARTIAL_DEGREE_LABEL).forEach(function(k){ body += chip(PARTIAL_DEGREE_LABEL[k], false, "appAction('sheetChooseDegree','"+k+"')"); });
      body += '</div>'+btn('건너뛰기', 'ghost', "appAction('sheetSetView','replan')");
    } else if(view==='replan'){
      body += '<div class="sheet-sub">이 일정, 어떻게 할까요?</div><div style="margin-top:14px;">';
      body += btn('오늘 다시 잡기', 'secondary', "appAction('sheetSetView','adjustTime')");
      if(row.kind==='adhoc') body += btn('내일로 옮기기', 'secondary', "appAction('sheetMoveTomorrow')");
